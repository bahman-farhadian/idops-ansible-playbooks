---
- name: Prepare template target inventory
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/template-config.yml
    # Every tracked value above is blank: it exists to document the setting,
    # not to be deployed with. This is the only source of real values, and it
    # is required - see the "Fail when settings.local.yml is missing" task
    # below. Loaded last so it wins; *.local.yml is never committed.
    - vars/settings.local.yml
  vars:
    template_action: "{{ template_action | default('provision') }}"

  tasks:
    - name: Check for the machine-specific settings file
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vars/settings.local.yml"
      register: template_local_settings_file
      changed_when: false

    # A missing vars_files entry is silently skipped by Ansible rather than
    # failing, so every setting above would otherwise stay blank with no
    # warning. Every tracked value is blank on purpose, so there is no
    # working fallback to fall through to.
    - name: Fail when settings.local.yml is missing
      ansible.builtin.fail:
        msg: >-
          vars/settings.local.yml is required and was not found. Every
          tracked setting is a blank placeholder; this file is the only
          place real values live. Generate a starting point with:
          make settings
      when: not template_local_settings_file.stat.exists

    - name: Load the machine-specific override file for reporting
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/settings.local.yml"
        name: template_local_overrides
      when: template_local_settings_file.stat.exists

    - name: Report which settings come from the override file
      ansible.builtin.debug:
        msg: >-
          vars/settings.local.yml is in effect and overrides
          {{ template_local_overrides | length }} setting(s):
          {{ template_local_overrides.keys() | list | join(', ') }}.
          Edit those there; the same keys in vars/template-config.yml are ignored.
      when: template_local_settings_file.stat.exists

    - name: Validate requested action
      ansible.builtin.assert:
        that:
          - template_action in ['provision', 'cleanup', 'ping']
        fail_msg: "template_action must be 'provision', 'cleanup', or 'ping'."

    - name: Add managed target to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ template_target_host }}"
        groups: managed_target
        ansible_python_interpreter: "{{ template_target_python_interpreter }}"

- name: Run template action on target
  hosts: managed_target
  gather_facts: false
  vars_files:
    - vars/template-config.yml
    # Required; see the matching comment and fail task in the first play,
    # which always runs first and aborts the whole run when this is missing.
    - vars/settings.local.yml
  vars:
    template_action: "{{ template_action | default('provision') }}"

  tasks:
    - name: Run template provision workflow
      ansible.builtin.include_tasks: tasks/provision.yml
      when: template_action == 'provision'

    - name: Run template cleanup workflow
      ansible.builtin.include_tasks: tasks/cleanup.yml
      when: template_action == 'cleanup'

    - name: Run template ping workflow
      ansible.builtin.include_tasks: tasks/ping.yml
      when: template_action == 'ping'
