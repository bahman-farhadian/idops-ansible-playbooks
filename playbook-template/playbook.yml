---
- name: Prepare template target inventory
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/template-config.yml
    # The file above has generic defaults that are safe to keep in git.
    # Real hosts and keys live in a gitignored *.local.yml file
    # selected with template_local_settings_file. There is no default.
    # The dummy path exists only so ansible-lint --syntax-check can parse
    # this entry; it is not a settings file. Loaded last so a real file wins.
    - "{{ template_local_settings_file | default('vars/.syntax-check.local.yml') }}"
  vars:
    template_action: "{{ template_action | default('provision') }}"
    template_selected_local_settings_file: "{{ template_local_settings_file | default('') }}"
    template_local_settings_path: >-
      {{
        template_selected_local_settings_file
        if template_selected_local_settings_file is match('^/')
        else (playbook_dir ~ '/' ~ template_selected_local_settings_file)
      }}

  tasks:
    - name: Fail when no local settings file was selected
      ansible.builtin.fail:
        msg: >-
          No local settings file was selected. There is no default.
          Run: make <target> LOCAL_SETTINGS_FILE=vars/settings.local.yml
      when: template_selected_local_settings_file | length == 0

    # search, not match: match is start-anchored and rejects
    # vars/settings.local.yml (and every other relative path).
    - name: Validate selected local settings file name
      ansible.builtin.assert:
        that:
          - template_selected_local_settings_file is search('\\.local\\.yml$')
        fail_msg: >-
          template_local_settings_file must end with .local.yml
          (got '{{ template_selected_local_settings_file }}').
          Example: LOCAL_SETTINGS_FILE=vars/settings.local.yml

    - name: Check for the machine-specific settings file
      ansible.builtin.stat:
        path: "{{ template_local_settings_path }}"
      register: template_local_override_file
      changed_when: false

    # A missing vars_files entry is silently skipped by Ansible rather than
    # failing, so a missing local settings file would leave real credentials
    # and the real target undefined with no warning, not merely fall back
    # to a documented default - there is no real target to fall back to.
    - name: Fail when the selected local settings file is missing
      ansible.builtin.fail:
        msg: >-
          {{ template_selected_local_settings_file }} was not found.
          Put the real target and keys in this file. Tracked vars files
          only have generic defaults. Create it with:
          make settings LOCAL_SETTINGS_FILE={{ template_selected_local_settings_file }}
      when: not template_local_override_file.stat.exists

    - name: Load the machine-specific override file for reporting
      ansible.builtin.include_vars:
        file: "{{ template_local_settings_path }}"
        name: template_local_overrides
      when: template_local_override_file.stat.exists

    - name: Report which settings come from the override file
      ansible.builtin.debug:
        msg: >-
          Using {{ template_selected_local_settings_file }}.
          It sets {{ template_local_overrides | length }} key(s):
          {{ template_local_overrides.keys() | list | join(', ') }}.
          Edit those keys in that file. The same keys in
          vars/template-config.yml are ignored.
      when: template_local_override_file.stat.exists

    - name: Validate requested action
      ansible.builtin.assert:
        that:
          - template_action in ['provision', 'cleanup', 'ping']
        fail_msg: "template_action must be 'provision', 'cleanup', or 'ping'."

    - name: Add managed target to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ template_target_host }}"
        groups: managed_target
        ansible_python_interpreter: "{{ template_target_python_interpreter }}"

- name: Run template action on target
  hosts: managed_target
  gather_facts: false
  vars_files:
    - vars/template-config.yml
    # Required; same selected local file as the first play. No default.
    - "{{ template_local_settings_file | default('vars/.syntax-check.local.yml') }}"
  vars:
    template_action: "{{ template_action | default('provision') }}"

  tasks:
    - name: Run template provision workflow
      ansible.builtin.include_tasks: tasks/provision.yml
      when: template_action == 'provision'

    - name: Run template cleanup workflow
      ansible.builtin.include_tasks: tasks/cleanup.yml
      when: template_action == 'cleanup'

    - name: Run template ping workflow
      ansible.builtin.include_tasks: tasks/ping.yml
      when: template_action == 'ping'
