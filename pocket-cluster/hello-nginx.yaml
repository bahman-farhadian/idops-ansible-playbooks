# Stateless nginx: six identical Pods behind one Service.
# The page body is the Pod hostname so you can see load-balancing.
# Service NodePort 30080 matches extraPortMappings on the control-plane
# (host 8080 -> node 30080). Apply with: kubectl apply -f hello-nginx.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-nginx
  namespace: demo
data:
  default.conf: |
    server {
        listen 80 default_server;
        server_name _;
        access_log /dev/stdout;
        error_log /dev/stderr;
        location / {
            default_type text/plain;
            return 200 "Pocket Cluster\npod=$hostname\n";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-nginx
  namespace: demo
  labels:
    app: hello-nginx
spec:
  replicas: 6
  selector:
    matchLabels:
      app: hello-nginx
  template:
    metadata:
      labels:
        app: hello-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
      volumes:
        - name: nginx-config
          configMap:
            name: hello-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: hello-nginx
  namespace: demo
  labels:
    app: hello-nginx
spec:
  type: NodePort
  selector:
    app: hello-nginx
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
