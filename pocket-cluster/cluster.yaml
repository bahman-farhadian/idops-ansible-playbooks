# Pocket Cluster — small Docker Kubernetes for CKAD and app practice.
#
# Kubernetes version is the `image:` tag on every node.
# There is no kubernetesVersion key in kind config.
# Use the same image on the control plane and on each worker.
#
# Shape: one control plane, two workers. Extra workers help with
# DaemonSet, nodeSelector, and spread. Extra control planes do not add
# HA here: every node is a container on one Docker host.
#
# kind names the first worker pocket-worker, then pocket-worker2.
# Custom names (worker1, worker2) are not in kind config.
#
# labels: node-role.kubernetes.io/worker is what kubectl get nodes
# shows in the ROLES column. kind role: worker only joins the node.
#
# extraPortMappings publish node :80 and :443 on the laptop at 8080 and 8443
# (unprivileged host ports).

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pocket
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.37.0
    labels:
      node-role.kubernetes.io/worker: worker
  - role: worker
    image: kindest/node:v1.37.0
    labels:
      node-role.kubernetes.io/worker: worker

