# Traefik on kind. NodePorts match extraPortMappings on the control-plane:
# host 8080 -> node 30080 (web), host 8443 -> node 30443 (websecure).
service:
  type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443
ingressClass:
  enabled: true
  isDefaultClass: true
providers:
  kubernetesIngress:
    enabled: true
