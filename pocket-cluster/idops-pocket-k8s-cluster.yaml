# Pocket Cluster — small Docker Kubernetes for CKAD and app practice.
#
# Kubernetes version is the `image:` tag on every node.
# There is no kubernetesVersion key in kind config.
# Use the same image on the control plane and on each worker.
#
# Cluster name is idops-pocket-k8s-cluster. kind then names nodes
# idops-pocket-k8s-cluster-control-plane, ...-worker, ...-worker2.
# There is no worker1. kind config has no hostname field.
#
# Shape: one control plane, two workers. Extra workers help with
# DaemonSet, nodeSelector, and spread. Extra control planes do not add
# HA here: every node is a container on one Docker host.
#
# kind Cluster YAML has no cpu/memory fields (kind v1alpha4). Adding them
# makes kind create fail. Caps live in the pocket.* comments below.
# k8s_lab_start reads them and runs docker update. Confirm with docker stats
# (MEM USAGE / LIMIT). docker ps does not show RAM. kubectl get nodes may
# still print host RAM; kubelet reads /proc/meminfo.
#
# pocket.cpus.control-plane: 2
# pocket.memory.control-plane: 3g
# pocket.cpus.worker: 2
# pocket.memory.worker: 2g
#
# Do not set node-role.kubernetes.io/* here. kind passes extra labels to
# kubelet --node-labels. kubelet refuses reserved kubernetes.io labels and
# the worker kubelet never becomes healthy. Set the worker role after
# create with kubectl label (k8s_lab_start does this).
#
# extraPortMappings publish node :80 and :443 on the laptop at 8080 and 8443
# (unprivileged host ports).

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: idops-pocket-k8s-cluster
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0

# ---------------------------------------------------------------------------
