# NodePort 30080 matches extraPortMappings on the control-plane
# (laptop :8080 -> node :30080).
apiVersion: v1
kind: Service
metadata:
  name: hello-nginx
  namespace: demo
  labels:
    app: hello-nginx
spec:
  type: NodePort
  selector:
    app: hello-nginx
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
