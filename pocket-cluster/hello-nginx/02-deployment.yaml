# Six identical nginx Pods. Stateless: any replica can serve any request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-nginx
  namespace: idops-nginx-demo
  labels:
    app: hello-nginx
spec:
  replicas: 6
  selector:
    matchLabels:
      app: hello-nginx
  template:
    metadata:
      labels:
        app: hello-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
      volumes:
        - name: nginx-config
          configMap:
            name: hello-nginx
