# Ingress for Cloud Provider KIND. No host, no IngressClass.
# Curl the ADDRESS IP: kubectl get ingress -n idops-nginx-demo
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-nginx
  namespace: idops-nginx-demo
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-nginx
                port:
                  number: 80
