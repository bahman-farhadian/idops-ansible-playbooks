---
# Every entry here uses `apply: tags: [...]` alongside its own `tags:`.
# include_role is a dynamic include, and a tag on a dynamic include only
# ever decides whether the include statement itself runs - it does not
# propagate into the role's own tasks, which have no tags of their own.
# Without `apply`, `make role-<name>` (--tags <name>) reached this file
# (tasks/harden.yml's own include_role is tagged always) and correctly
# selected the matching include_role step here, but every task inside the
# role it pointed at was silently skipped for lacking that tag itself.
- name: Apply network identity hardening baseline
  ansible.builtin.include_role:
    name: network_identity
    apply:
      tags: [network_identity]
  when: os_hardening_enabled | bool
  tags: [network_identity]

