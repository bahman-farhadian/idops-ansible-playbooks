---
# Adopted from https://github.com/bahman-farhadian/linux_terminal_dotfiles_configuration
# tmux and vim only - bash_profile/bash_aliases/bashrc are adopted in full by
# prep_baseline instead, as part of its own preparation baseline. Deliberately
# excluded, and left to the roles that already own them: the SSH login banner
# and /etc/motd (banner_hardening), and SSH server policy such as
# PermitRootLogin (ssh_hardening). Also excluded: the source repository's own
# SSH *client* config (StrictHostKeyChecking no) and every desktop-only piece
# (GNOME shortcuts, the keyboard-lock service, GTK theming) - none of it
# applies to a headless guest.
terminal_dotfiles_enabled: true

# The source project configures root by asking interactively; there is no
# equivalent question in an unattended run, so it is a plain switch here.
terminal_dotfiles_configure_root: true
