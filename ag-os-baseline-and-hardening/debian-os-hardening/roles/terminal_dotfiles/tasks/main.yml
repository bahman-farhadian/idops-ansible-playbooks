---
# Configures the primary user (and, unless disabled, root) with the shared
# tmux/vim set. Runs after prep_baseline, which is where
# prep_primary_user_name / prep_primary_user_home are set, tmux and vim are
# already installed as required packages, and bash_profile/bash_aliases/
# bashrc are adopted in full as prep_baseline's own preparation baseline.

- name: Build list of accounts to configure
  ansible.builtin.set_fact:
    terminal_dotfiles_targets: >-
      {{
        [{'name': prep_primary_user_name, 'home': prep_primary_user_home}]
        + (
            [{'name': 'root', 'home': '/root'}]
            if terminal_dotfiles_configure_root | bool
            else []
          )
      }}
  when: terminal_dotfiles_enabled | bool

- name: Deploy tmux configuration
  ansible.builtin.copy:
    src: tmux.conf
    dest: "{{ item.home }}/.tmux.conf"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0644"
  loop: "{{ terminal_dotfiles_targets }}"
  loop_control:
    label: "{{ item.name }}"
  when: terminal_dotfiles_enabled | bool

- name: Deploy vim configuration and plugins
  ansible.builtin.copy:
    src: vim/
    dest: "{{ item.home }}/.vim/"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: preserve
    directory_mode: "0755"
  loop: "{{ terminal_dotfiles_targets }}"
  loop_control:
    label: "{{ item.name }}"
  when: terminal_dotfiles_enabled | bool

- name: Symlink .vimrc to the deployed vim configuration
  ansible.builtin.file:
    src: "{{ item.home }}/.vim/vimrc"
    dest: "{{ item.home }}/.vimrc"
    state: link
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    force: true
  loop: "{{ terminal_dotfiles_targets }}"
  loop_control:
    label: "{{ item.name }}"
  when: terminal_dotfiles_enabled | bool
