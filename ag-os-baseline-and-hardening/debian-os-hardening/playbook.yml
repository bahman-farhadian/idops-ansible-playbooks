---
- name: Validate requested hardening action
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/debian-hardening.yml
    # Every tracked value above is blank: it exists to document the setting,
    # not to be deployed with. This is the only source of real values, and it
    # is required - see the "Fail when settings.local.yml is missing" task
    # below. Loaded last so it wins; *.local.yml is never committed.
    - vars/settings.local.yml
  vars:
    debian_hardening_action_effective: "{{ debian_hardening_action | default('harden') }}"

  tasks:
    - name: Check for the machine-specific settings file
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vars/settings.local.yml"
      register: debian_hardening_local_settings_file
      changed_when: false

    # A missing vars_files entry is silently skipped by Ansible rather than
    # failing, so every setting above would otherwise stay blank with no
    # warning. Every tracked value is blank on purpose, so there is no
    # working fallback to fall through to.
    - name: Fail when settings.local.yml is missing
      ansible.builtin.fail:
        msg: >-
          vars/settings.local.yml is required and was not found. Every
          tracked setting is a blank placeholder; this file is the only
          place real values live. Generate a starting point with:
          make settings
      when: not debian_hardening_local_settings_file.stat.exists

    - name: Validate hardening action value
      ansible.builtin.assert:
        that:
          - >-
            debian_hardening_action_effective in
            ['ping', 'scan', 'harden', 'reboot', 'ssh-check', 'runtime-check']
        fail_msg: >-
          debian_hardening_action must be one of: ping, scan, harden, reboot,
          ssh-check, runtime-check.

    - name: Validate at least one hardening target is declared
      ansible.builtin.assert:
        that:
          - debian_hardening_targets is defined
          - (debian_hardening_targets | length) > 0
        fail_msg: >-
          Declare at least one target in debian_hardening_targets
          (vars/debian-hardening.yml / settings.local.yml).

    - name: Validate hardening target names
      ansible.builtin.assert:
        that:
          - item.name is defined
          - (item.name | string | length) > 0
          - item.name is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$')
        fail_msg: >-
          Target name '{{ item.name | default('unnamed') }}' is invalid. Use
          letters, digits, dot, dash or underscore, starting with a letter or
          digit, up to 63 characters.
      loop: "{{ debian_hardening_targets }}"
      loop_control:
        label: "{{ item.name | default('unnamed') }}"

    - name: Validate hardening target ports
      ansible.builtin.assert:
        that:
          - (item.port | default(22) | int) > 0
          - (item.port | default(22) | int) <= 65535
        fail_msg: >-
          Target '{{ item.name }}' has an invalid port (got
          {{ item.port | default(22) }}); must be 1-65535.
      loop: "{{ debian_hardening_targets }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Validate hardening target names are unique
      ansible.builtin.assert:
        that:
          - debian_hardening_targets | map(attribute='name') | list | length
            ==
            debian_hardening_targets | map(attribute='name') | list | unique | length
        fail_msg: "Target names must be unique in debian_hardening_targets."

    # Empty user collapses to omit so the SSH client keeps falling back to
    # the operator's own ssh config instead of receiving a blank value.
    - name: Add hardening targets to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: hardening_targets
        ansible_host: "{{ item.address | default(item.name, true) }}"
        ansible_user: "{{ (item.user | default('', true)) or omit }}"
        ansible_port: "{{ item.port | default(22) }}"
        ansible_become_password: "{{ (item.become_password | default('', true)) or omit }}"
      loop: "{{ debian_hardening_targets }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: Display resolved hardening targets
      ansible.builtin.debug:
        msg: >-
          targets={{ debian_hardening_targets | map(attribute='name') | list }}

- name: Execute Debian hardening action
  hosts: hardening_targets
  become: "{{ debian_become_enabled | default(true) | bool }}"
  become_method: "{{ debian_become_method | default('sudo') }}"
  become_user: "{{ debian_become_user | default('root') }}"
  gather_facts: "{{ debian_hardening_action_effective in ['scan', 'harden'] }}"
  vars_files:
    - vars/debian-hardening.yml
    # Required; see the matching comment and fail task in the first play,
    # which always runs first and aborts the whole run when this is missing.
    - vars/settings.local.yml
  vars:
    debian_hardening_action_effective: "{{ debian_hardening_action | default('harden') }}"

  pre_tasks:
    - name: Load optional local secrets overrides
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/vars"
        files_matching: '^local-secrets\.yml$'
        ignore_unknown_extensions: true

    - name: Run hardening preflight checks for OS support
      ansible.builtin.include_tasks: tasks/preflight.yml
      when: debian_hardening_action_effective in ['scan', 'harden']

  tasks:
    - name: Run connectivity workflow
      ansible.builtin.include_tasks: tasks/ping.yml
      when: debian_hardening_action_effective == 'ping'

    - name: Run Lynis baseline scan workflow
      ansible.builtin.include_tasks: tasks/scan.yml
      when: debian_hardening_action_effective == 'scan'

    - name: Run OS hardening workflow
      ansible.builtin.include_tasks: tasks/harden.yml
      when: debian_hardening_action_effective == 'harden'
      tags: always

    - name: Run reboot workflow
      ansible.builtin.include_tasks: tasks/reboot.yml
      when: debian_hardening_action_effective == 'reboot'

    - name: Run SSH hardening check workflow
      ansible.builtin.include_tasks: tasks/ssh-check.yml
      when: debian_hardening_action_effective == 'ssh-check'

    - name: Run runtime diagnostics workflow
      ansible.builtin.include_tasks: tasks/runtime-check.yml
      when: debian_hardening_action_effective == 'runtime-check'
