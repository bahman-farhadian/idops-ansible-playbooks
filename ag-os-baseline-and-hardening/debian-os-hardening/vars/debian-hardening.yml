---
# Debian OS hardening configuration
# Single source of user-editable settings.

# -----------------------------------------------------------------------------
# Workflow control
# -----------------------------------------------------------------------------
# Not blanked like the settings below: playbook.yml resolves this as the
# play-level `hosts:` keyword at parse time, before settings.local.yml's
# fail-guard task ever runs, so a blank value here breaks make check/make
# lint outright. This is playbook wiring (which inventory group this run
# targets), not per-environment data - the same role kvm-vm-provisioning
# fills with a literal `hosts: hypervisor`.
debian_hardening_target_group: "hardening_targets" # Inventory group targeted by playbook.yml.
debian_become_enabled: ~                             # Run remote tasks with privilege escalation.
debian_become_method: ""                            # Privilege escalation method. Values: sudo | su | doas.
debian_become_user: ""                              # Privilege escalation target user.

# -----------------------------------------------------------------------------
# APT repository settings
# -----------------------------------------------------------------------------
common_repos_enabled: ~                                                # Set to false to skip the common_repos role entirely.
apt_repository_url: ""                  # Debian base mirror URI (URL only — no deb/suite/components).
apt_security_repository_url: "" # Debian security mirror URI.
apt_debian_release_override: ""                                           # Optional suite override (empty = fact-based map).
apt_debian_disable_conflicting_sources: ~                              # Disable conflicting Debian source entries in sources.list.d.
apt_debian_components: [] # Repository components for Debian hosts.
# Example (was the live default; see local settings for real values):
# apt_debian_components:
#  - main
#  - contrib
#  - non-free
#  - non-free-firmware

# -----------------------------------------------------------------------------
# Lynis settings
# -----------------------------------------------------------------------------
lynis_repo_url: ""                   # Lynis git repository URL.
lynis_repo_version: ""                                        # Lynis git revision/tag/branch.
lynis_install_path: ""                                    # Lynis install directory on target.
lynis_report_output_dir: ""       # Control-node report output path.
lynis_quick_mode: ~                                              # Run Lynis in quick mode.
lynis_offline_bundle_from_control_node: ~                        # True: clone+bundle on control node, then copy tar to target.
lynis_control_cache_dir: "" # Control-node cache path for commit-tagged Lynis tar bundles.

# -----------------------------------------------------------------------------
# Preparation baseline
# -----------------------------------------------------------------------------
prep_enabled: ~                                # Enable preparation baseline role.
prep_root_authorized_keys: []                     # Root authorized keys.
prep_manage_primary_user: ~                    # Manage primary UID user baseline.
prep_primary_user_uid: ""                     # UID used to identify primary template user.
prep_primary_user_desired_name: ""           # Desired primary user name (empty keeps detected name).
prep_replace_primary_user: ~                  # Replace detected UID user with desired name.
prep_enforce_single_login_user: ~             # Remove other human login users when true.
prep_primary_user_authorized_keys: []             # Primary user authorized keys.
prep_manage_primary_user_password: ~           # Set/rotate password for detected or renamed UID 1000 user.
prep_primary_user_plain_password: "" # Primary user plaintext password. CHANGE THIS.
prep_manage_root_password: ~                   # Set/rotate root account password.
prep_root_plain_password: ""         # Root user plaintext password. CHANGE THIS.

# -----------------------------------------------------------------------------
# Terminal dotfiles (tmux, vim, bash prompt/history/completion)
# Adopted from linux_terminal_dotfiles_configuration; the SSH banner, /etc/motd
# and SSH server policy stay owned by banner_hardening and ssh_hardening below.
# -----------------------------------------------------------------------------
terminal_dotfiles_enabled: ~            # Enable terminal dotfiles role.
terminal_dotfiles_configure_root: ~     # Also configure root, not just the primary user.

# -----------------------------------------------------------------------------
# Boot and runlevel hardening
# -----------------------------------------------------------------------------
boot_hardening_enabled: ~               # Enable boot hardening role.
boot_set_default_target: ~              # Set default systemd target.
boot_default_target: ""   # Default target value.
boot_fix_runlevel_debian13: ~           # Apply Debian 13 runlevel compatibility adjustments.
boot_runlevel_compat_wrapper_enabled: ~ # Deploy runlevel compatibility wrapper when needed.
boot_manage_kernel_symlink_compat: ~    # Create /vmlinuz and /boot/vmlinuz compatibility symlinks when missing.

# -----------------------------------------------------------------------------
# Network identity hardening
# -----------------------------------------------------------------------------
network_identity_manage_hosts: ~                         # Manage /etc/hosts.
network_identity_manage_resolv_conf: ~                   # Manage /etc/resolv.conf.
network_identity_manage_systemd_resolved_when_symlink: ~ # When resolv.conf is a symlink, manage DNS via systemd-resolved drop-in.
network_identity_primary_ipv4: ""                           # Optional primary IPv4 for host mapping.
network_identity_nameservers: [] # Resolver list for resolv.conf.
# Example (was the live default; see local settings for real values):
# network_identity_nameservers:
#  - "8.8.8.8"
network_identity_search_domains: [] # Search domain list.
network_identity_set_hostname: ~ # Enforce hostname on target.
network_identity_hostname: ""        # Computed short hostname (left-most label of FQDN).
# Example (was the live default; see local settings for real values):
# network_identity_hostname: >-        # Computed short hostname (left-most label of FQDN).
#  {{
#    (
#      network_identity_fqdn
#      if (network_identity_fqdn | length > 0)
#      else inventory_hostname
#    ).split('.')[0]
#  }}
network_identity_fqdn: ""             # Computed FQDN fallback (<inventory_hostname>.localdomain when needed).
# Example (was the live default; see local settings for real values):
# network_identity_fqdn: >             # Computed FQDN fallback (<inventory_hostname>.localdomain when needed).
#  {{
#    inventory_hostname
#    if '.' in inventory_hostname
#    else inventory_hostname ~ '.localdomain'
#  }}
network_identity_manage_loopback_fqdn: ~           # Ensure loopback FQDN mapping.
network_identity_manage_hosts_via_template: ~      # Render /etc/hosts from template.
network_identity_cleanup_stale_hostname_entries: ~ # Remove stale hostname entries from hosts file.
network_identity_extra_hosts_entries: []              # Additional static /etc/hosts lines.
network_identity_local_repo_hosts_enabled: ~      # Enable static local repo host mappings.
network_identity_local_repo_hosts_entries: []         # Local repo host mapping entries.

# -----------------------------------------------------------------------------
# Package and update hardening
# -----------------------------------------------------------------------------
package_hardening_enabled: ~                    # Set to false to skip the package_hardening role entirely.
package_hardening_enable_unattended_upgrades: ~ # Enable unattended-upgrades.
package_hardening_run_dist_upgrade: ~           # Run dist-upgrade as part of hardening.
package_hardening_debsums_cron_check: ""     # Debsums periodic check frequency.
package_hardening_purge_removed_packages: ~     # Purge residual removed packages.
package_hardening_enable_lynis_dnssec_probe_support: ~ # Install DNSSEC probe tooling for Lynis (systemd-resolved/resolvectl) when missing.
package_hardening_enable_lynis_exim_probe_support: ~   # Install/start local Exim for Lynis mail checks when missing.

# -----------------------------------------------------------------------------
# Service hardening
# -----------------------------------------------------------------------------
service_hardening_enabled: ~     # Set to false to skip the service_hardening role entirely.     # Enable systemd service hardening drop-ins.
service_hardening_units: [] # Services to harden.
# Example (was the live default; see local settings for real values):
# service_hardening_units:
#  - ssh.service
#  - fail2ban.service
#  - rsyslog.service
#  - cron.service
#  - unattended-upgrades.service
service_hardening_disable_units: [] # Optional service units to stop/disable.

# -----------------------------------------------------------------------------
# Authentication hardening
# -----------------------------------------------------------------------------
auth_apply_to_existing_local_users: ~ # Apply auth policies to existing users.
auth_apply_to_root: ~                 # Apply auth policies to root account.
auth_skip_users: []                      # Users excluded from auth policy updates.

# -----------------------------------------------------------------------------
# SSH hardening
# -----------------------------------------------------------------------------
ssh_port: ~                 # SSH port enforced by hardening.
# SSH password authentication is always disabled by this hardening profile.
# Root SSH login is always forced to key-only mode: PermitRootLogin prohibit-password.
ssh_allowed_users: []          # Optional explicit allowed SSH users.
ssh_disable_pam_motd: ~     # Disable PAM MOTD output.
ssh_print_last_log: ~       # Show last login information.
ssh_clean_login_output: ~   # Reduce noisy login output.
ssh_disable_motd_news: ~    # Disable motd-news on Debian/Ubuntu.

# -----------------------------------------------------------------------------
# Login banners
# -----------------------------------------------------------------------------
banner_issue_text: ""      # Local login banner text (/etc/issue).
# Example (was the live default; see local settings for real values):
# banner_issue_text: |      # Local login banner text (/etc/issue).
#  +------------------------------------------------------------------+
#  | IDOPS SECURITY NOTICE                                            |
#  | AUTHORIZED USE ONLY - MONITORED SYSTEM                           |
#  |                                                                  |
#  | This system and all connected resources are restricted to        |
#  | approved users of the IdOps platform.                            |
#  |                                                                  |
#  | Actions are logged, audited, and attributable.                   |
#  | Unauthorized access is prohibited and may be prosecuted.         |
#  | Disconnect now if you are not authorized.                        |
#  +------------------------------------------------------------------+
banner_issue_net_text: ""  # Remote login banner text (/etc/issue.net).
# Example (was the live default; see local settings for real values):
# banner_issue_net_text: |  # Remote login banner text (/etc/issue.net).
#  +------------------------------------------------------------------+
#  | IDOPS SSH SECURITY NOTICE                                        |
#  | AUTHORIZED ACCESS ONLY - SESSION RECORDING ENABLED               |
#  |                                                                  |
#  | This SSH endpoint is part of the IdOps-managed environment.      |
#  | All login attempts and commands are monitored and logged.        |
#  |                                                                  |
#  | Unauthorized use is forbidden and may result in legal action.    |
#  | Disconnect now if you are not explicitly authorized.             |
#  +------------------------------------------------------------------+

# -----------------------------------------------------------------------------
# Kernel and module hardening
# -----------------------------------------------------------------------------
kernel_sysctl_dropin_path: "" # Sysctl drop-in file path.
kernel_disable_usb_storage: ~                                # Disable usb-storage module.
kernel_disable_firewire_storage: ~                           # Disable firewire storage module.
kernel_disable_core_dumps: ~                                 # Disable core dumps.
kernel_lock_module_loading: ~                               # Lock module loading after boot (high impact).

# -----------------------------------------------------------------------------
# File permissions hardening
# -----------------------------------------------------------------------------
file_permissions_hardening_enabled: ~ # Enable permissions hardening role.

# -----------------------------------------------------------------------------
# Integrity tooling
# -----------------------------------------------------------------------------
integrity_hardening_enabled: ~            # Set to false to skip the integrity_hardening role entirely.
integrity_initialize_aide: ~             # Initialize AIDE database.
integrity_aide_checksum_algorithm: "" # AIDE checksum algorithm.

# -----------------------------------------------------------------------------
# Remote syslog forwarding
# -----------------------------------------------------------------------------
remote_syslog_enabled: ~  # Enable remote rsyslog forwarding.
remote_syslog_host: ""        # Remote syslog hostname/IP.
remote_syslog_port: ~       # Remote syslog port.
remote_syslog_protocol: "" # Remote syslog protocol.

# -----------------------------------------------------------------------------
# Firewall policy (iptables-persistent)
# -----------------------------------------------------------------------------
firewall_default_input_policy: ""       # Default INPUT policy.
firewall_default_forward_policy: ""     # Default FORWARD policy.
firewall_default_output_policy: ""    # Default OUTPUT policy.
firewall_allow_icmp_v4: ~                # Allow ICMPv4.
firewall_allow_icmp_v6: ~                # Allow ICMPv6.
firewall_enable_extra_input_hardening: ~ # Enable additional input chain hardening.
firewall_allow_ssh_from_anywhere: ~      # Allow SSH from all sources.
firewall_allowed_ssh_cidrs: []              # SSH CIDR allow list when not open to all.
firewall_allowed_tcp_ports: []              # Additional allowed TCP ports (IPv4).
firewall_allowed_udp_ports: []              # Additional allowed UDP ports (IPv4).
firewall_allowed_tcp_ports_v6: []           # Additional allowed TCP ports (IPv6).
firewall_allowed_udp_ports_v6: []           # Additional allowed UDP ports (IPv6).
firewall_forward_ipv4_enabled: ~        # Enable IPv4 forwarding.
firewall_forward_ipv4_lan_interface: ""     # LAN interface for forwarding.
firewall_forward_ipv4_wan_interface: ""     # WAN interface for forwarding.
firewall_forward_ipv4_lan_cidr: ""          # LAN CIDR for forwarding rules.
firewall_nat_ipv4_enabled: ~            # Enable IPv4 NAT masquerade.

# -----------------------------------------------------------------------------
# Fail2ban settings
# -----------------------------------------------------------------------------
fail2ban_bantime: ""  # Ban duration.
fail2ban_findtime: "" # Detection window.
fail2ban_maxretry: ~    # Retry count before ban.

# -----------------------------------------------------------------------------
# Session logging
# -----------------------------------------------------------------------------
ssh_session_log_file: "" # Session audit log file.
ssh_session_logrotate_days: ~                    # Session log retention days.
ssh_command_logging_enabled: ~                 # Enable per-command SSH logging.
ssh_command_log_file: "" # Command audit log file.
ssh_command_logrotate_days: ~                    # Command log retention days.
ssh_command_log_facility: ""                # Syslog facility for command logs.
ssh_command_log_priority: ""                # Syslog priority for command logs.
ssh_command_logger_tag: ""             # Syslog tag for command logs.

# -----------------------------------------------------------------------------
# GRUB credentials
# Keep real secret values in vars/local-secrets.yml (git-ignored).
# -----------------------------------------------------------------------------
grub_hardening_enabled: ~                 # Enable GRUB superuser/password hardening.
grub_hardening_allow_unrestricted_boot: ~ # Allow normal OS boot without GRUB login; still require password for GRUB edit/console.
grub_superuser: ""                       # GRUB superuser name.
grub_password_plaintext: ""     # GRUB plaintext password input. CHANGE THIS FOR REAL ENVIRONMENTS.
grub_hardening_force_rotate_password: ~  # Regenerate GRUB PBKDF2 hash from plaintext on next run.
