---
# Debian OS hardening configuration
# Single source of user-editable settings.

# -----------------------------------------------------------------------------
# Workflow control
# -----------------------------------------------------------------------------
debian_become_enabled: ~ # Run remote tasks with privilege escalation. Values: true | false.
debian_become_method: "" # Privilege escalation method. Values: "sudo" | "su" | "doas".
debian_become_user: ""   # Privilege escalation target user. Example: "root".

# -----------------------------------------------------------------------------
# Target inventory
# One list entry per host to harden, added to the "hardening_targets"
# inventory group dynamically at runtime by playbook.yml - the same pattern
# kvm-vm-provisioning uses for kvm_hypervisors. host.yml stays a static,
# empty placeholder and is never hand-edited with real host data: a target's
# real address, user and become_password belong here, in settings.local.yml,
# never in a tracked file.
#
# Keys:
# - name (required)  inventory hostname; used as ansible_host too when
#                     address is not set
# - address          SSH target. Values: FQDN | IP. Falls back to name
#                     when omitted
# - user             SSH user for this host
# - port             SSH port. Values: integer 1-65535. Falls back to 22
#                     when omitted
# - become_password  Optional per-host sudo password. Leave empty ("")
#                     for root SSH or passwordless sudo
# -----------------------------------------------------------------------------
debian_hardening_targets: [] # Values: [] | list of target host maps (name, address, user, ...).
# Example (was the live default; see local settings for real values):
# debian_hardening_targets:
#  - name: "target-node-01"    # Inventory hostname.
#    address: "203.0.113.10"   # SSH target host/IP.
#    user: "idops"             # SSH user for this host.
#    port: 22                  # SSH port.
#    become_password: ""       # Optional per-host sudo password.

# -----------------------------------------------------------------------------
# APT repository settings
# -----------------------------------------------------------------------------
common_repos_enabled: ~                   # Set to false to skip the common_repos role entirely. Values: true | false.
apt_repository_url: ""                    # Debian base mirror URI (URL only — no deb/suite/components). Example: "http://deb.debian.org/debian".
apt_security_repository_url: ""           # Debian security mirror URI. Example: "http://deb.debian.org/debian/debian-security".
apt_debian_release_override: ""           # Optional suite override (empty = fact-based map). Example: "bookworm".
apt_debian_disable_conflicting_sources: ~ # Disable conflicting Debian source entries in sources.list.d. Values: true | false.
apt_debian_components: []                 # Repository components for Debian hosts. Values: [] | list of APT component names.
# Example (was the live default; see local settings for real values):
# apt_debian_components:
#  - main
#  - contrib
#  - non-free
#  - non-free-firmware

# -----------------------------------------------------------------------------
# Lynis settings
# -----------------------------------------------------------------------------
lynis_repo_url: ""                        # Lynis git repository URL. Example: "https://github.com/CISOfy/lynis".
lynis_repo_version: ""                    # Lynis git revision/tag/branch. Example: "master".
lynis_install_path: ""                    # Lynis install directory on target. Example: "/opt/lynis".
lynis_report_output_dir: ""               # Control-node report output path. Example: "{{ playbook_dir }}/artifacts/lynis".
lynis_quick_mode: ~                       # Run Lynis in quick mode. Values: true | false.
lynis_offline_bundle_from_control_node: ~ # Values: true (clone+bundle on control node, then copy tar to target) | false.
lynis_control_cache_dir: ""               # Control-node cache path for commit-tagged Lynis tar bundles. Example: "{{ playbook_dir }}/artifacts/cache/lynis".

# -----------------------------------------------------------------------------
# Preparation baseline
# -----------------------------------------------------------------------------
prep_enabled: ~                       # Enable preparation baseline role. Values: true | false.
prep_root_authorized_keys: []         # Root authorized keys. Values: [] | list of "ssh-ed25519 AAAA..." strings.
prep_manage_primary_user: ~           # Manage primary UID user baseline. Values: true | false.
prep_primary_user_uid: ""             # UID used to identify primary template user. Example: "1000".
prep_primary_user_desired_name: ""    # Desired primary user name. Values: "" (keeps detected name) | a username, e.g. "idops".
prep_replace_primary_user: ~          # Replace detected UID user with desired name. Values: true | false.
prep_enforce_single_login_user: ~     # Remove other human login users when true. Values: true | false.
prep_primary_user_authorized_keys: [] # Primary user authorized keys. Values: [] | list of "ssh-ed25519 AAAA..." strings.
prep_manage_primary_user_password: ~  # Set/rotate password for detected or renamed UID 1000 user. Values: true | false.
prep_primary_user_plain_password: ""  # Primary user plaintext password. CHANGE THIS. Example: "a strong passphrase".
prep_manage_root_password: ~          # Set/rotate root account password. Values: true | false.
prep_root_plain_password: ""          # Root user plaintext password. CHANGE THIS. Example: "a strong passphrase".

# -----------------------------------------------------------------------------
# Terminal dotfiles (tmux, vim, bash prompt/history/completion)
# Adopted from linux_terminal_dotfiles_configuration; the SSH banner, /etc/motd
# and SSH server policy stay owned by banner_hardening and ssh_hardening below.
# -----------------------------------------------------------------------------
terminal_dotfiles_enabled: ~        # Enable terminal dotfiles role. Values: true | false.
terminal_dotfiles_configure_root: ~ # Also configure root, not just the primary user. Values: true | false.

# -----------------------------------------------------------------------------
# Boot and runlevel hardening
# -----------------------------------------------------------------------------
boot_hardening_enabled: ~               # Enable boot hardening role. Values: true | false.
boot_set_default_target: ~              # Set default systemd target. Values: true | false.
boot_default_target: ""                 # Default target value. Example: "multi-user.target".
boot_fix_runlevel_debian13: ~           # Apply Debian 13 runlevel compatibility adjustments. Values: true | false.
boot_runlevel_compat_wrapper_enabled: ~ # Deploy runlevel compatibility wrapper when needed. Values: true | false.
boot_manage_kernel_symlink_compat: ~    # Create /vmlinuz and /boot/vmlinuz compatibility symlinks when missing. Values: true | false.

# -----------------------------------------------------------------------------
# Network identity hardening
# -----------------------------------------------------------------------------
network_identity_manage_hosts: ~                         # Manage /etc/hosts. Values: true | false.
network_identity_manage_resolv_conf: ~                   # Manage /etc/resolv.conf. Values: true | false.
network_identity_manage_systemd_resolved_when_symlink: ~ # When resolv.conf is a symlink, manage DNS via systemd-resolved drop-in. Values: true | false.
network_identity_primary_ipv4: ""                        # Optional primary IPv4 for host mapping. Example: "192.168.1.10".
network_identity_nameservers: []                         # Resolver list for resolv.conf. Values: [] | list of IPv4 addresses.
# Example (was the live default; see local settings for real values):
# network_identity_nameservers:
#  - "8.8.8.8"
network_identity_search_domains: [] # Search domain list. Values: [] | list of domain names, e.g. ["example.com"].
network_identity_set_hostname: ~    # Enforce hostname on target. Values: true | false.
network_identity_hostname: ""       # Computed short hostname (left-most label of FQDN). Values: "" (computed automatically, see example below) | a literal hostname.
# Example (was the live default; see local settings for real values):
# network_identity_hostname: >-        # Computed short hostname (left-most label of FQDN).
#  {{
#    (
#      network_identity_fqdn
#      if (network_identity_fqdn | length > 0)
#      else inventory_hostname
#    ).split('.')[0]
#  }}
network_identity_fqdn: "" # Computed FQDN fallback (<inventory_hostname>.localdomain when needed). Values: "" (computed automatically, see example below) | a literal FQDN.
# Example (was the live default; see local settings for real values):
# network_identity_fqdn: >             # Computed FQDN fallback (<inventory_hostname>.localdomain when needed).
#  {{
#    inventory_hostname
#    if '.' in inventory_hostname
#    else inventory_hostname ~ '.localdomain'
#  }}
network_identity_manage_loopback_fqdn: ~           # Ensure loopback FQDN mapping. Values: true | false.
network_identity_manage_hosts_via_template: ~      # Render /etc/hosts from template. Values: true | false.
network_identity_cleanup_stale_hostname_entries: ~ # Remove stale hostname entries from hosts file. Values: true | false.
network_identity_extra_hosts_entries: []           # Additional static /etc/hosts lines. Values: [] | list of "IP hostname" strings, e.g. "10.0.0.5 db01".
network_identity_local_repo_hosts_enabled: ~       # Enable static local repo host mappings. Values: true | false.
network_identity_local_repo_hosts_entries: []      # Local repo host mapping entries. Values: [] | list of "IP hostname" strings.

# -----------------------------------------------------------------------------
# Package and update hardening
# -----------------------------------------------------------------------------
package_hardening_enabled: ~                           # Set to false to skip the package_hardening role entirely. Values: true | false.
package_hardening_enable_unattended_upgrades: ~        # Enable unattended-upgrades. Values: true | false.
package_hardening_run_dist_upgrade: ~                  # Run dist-upgrade as part of hardening. Values: true | false.
package_hardening_debsums_cron_check: ""               # Debsums periodic check frequency. Values: "daily" | "weekly" | "monthly".
package_hardening_purge_removed_packages: ~            # Purge residual removed packages. Values: true | false.
package_hardening_enable_lynis_dnssec_probe_support: ~ # Install DNSSEC probe tooling for Lynis (systemd-resolved/resolvectl) when missing. Values: true | false.
package_hardening_enable_lynis_exim_probe_support: ~   # Install/start local Exim for Lynis mail checks when missing. Values: true | false.

# -----------------------------------------------------------------------------
# Service hardening
# -----------------------------------------------------------------------------
service_hardening_enabled: ~ # Enable systemd service hardening drop-ins. Values: true | false.
service_hardening_units: []  # Services to harden. Values: [] | list of systemd unit names.
# Example (was the live default; see local settings for real values):
# service_hardening_units:
#  - ssh.service
#  - fail2ban.service
#  - rsyslog.service
#  - cron.service
#  - unattended-upgrades.service
service_hardening_disable_units: [] # Optional service units to stop/disable. Values: [] | list of systemd unit names.

# -----------------------------------------------------------------------------
# Authentication hardening
# -----------------------------------------------------------------------------
auth_apply_to_existing_local_users: ~ # Apply auth policies to existing users. Values: true | false.
auth_apply_to_root: ~                 # Apply auth policies to root account. Values: true | false.
auth_skip_users: []                   # Users excluded from auth policy updates. Values: [] | list of usernames.

# -----------------------------------------------------------------------------
# SSH hardening
# -----------------------------------------------------------------------------
ssh_port: ~ # SSH port enforced by hardening. Example: 2222.
# SSH password authentication is always disabled by this hardening profile.
# Root SSH login is always forced to key-only mode: PermitRootLogin prohibit-password.
ssh_allowed_users: []     # Optional explicit allowed SSH users. Values: [] (all users allowed) | list of usernames.
ssh_disable_pam_motd: ~   # Disable PAM MOTD output. Values: true | false.
ssh_print_last_log: ~     # Show last login information. Values: true | false.
ssh_clean_login_output: ~ # Reduce noisy login output. Values: true | false.
ssh_disable_motd_news: ~  # Disable motd-news on Debian/Ubuntu. Values: true | false.

# -----------------------------------------------------------------------------
# Login banners
# -----------------------------------------------------------------------------
banner_issue_text: "" # Local login banner text (/etc/issue). Values: "" | banner text, see example below.
# Example (was the live default; see local settings for real values):
# banner_issue_text: |      # Local login banner text (/etc/issue).
#  +------------------------------------------------------------------+
#  | IDOPS SECURITY NOTICE                                            |
#  | AUTHORIZED USE ONLY - MONITORED SYSTEM                           |
#  |                                                                  |
#  | This system and all connected resources are restricted to        |
#  | approved users of the IdOps platform.                            |
#  |                                                                  |
#  | Actions are logged, audited, and attributable.                   |
#  | Unauthorized access is prohibited and may be prosecuted.         |
#  | Disconnect now if you are not authorized.                        |
#  +------------------------------------------------------------------+
banner_issue_net_text: "" # Remote login banner text (/etc/issue.net). Values: "" | banner text, see example below.
# Example (was the live default; see local settings for real values):
# banner_issue_net_text: |  # Remote login banner text (/etc/issue.net).
#  +------------------------------------------------------------------+
#  | IDOPS SSH SECURITY NOTICE                                        |
#  | AUTHORIZED ACCESS ONLY - SESSION RECORDING ENABLED               |
#  |                                                                  |
#  | This SSH endpoint is part of the IdOps-managed environment.      |
#  | All login attempts and commands are monitored and logged.        |
#  |                                                                  |
#  | Unauthorized use is forbidden and may result in legal action.    |
#  | Disconnect now if you are not explicitly authorized.             |
#  +------------------------------------------------------------------+

# -----------------------------------------------------------------------------
# Kernel and module hardening
# -----------------------------------------------------------------------------
kernel_sysctl_dropin_path: ""      # Sysctl drop-in file path. Example: "/etc/sysctl.d/99-zz-hardening.conf".
kernel_disable_usb_storage: ~      # Disable usb-storage module. Values: true | false.
kernel_disable_firewire_storage: ~ # Disable firewire storage module. Values: true | false.
kernel_disable_core_dumps: ~       # Disable core dumps. Values: true | false.
kernel_lock_module_loading: ~      # Lock module loading after boot (high impact). Values: true | false.

# -----------------------------------------------------------------------------
# File permissions hardening
# -----------------------------------------------------------------------------
file_permissions_hardening_enabled: ~ # Enable permissions hardening role. Values: true | false.

# -----------------------------------------------------------------------------
# Integrity tooling
# -----------------------------------------------------------------------------
integrity_hardening_enabled: ~        # Set to false to skip the integrity_hardening role entirely. Values: true | false.
integrity_initialize_aide: ~          # Initialize AIDE database. Values: true | false.
integrity_aide_checksum_algorithm: "" # AIDE checksum algorithm. Values: "sha256" | "sha512".

# -----------------------------------------------------------------------------
# Remote syslog forwarding
# -----------------------------------------------------------------------------
remote_syslog_enabled: ~   # Enable remote rsyslog forwarding. Values: true | false.
remote_syslog_host: ""     # Remote syslog hostname/IP. Example: "syslog.example.com".
remote_syslog_port: ~      # Remote syslog port. Example: 514.
remote_syslog_protocol: "" # Remote syslog protocol. Values: "tcp" | "udp".

# -----------------------------------------------------------------------------
# Firewall policy (iptables-persistent)
# -----------------------------------------------------------------------------
firewall_default_input_policy: ""        # Default INPUT policy. Values: "DROP" | "ACCEPT".
firewall_default_forward_policy: ""      # Default FORWARD policy. Values: "DROP" | "ACCEPT".
firewall_default_output_policy: ""       # Default OUTPUT policy. Values: "ACCEPT" | "DROP".
firewall_allow_icmp_v4: ~                # Allow ICMPv4. Values: true | false.
firewall_allow_icmp_v6: ~                # Allow ICMPv6. Values: true | false.
firewall_enable_extra_input_hardening: ~ # Enable additional input chain hardening. Values: true | false.
firewall_allow_ssh_from_anywhere: ~      # Allow SSH from all sources. Values: true | false.
firewall_allowed_ssh_cidrs: []           # SSH CIDR allow list when not open to all. Values: [] | list of CIDR strings, e.g. ["10.0.0.0/24"].
firewall_allowed_tcp_ports: []           # Additional allowed TCP ports (IPv4). Values: [] | list of port numbers.
firewall_allowed_udp_ports: []           # Additional allowed UDP ports (IPv4). Values: [] | list of port numbers.
firewall_allowed_tcp_ports_v6: []        # Additional allowed TCP ports (IPv6). Values: [] | list of port numbers.
firewall_allowed_udp_ports_v6: []        # Additional allowed UDP ports (IPv6). Values: [] | list of port numbers.
firewall_forward_ipv4_enabled: ~         # Enable IPv4 forwarding. Values: true | false.
firewall_forward_ipv4_lan_interface: ""  # LAN interface for forwarding. Example: "eth1".
firewall_forward_ipv4_wan_interface: ""  # WAN interface for forwarding. Example: "eth0".
firewall_forward_ipv4_lan_cidr: ""       # LAN CIDR for forwarding rules. Example: "192.168.1.0/24".
firewall_nat_ipv4_enabled: ~             # Enable IPv4 NAT masquerade. Values: true | false.

# -----------------------------------------------------------------------------
# Fail2ban settings
# -----------------------------------------------------------------------------
fail2ban_bantime: ""  # Ban duration. Example: "1h".
fail2ban_findtime: "" # Detection window. Example: "10m".
fail2ban_maxretry: ~  # Retry count before ban. Example: 10.

# -----------------------------------------------------------------------------
# Session logging
# -----------------------------------------------------------------------------
ssh_session_log_file: ""       # Session audit log file. Example: "/var/log/ssh_sessions.log".
ssh_session_logrotate_days: ~  # Session log retention days. Example: 30.
ssh_command_logging_enabled: ~ # Enable per-command SSH logging. Values: true | false.
ssh_command_log_file: ""       # Command audit log file. Example: "/var/log/ssh_commands.log".
ssh_command_logrotate_days: ~  # Command log retention days. Example: 30.
ssh_command_log_facility: ""   # Syslog facility for command logs. Example: "local6".
ssh_command_log_priority: ""   # Syslog priority for command logs. Example: "notice".
ssh_command_logger_tag: ""     # Syslog tag for command logs. Example: "ssh-command".

# -----------------------------------------------------------------------------
# GRUB credentials
# Keep real secret values in vars/local-secrets.yml (git-ignored).
# -----------------------------------------------------------------------------
grub_hardening_enabled: ~                 # Enable GRUB superuser/password hardening. Values: true | false.
grub_hardening_allow_unrestricted_boot: ~ # Allow normal OS boot without GRUB login; still require password for GRUB edit/console. Values: true | false.
grub_superuser: ""                        # GRUB superuser name. Example: "root".
grub_password_plaintext: ""               # GRUB plaintext password input. CHANGE THIS FOR REAL ENVIRONMENTS. Example: "a strong passphrase".
grub_hardening_force_rotate_password: ~   # Regenerate GRUB PBKDF2 hash from plaintext on next run. Values: true | false.
