---
- name: Derive effective Debian repository suite from gathered facts
  ansible.builtin.set_fact:
    apt_debian_effective_release: >-
      {{
        (apt_debian_release_override | default('') | trim)
        if (apt_debian_release_override | default('') | trim | length > 0)
        else (
          apt_debian_release_map[ansible_facts['distribution_major_version']]
          if (ansible_facts['distribution_major_version'] in apt_debian_release_map)
          else ansible_facts['distribution_release']
        )
      }}
  when: ansible_facts['distribution'] == 'Debian'

- name: Ensure effective Debian repository suite is set
  ansible.builtin.assert:
    that:
      - apt_debian_effective_release | length > 0
    fail_msg: "Unable to determine Debian suite name from facts. Set apt_debian_release_override in vars/debian-hardening.yml."
  when: ansible_facts['distribution'] == 'Debian'

# Write the managed file first so APT is never left with zero sources.
# Debian 12/13 cloud images already use this path; deleting it and then
# skipping apt-get update (cache_valid_time) produced an empty index
# ("No package matching 'git'").
- name: Configure Debian APT repositories in /etc/apt/sources.list.d/debian.sources
  ansible.builtin.template:
    src: debian.sources.j2
    dest: /etc/apt/sources.list.d/debian.sources
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['distribution'] == 'Debian'

- name: Point /etc/apt/sources.list at the managed deb822 file
  ansible.builtin.template:
    src: sources.list.j2
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['distribution'] == 'Debian'

- name: Find one-line APT source files under /etc/apt/sources.list.d
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*.list"
    file_type: file
  register: apt_sources_list_d_files
  when:
    - ansible_facts['distribution'] == 'Debian'
    - apt_debian_disable_conflicting_sources | bool

- name: Comment conflicting Debian entries in /etc/apt/sources.list.d/*.list
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: >-
      ^(deb(?:-src)?\s+(?:\[[^\]]*\]\s+)?\S+\s+{{ apt_debian_effective_release }}(?:-\S+)?\s+.*)$
    replace: "# Disabled by Ansible common_repos (managed in /etc/apt/sources.list.d/debian.sources): \\1"
  loop: "{{ apt_sources_list_d_files.files | default([]) }}"
  when:
    - ansible_facts['distribution'] == 'Debian'
    - apt_debian_disable_conflicting_sources | bool

- name: Find extra deb822 APT source files under /etc/apt/sources.list.d
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*.sources"
    file_type: file
  register: apt_sources_deb822_files
  when:
    - ansible_facts['distribution'] == 'Debian'
    - apt_debian_disable_conflicting_sources | bool

- name: Remove extra deb822 source files other than debian.sources
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ apt_sources_deb822_files.files | default([]) }}"
  when:
    - ansible_facts['distribution'] == 'Debian'
    - apt_debian_disable_conflicting_sources | bool
    - item.path | basename != 'debian.sources'

- name: Derive effective Ubuntu repository suite from gathered facts
  ansible.builtin.set_fact:
    apt_ubuntu_effective_release: >-
      {{
        (apt_ubuntu_release_override | default('') | trim)
        if (apt_ubuntu_release_override | default('') | trim | length > 0)
        else ansible_facts['distribution_release']
      }}
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Ensure effective Ubuntu repository suite is set
  ansible.builtin.assert:
    that:
      - apt_ubuntu_effective_release | length > 0
    fail_msg: "Unable to determine Ubuntu suite name from facts. Set apt_ubuntu_release_override in vars/debian-hardening.yml."
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Configure Ubuntu APT repositories in /etc/apt/sources.list.d/ubuntu.sources
  ansible.builtin.template:
    src: ubuntu.sources.j2
    dest: /etc/apt/sources.list.d/ubuntu.sources
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Point /etc/apt/sources.list at the managed Ubuntu deb822 file
  ansible.builtin.template:
    src: ubuntu-sources.list.j2
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Find one-line APT source files under /etc/apt/sources.list.d (Ubuntu)
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*.list"
    file_type: file
  register: apt_ubuntu_sources_list_d_files
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - apt_ubuntu_disable_conflicting_sources | bool

- name: Comment conflicting Ubuntu entries in /etc/apt/sources.list.d/*.list
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: >-
      ^(deb(?:-src)?\s+(?:\[[^\]]*\]\s+)?\S+\s+{{ apt_ubuntu_effective_release }}(?:-\S+)?\s+.*)$
    replace: "# Disabled by Ansible common_repos (managed in /etc/apt/sources.list.d/ubuntu.sources): \\1"
  loop: "{{ apt_ubuntu_sources_list_d_files.files | default([]) }}"
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - apt_ubuntu_disable_conflicting_sources | bool

- name: Find extra deb822 APT source files under /etc/apt/sources.list.d (Ubuntu)
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*.sources"
    file_type: file
  register: apt_ubuntu_sources_deb822_files
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - apt_ubuntu_disable_conflicting_sources | bool

- name: Remove extra deb822 source files other than ubuntu.sources
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ apt_ubuntu_sources_deb822_files.files | default([]) }}"
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - apt_ubuntu_disable_conflicting_sources | bool
    - item.path | basename != 'ubuntu.sources'

# Always refresh after rewriting sources. cache_valid_time > 0 can skip
# apt-get update while the previous index belonged to a file we just
# replaced or removed.
- name: Update apt cache
  block:
    - name: Update apt cache via apt module
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
        lock_timeout: "{{ apt_lock_timeout | default(600) }}"
      register: common_repos_apt_update
      retries: "{{ apt_package_retries | default(6) }}"
      delay: "{{ apt_package_retry_delay | default(10) }}"
      until: common_repos_apt_update is succeeded
  rescue:
    - name: Allow release info change and bypass expired release files
      ansible.builtin.command: >-
        apt-get update --allow-releaseinfo-change
        -o Acquire::Check-Valid-Until=false
      changed_when: false

    - name: Retry apt cache update via apt module
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
        lock_timeout: "{{ apt_lock_timeout | default(600) }}"
      register: common_repos_apt_update_retry
      retries: "{{ apt_package_retries | default(6) }}"
      delay: "{{ apt_package_retry_delay | default(10) }}"
      until: common_repos_apt_update_retry is succeeded
  when: ansible_facts['os_family'] == 'Debian'
