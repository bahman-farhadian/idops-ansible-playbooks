---
prep_enabled: true

prep_global_bashrc_block: |
  export HISTCONTROL=erasedups
  export PATH=$PATH:/sbin:/usr/sbin

  if [ -f /etc/bash_completion ]; then
      . /etc/bash_completion
  fi

prep_required_packages:
  - passwd
  - sudo
  - curl
  - git
  - rsync
  - tmux
  - tree
  - vim
  - wget
  - jq
  - net-tools
  - duf
  - ipcalc
  - bash-completion # Used by the adopted .bashrc's completion and prompt setup.
prep_optional_packages:
  - btop
  - lshw
  - progress
  - unrar
  - sshuttle

prep_root_authorized_keys: []

prep_manage_primary_user: true
prep_primary_user_uid: "1000"
prep_primary_user_desired_name: ""
prep_replace_primary_user: false
prep_enforce_single_login_user: false
prep_manage_primary_user_password: false
prep_primary_user_plain_password: ""
prep_manage_root_password: false
prep_root_plain_password: ""
prep_user_cleanup_min_uid: 1000
prep_user_cleanup_max_uid: 60000
prep_user_cleanup_exempt_users: []
prep_primary_user_home_base: "/home"
prep_primary_user_authorized_keys: []
prep_primary_user_sudo_policy: "ALL=(ALL) NOPASSWD:ALL"

# Cloud-init rewrites users and /etc/sudoers.d/90-cloud-init-users on boot.
# Disable it after the image has already applied first-boot config.
prep_disable_cloud_init: true
prep_cloud_init_units:
  - cloud-init.service
  - cloud-init-local.service
  - cloud-config.service
  - cloud-final.service
  - cloud-init-hotplugd.service
  - cloud-init-hotplugd.socket
  - cloud-init-main.service
prep_cloud_init_sudoers_files:
  - /etc/sudoers.d/90-cloud-init-users
