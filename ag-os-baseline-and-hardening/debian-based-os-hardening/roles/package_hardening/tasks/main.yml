---
- name: Install required package hardening utilities
  ansible.builtin.apt:
    name: "{{ package_hardening_required_packages }}"
    state: present
    lock_timeout: "{{ apt_lock_timeout | default(600) }}"
  register: package_hardening_required_install
  retries: "{{ apt_package_retries | default(6) }}"
  delay: "{{ apt_package_retry_delay | default(10) }}"
  until: package_hardening_required_install is succeeded

- name: Install optional package hardening utilities when available
  ansible.builtin.apt:
    name: "{{ package_hardening_optional_packages }}"
    state: present
    lock_timeout: "{{ apt_lock_timeout | default(600) }}"
  failed_when: false

- name: Check AppArmor kernel support marker
  ansible.builtin.stat:
    path: /sys/module/apparmor/parameters/enabled
  register: package_hardening_apparmor_kernel_marker
  when: package_hardening_enable_apparmor_when_supported | bool

- name: Read AppArmor kernel support state
  ansible.builtin.slurp:
    path: /sys/module/apparmor/parameters/enabled
  register: package_hardening_apparmor_kernel_state_raw
  when:
    - package_hardening_enable_apparmor_when_supported | bool
    - package_hardening_apparmor_kernel_marker.stat.exists | default(false)

- name: Set AppArmor support fact
  ansible.builtin.set_fact:
    package_hardening_apparmor_supported: >-
      {{
        package_hardening_apparmor_kernel_marker.stat.exists | default(false)
        and
        (
          package_hardening_apparmor_kernel_state_raw.content
          | b64decode
          | trim
          | upper
        ) in ['Y', 'YES', '1']
      }}
  when: package_hardening_enable_apparmor_when_supported | bool

- name: Check if aa-status binary exists
  ansible.builtin.stat:
    path: /usr/sbin/aa-status
  register: package_hardening_aa_status_binary
  when:
    - package_hardening_enable_apparmor_when_supported | bool
    - package_hardening_apparmor_supported | default(false)

- name: Install AppArmor userspace packages when kernel supports AppArmor
  ansible.builtin.apt:
    name: "{{ package_hardening_apparmor_packages }}"
    state: present
    lock_timeout: "{{ apt_lock_timeout | default(600) }}"
  register: package_hardening_apparmor_install
  retries: "{{ apt_package_retries | default(6) }}"
  delay: "{{ apt_package_retry_delay | default(10) }}"
  until: package_hardening_apparmor_install is succeeded
  when:
    - package_hardening_enable_apparmor_when_supported | bool
    - package_hardening_apparmor_supported | default(false)
    - not (package_hardening_aa_status_binary.stat.exists | default(false))

- name: Ensure AppArmor service is enabled and running when supported
  ansible.builtin.systemd:
    name: apparmor.service
    enabled: true
    state: started
  failed_when: false
  when:
    - package_hardening_enable_apparmor_when_supported | bool
    - package_hardening_apparmor_supported | default(false)

- name: Check if resolvectl binary exists
  ansible.builtin.stat:
    path: /usr/bin/resolvectl
  register: package_hardening_resolvectl_binary
  when: package_hardening_enable_lynis_dnssec_probe_support | bool

- name: Install DNSSEC probe support packages for Lynis when explicitly enabled
  block:
    - name: Install DNSSEC probe support packages
      ansible.builtin.apt:
        name: "{{ package_hardening_lynis_dnssec_probe_packages }}"
        state: present
        lock_timeout: "{{ apt_lock_timeout | default(600) }}"
      register: package_hardening_dnssec_probe_install
      retries: "{{ apt_package_retries | default(6) }}"
      delay: "{{ apt_package_retry_delay | default(10) }}"
      until: package_hardening_dnssec_probe_install is succeeded
  rescue:
    - name: Warn when DNSSEC probe support packages cannot be installed
      ansible.builtin.debug:
        msg: >-
          Skipping optional DNSSEC probe support install due to package failure:
          {{ package_hardening_dnssec_probe_install.msg | default('apt failure') }}
  when:
    - package_hardening_enable_lynis_dnssec_probe_support | bool
    - not (package_hardening_resolvectl_binary.stat.exists | default(false))

- name: Check whether Exim process is running
  ansible.builtin.command: pgrep -x exim4
  register: package_hardening_exim_process_check
  changed_when: false
  failed_when: false
  when: package_hardening_enable_lynis_exim_probe_support | bool

- name: Install local Exim packages for Lynis probe when explicitly enabled
  block:
    - name: Install local Exim packages
      ansible.builtin.apt:
        name: "{{ package_hardening_lynis_exim_probe_packages }}"
        state: present
        lock_timeout: "{{ apt_lock_timeout | default(600) }}"
      register: package_hardening_exim_probe_install
      retries: "{{ apt_package_retries | default(6) }}"
      delay: "{{ apt_package_retry_delay | default(10) }}"
      until: package_hardening_exim_probe_install is succeeded
      environment:
        DEBIAN_FRONTEND: noninteractive
  rescue:
    - name: Warn when local Exim packages cannot be installed
      ansible.builtin.debug:
        msg: >-
          Skipping optional Exim probe support install due to package failure:
          {{ package_hardening_exim_probe_install.msg | default('apt failure') }}
  when:
    - package_hardening_enable_lynis_exim_probe_support | bool
    - package_hardening_exim_process_check.rc | default(1) != 0

- name: Ensure Exim service is enabled and running when Lynis probe support is enabled
  ansible.builtin.systemd:
    name: exim4.service
    enabled: true
    state: started
  failed_when: false
  when: package_hardening_enable_lynis_exim_probe_support | bool

- name: Gather package facts for optional package tuning
  ansible.builtin.package_facts:
    manager: auto

- name: Configure debsums periodic check
  ansible.builtin.lineinfile:
    path: /etc/default/debsums
    regexp: '^CRON_CHECK='
    line: "CRON_CHECK={{ package_hardening_debsums_cron_check }}"
  when: "'debsums' in ansible_facts.packages"

- name: Collect packages with removed binaries but leftover config
  ansible.builtin.command: "dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package}\\n'"
  register: package_hardening_dpkg_status
  changed_when: false
  when: package_hardening_purge_removed_packages | bool

- name: Build purge list for residual config packages
  ansible.builtin.set_fact:
    package_hardening_purge_candidates: >-
      {{
        package_hardening_dpkg_status.stdout_lines
        | default([])
        | select('match', '^rc\s+')
        | map('regex_replace', '^rc\s+([^\s]+).*$', '\1')
        | list
      }}
  when: package_hardening_purge_removed_packages | bool

- name: Purge residual config-only packages
  ansible.builtin.command: "dpkg --purge {{ item }}"
  loop: "{{ package_hardening_purge_candidates }}"
  changed_when: true
  when:
    - package_hardening_purge_removed_packages | bool
    - package_hardening_purge_candidates | default([]) | length > 0

- name: Update package index and apply dist-upgrade
  block:
    - name: Refresh apt cache before dist-upgrade
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: "{{ apt_lock_timeout | default(600) }}"

    - name: Apply dist-upgrade with bounded apt network timeout
      ansible.builtin.command:
        argv:
          - apt-get
          - -y
          - -o
          - "DPkg::Lock::Timeout={{ apt_lock_timeout | default(600) }}"
          - -o
          - Dpkg::Options::=--force-confdef
          - -o
          - Dpkg::Options::=--force-confold
          - -o
          - "Acquire::Retries={{ package_hardening_apt_network_retries }}"
          - -o
          - "Acquire::http::Timeout={{ package_hardening_apt_network_timeout_seconds }}"
          - -o
          - "Acquire::https::Timeout={{ package_hardening_apt_network_timeout_seconds }}"
          - dist-upgrade
          - --auto-remove
      register: package_hardening_dist_upgrade_result
      retries: "{{ package_hardening_dist_upgrade_task_retries }}"
      delay: "{{ package_hardening_dist_upgrade_task_retry_delay_seconds }}"
      until: package_hardening_dist_upgrade_result.rc == 0
      changed_when: >-
        '0 upgraded, 0 newly installed, 0 to remove' not in
        (package_hardening_dist_upgrade_result.stdout | default(''))
      environment:
        DEBIAN_FRONTEND: noninteractive
        APT_LISTCHANGES_FRONTEND: none
        NEEDRESTART_MODE: a
  rescue:
    - name: Allow release info change and refresh apt cache
      ansible.builtin.command: apt-get update --allow-releaseinfo-change
      changed_when: false

    - name: Retry dist-upgrade with bounded apt network timeout
      ansible.builtin.command:
        argv:
          - apt-get
          - -y
          - -o
          - "DPkg::Lock::Timeout={{ apt_lock_timeout | default(600) }}"
          - -o
          - Dpkg::Options::=--force-confdef
          - -o
          - Dpkg::Options::=--force-confold
          - -o
          - "Acquire::Retries={{ package_hardening_apt_network_retries }}"
          - -o
          - "Acquire::http::Timeout={{ package_hardening_apt_network_timeout_seconds }}"
          - -o
          - "Acquire::https::Timeout={{ package_hardening_apt_network_timeout_seconds }}"
          - dist-upgrade
          - --auto-remove
      register: package_hardening_dist_upgrade_result_retry
      retries: "{{ package_hardening_dist_upgrade_task_retries }}"
      delay: "{{ package_hardening_dist_upgrade_task_retry_delay_seconds }}"
      until: package_hardening_dist_upgrade_result_retry.rc == 0
      changed_when: >-
        '0 upgraded, 0 newly installed, 0 to remove' not in
        (package_hardening_dist_upgrade_result_retry.stdout | default(''))
      environment:
        DEBIAN_FRONTEND: noninteractive
        APT_LISTCHANGES_FRONTEND: none
        NEEDRESTART_MODE: a
  when: package_hardening_run_dist_upgrade | bool

- name: Re-collect residual config packages after dist-upgrade
  ansible.builtin.command: "dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package}\\n'"
  register: package_hardening_dpkg_status_after_upgrade
  changed_when: false
  when:
    - package_hardening_purge_removed_packages | bool
    - package_hardening_run_dist_upgrade | bool

- name: Build post-upgrade purge list for residual config packages
  ansible.builtin.set_fact:
    package_hardening_purge_candidates_after_upgrade: >-
      {{
        package_hardening_dpkg_status_after_upgrade.stdout_lines
        | default([])
        | select('match', '^rc\s+')
        | map('regex_replace', '^rc\s+([^\s]+).*$', '\1')
        | list
      }}
  when:
    - package_hardening_purge_removed_packages | bool
    - package_hardening_run_dist_upgrade | bool

- name: Purge post-upgrade residual config-only packages
  ansible.builtin.command: "dpkg --purge {{ item }}"
  loop: "{{ package_hardening_purge_candidates_after_upgrade | default([]) }}"
  changed_when: true
  when:
    - package_hardening_purge_removed_packages | bool
    - package_hardening_run_dist_upgrade | bool
    - package_hardening_purge_candidates_after_upgrade | default([]) | length > 0

- name: Configure automatic security updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  when: package_hardening_enable_unattended_upgrades | bool

- name: Enable apt update timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  failed_when: false
  when: package_hardening_enable_unattended_upgrades | bool
