---
- name: Validate requested hardening action
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/debian-hardening.yml
    # The file above carries this project's generic hardening defaults.
    # Real per-deployment values live in a gitignored *.local.yml file
    # selected with debian_local_settings_file. There is no operator default.
    # The dummy path exists only so ansible-lint --syntax-check can parse
    # this entry; it is not a settings file. Loaded last so a real file wins.
    - "{{ debian_local_settings_file | default('vars/.syntax-check.local.yml') }}"
  vars:
    debian_hardening_action_effective: "{{ debian_hardening_action | default('harden') }}"
    debian_selected_local_settings_file: "{{ debian_local_settings_file | default('') }}"
    debian_local_settings_path: >-
      {{
        debian_selected_local_settings_file
        if debian_selected_local_settings_file is match('^/')
        else (playbook_dir ~ '/' ~ debian_selected_local_settings_file)
      }}

  tasks:
    # Every task in this play is tagged `always`: this play's job is to fail
    # fast on missing settings and populate the hardening_targets group that
    # the second play runs against, and it must do that unconditionally, no
    # matter which --tags a role-scoped `make role-*` target passes. Without
    # it, `--tags <role>` runs no task here at all - add_host never fires,
    # and the second play silently matches no hosts.
    - name: Fail when no local settings file was selected
      ansible.builtin.fail:
        msg: >-
          No local settings file was selected. There is no default.
          Run: make <target> LOCAL_SETTINGS_FILE=vars/settings.local.yml
      when: debian_selected_local_settings_file | length == 0
      tags: always

    # search, not match: match is start-anchored and rejects
    # vars/settings.harden.local.yml (and every other relative path).
    - name: Validate selected local settings file name
      ansible.builtin.assert:
        that:
          - debian_selected_local_settings_file is search('\\.local\\.yml$')
        fail_msg: >-
          debian_local_settings_file must end with .local.yml
          (got '{{ debian_selected_local_settings_file }}').
          Example: LOCAL_SETTINGS_FILE=vars/settings.local.yml
      tags: always

    - name: Check for the machine-specific settings file
      ansible.builtin.stat:
        path: "{{ debian_local_settings_path }}"
      register: debian_hardening_local_settings_file
      changed_when: false
      tags: always

    # A missing vars_files entry is silently skipped by Ansible rather than
    # failing, so a missing local settings file would leave every real
    # target and credential undefined with no warning, not merely fall
    # back to a documented default - there is no target to fall back to.
    - name: Fail when the selected local settings file is missing
      ansible.builtin.fail:
        msg: >-
          {{ debian_selected_local_settings_file }} was not found.
          Put real hosts and keys in this file. Tracked vars files only
          have generic defaults. Create it with:
          make settings LOCAL_SETTINGS_FILE={{ debian_selected_local_settings_file }}
      when: not debian_hardening_local_settings_file.stat.exists
      tags: always

    - name: Load the machine-specific override file for reporting
      ansible.builtin.include_vars:
        file: "{{ debian_local_settings_path }}"
        name: debian_hardening_local_overrides
      when: debian_hardening_local_settings_file.stat.exists
      tags: always

    - name: Report which settings come from the override file
      ansible.builtin.debug:
        msg: >-
          Using {{ debian_selected_local_settings_file }}.
          It sets {{ debian_hardening_local_overrides | length }} key(s):
          {{ debian_hardening_local_overrides.keys() | list | join(', ') }}.
          Edit those keys in that file. The same keys in
          vars/debian-hardening.yml are ignored.
      when: debian_hardening_local_settings_file.stat.exists
      tags: always

    - name: Validate hardening action value
      ansible.builtin.assert:
        that:
          - >-
            debian_hardening_action_effective in
            ['ping', 'scan', 'harden', 'reboot', 'ssh-check', 'runtime-check']
        fail_msg: >-
          debian_hardening_action must be one of: ping, scan, harden, reboot,
          ssh-check, runtime-check.
      tags: always

    - name: Validate at least one hardening target is declared
      ansible.builtin.assert:
        that:
          - debian_hardening_targets is defined
          - (debian_hardening_targets | length) > 0
        fail_msg: >-
          Add at least one host in debian_hardening_targets in
          {{ debian_selected_local_settings_file }}.
          The list in vars/debian-hardening.yml is empty on purpose.
      tags: always

    - name: Validate hardening target names
      ansible.builtin.assert:
        that:
          - item.name is defined
          - (item.name | string | length) > 0
          - item.name is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$')
        fail_msg: >-
          Target name '{{ item.name | default('unnamed') }}' is invalid. Use
          letters, digits, dot, dash or underscore, starting with a letter or
          digit, up to 63 characters.
      loop: "{{ debian_hardening_targets }}"
      loop_control:
        label: "{{ item.name | default('unnamed') }}"
      tags: always

    - name: Validate hardening target ports
      ansible.builtin.assert:
        that:
          - (item.port | default(22) | int) > 0
          - (item.port | default(22) | int) <= 65535
        fail_msg: >-
          Target '{{ item.name }}' has an invalid port (got
          {{ item.port | default(22) }}); must be 1-65535.
      loop: "{{ debian_hardening_targets }}"
      loop_control:
        label: "{{ item.name }}"
      tags: always

    - name: Validate hardening target names are unique
      ansible.builtin.assert:
        that:
          - debian_hardening_targets | map(attribute='name') | list | length
            ==
            debian_hardening_targets | map(attribute='name') | list | unique | length
        fail_msg: "Target names must be unique in debian_hardening_targets."
      tags: always

    - name: Fail when APT maps use a multicast DNS .local hostname
      ansible.builtin.assert:
        that:
          - debian_mdns_apt_uris | length == 0
        fail_msg: >-
          APT map URL(s) use a .local hostname
          ({{ debian_mdns_apt_uris | join(', ') }}).
          systemd-resolved sends .local to multicast DNS (RFC 6762)
          and never asks unicast DNS. Use a unicast zone such as .idops,
          or an IPv4 URL.
      vars:
        debian_mdns_apt_uris: >-
          {{
            (
              (
                (apt_debian_repository_by_suite | default({}))
                | dict2items
                | map(attribute='value')
                | list
              )
              + (
                (apt_ubuntu_repository_by_suite | default({}))
                | dict2items
                | map(attribute='value')
                | list
              )
            )
            | map('dict2items')
            | flatten
            | map(attribute='value')
            | select('string')
            | select('search', '(?i)^https?://')
            | select('search', '(?i)https?://[^/]*\\.local([:/]|$)')
            | list
          }}
      tags: always

    # Empty user collapses to omit so the SSH client keeps falling back to
    # the operator's own ssh config instead of receiving a blank value.
    - name: Add hardening targets to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: hardening_targets
        ansible_host: "{{ item.address | default(item.name, true) }}"
        ansible_user: "{{ (item.user | default('', true)) or omit }}"
        ansible_port: "{{ item.port | default(22) }}"
        ansible_become_password: "{{ (item.become_password | default('', true)) or omit }}"
      loop: "{{ debian_hardening_targets }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      tags: always

    - name: Display resolved hardening targets
      ansible.builtin.debug:
        msg: >-
          targets={{ debian_hardening_targets | map(attribute='name') | list }}
      tags: always

- name: Execute Debian/Ubuntu hardening action
  hosts: hardening_targets
  become: "{{ debian_become_enabled | default(true) | bool }}"
  become_method: "{{ debian_become_method | default('sudo') }}"
  become_user: "{{ debian_become_user | default('root') }}"
  gather_facts: "{{ debian_hardening_action_effective in ['scan', 'harden'] }}"
  vars_files:
    - vars/debian-hardening.yml
    # Required; same selected local file as the first play. No operator default.
    - "{{ debian_local_settings_file | default('vars/.syntax-check.local.yml') }}"
  vars:
    debian_hardening_action_effective: "{{ debian_hardening_action | default('harden') }}"

  pre_tasks:
    # Tagged `always` for the same reason as the first play's tasks: a
    # role-scoped `make role-*` run (--tags <role>) must still pass the
    # OS-support preflight check.
    - name: Run hardening preflight checks for OS support
      ansible.builtin.include_tasks: tasks/preflight.yml
      when: debian_hardening_action_effective in ['scan', 'harden']
      tags: always

  tasks:
    - name: Run connectivity workflow
      ansible.builtin.include_tasks: tasks/ping.yml
      when: debian_hardening_action_effective == 'ping'

    - name: Run Lynis baseline scan workflow
      ansible.builtin.include_tasks: tasks/scan.yml
      when: debian_hardening_action_effective == 'scan'

    - name: Run OS hardening workflow
      ansible.builtin.include_tasks: tasks/harden.yml
      when: debian_hardening_action_effective == 'harden'
      tags: always

    - name: Run reboot workflow
      ansible.builtin.include_tasks: tasks/reboot.yml
      when: debian_hardening_action_effective == 'reboot'

    - name: Run SSH hardening check workflow
      ansible.builtin.include_tasks: tasks/ssh-check.yml
      when: debian_hardening_action_effective == 'ssh-check'

    - name: Run runtime diagnostics workflow
      ansible.builtin.include_tasks: tasks/runtime-check.yml
      when: debian_hardening_action_effective == 'runtime-check'
