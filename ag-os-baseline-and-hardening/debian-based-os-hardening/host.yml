---
# Static placeholder only. Real targets are never hand-edited here: they are
# declared in debian_hardening_targets (vars/debian-hardening.yml /
# vars/settings.local.yml) and added to the hardening_targets group
# dynamically at runtime by playbook.yml, the same pattern
# kvm-vm-provisioning uses for its hypervisor fleet. Editing this file with
# a real host's address, user or password would put that data in a tracked
# file - see Required Standard 19 in CONTRIBUTOR-GUIDE.md.
all:
  children:
    local:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
    hardening_targets:
      hosts: {}
