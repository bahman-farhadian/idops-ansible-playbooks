# Demo pipeline for 02-run.md. Every section is commented, same
# convention as the manifests in ../../ak-container-orchestration/idops-kubernetes-lab.
# Fluent Bit's classic config parser does not support trailing inline
# comments on a directive line — it reads everything after the value,
# including the `#`, as part of the value itself (confirmed: it corrupted
# Parsers_File into an unopenable path and the input's own plugin name).
# Every comment here lives on its own line for that reason.
[SERVICE]
    Flush         1
    Log_Level     info
    # status/metrics at http://localhost:2020
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    # the image's own built-in parsers (syslog-rfc3164 lives here)
    Parsers_File  /fluent-bit/etc/parsers.conf

[INPUT]
    # `logger -n 127.0.0.1 -P 5514 -T "..."` lands here
    Name          tcp
    Listen        0.0.0.0
    Port          5514
    Tag           demo.tcp
    Format        none

[FILTER]
    Name          parser
    Match         demo.*
    Key_Name      log
    Parser        syslog-rfc3164
    # keep the raw field alongside the parsed ones
    Reserve_Data  On

[OUTPUT]
    Name          es
    Match         demo.*
    Host          elasticsearch
    Port          9200
    Index         efk-lab-logs
    # Elasticsearch 9.x has no mapping types
    Suppress_Type_Name On
    # least-privilege user, write-only on efk-lab-logs — see compose.yaml's es-security-setup
    HTTP_User     log_writer
    HTTP_Passwd   ${LOG_WRITER_PASSWORD}
