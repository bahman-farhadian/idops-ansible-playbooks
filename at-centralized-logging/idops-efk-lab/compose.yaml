services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: idops-efk-lab-elasticsearch
    restart: unless-stopped
    mem_limit: 1g                                          # keep this lab inside a laptop's budget
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}                # bootstrap-only var, not a elasticsearch.yml key: seeds the `elastic` superuser on first boot of a fresh es-data volume
      - ES_JAVA_OPTS=-Xms512m -Xmx512m                      # JVM heap flag, not a elasticsearch.yml key; small heap, raise if the host has RAM to spare
    ulimits:
      memlock:
        soft: -1                                            # Elasticsearch asks to lock its heap in RAM
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data               # survives `compose down`; removed by `compose down -v`
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ports:
      - "9200:9200"                                         # HTTP API, used by Kibana, Fluent Bit, and curl
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 30                                           # first boot can take a while on a cold volume

  es-security-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}   # reuses the pinned image purely for its bundled curl; nothing Elasticsearch-specific runs
    container_name: idops-efk-lab-es-security-setup
    restart: "no"                                           # one-shot: set passwords/roles against a running node, then exit
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - LOG_WRITER_PASSWORD=${LOG_WRITER_PASSWORD}
      - IDOPS_PASSWORD=${IDOPS_PASSWORD}                     # named superuser for day-to-day login — see .env.example
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        curl -sf -u "elastic:$$ELASTIC_PASSWORD" -X POST http://elasticsearch:9200/_security/user/kibana_system/_password \
          -H 'Content-Type: application/json' -d "{\"password\":\"$$KIBANA_SYSTEM_PASSWORD\"}"
        curl -sf -u "elastic:$$ELASTIC_PASSWORD" -X PUT http://elasticsearch:9200/_security/role/log_writer \
          -H 'Content-Type: application/json' \
          -d '{"cluster":["monitor","manage_index_templates"],"indices":[{"names":["efk-lab-logs"],"privileges":["create_index","write","manage"]}]}'
        curl -sf -u "elastic:$$ELASTIC_PASSWORD" -X POST http://elasticsearch:9200/_security/user/log_writer \
          -H 'Content-Type: application/json' -d "{\"password\":\"$$LOG_WRITER_PASSWORD\",\"roles\":[\"log_writer\"]}"
        curl -sf -u "elastic:$$ELASTIC_PASSWORD" -X POST http://elasticsearch:9200/_security/user/idops \
          -H 'Content-Type: application/json' \
          -d "{\"password\":\"$$IDOPS_PASSWORD\",\"roles\":[\"superuser\"],\"full_name\":\"idops\"}"
        # idempotent: re-running this on an existing volume just resets every password/role to the current .env values

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}   # same minor/patch as Elasticsearch, always
    container_name: idops-efk-lab-kibana
    restart: unless-stopped
    mem_limit: 1536m                                         # 768m OOM-crashes Kibana 9.x on startup (203 plugins); this is the observed floor, not a guess
    depends_on:
      elasticsearch:
        condition: service_healthy                          # do not start Kibana against a half-booted node
      es-security-setup:
        condition: service_completed_successfully           # kibana_system needs its password set before Kibana's first connection attempt
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system                # Kibana's own built-in service account, not the `elastic` superuser
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - XPACK_SECURITY_ENABLED=true                          # real login screen + RBAC — lab-only divergence, see README.md
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_SECURITY_ENCRYPTION_KEY}   # pins the session-cookie key so restarts don't force every user to log back in
      - NODE_OPTIONS=--max-old-space-size=1280                # pin the V8 heap explicitly instead of trusting cgroup auto-sizing
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}   # without this, the monitoring plugin retries "create alerts client" and ERRORs in a tight loop forever
    ports:
      - "5601:5601"                                          # http://localhost:5601 — log in as idops / $IDOPS_PASSWORD

  fluent-bit:
    image: fluent/fluent-bit:${FLUENT_BIT_VERSION}
    container_name: idops-efk-lab-fluent-bit
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-security-setup:
        condition: service_completed_successfully            # log_writer must exist before Fluent Bit's es output can authenticate as it
    environment:
      - LOG_WRITER_PASSWORD=${LOG_WRITER_PASSWORD}            # read by fluent-bit.conf's ${LOG_WRITER_PASSWORD} substitution
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    ports:
      - "5514:5514/tcp"                                     # demo log input: `logger -T` or `nc` writes here
      - "2020:2020"                                         # Fluent Bit's own HTTP status/metrics endpoint

volumes:
  es-data:
