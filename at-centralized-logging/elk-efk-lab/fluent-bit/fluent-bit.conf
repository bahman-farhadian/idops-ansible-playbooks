# Demo pipeline for 03-run-efk.md. Every section is commented, same
# convention as the manifests in ../../ak-container-orchestration/kubernetes-lab.
[SERVICE]
    Flush         1
    Log_Level     info
    HTTP_Server   On                                         # status/metrics at http://localhost:2020
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Parsers_File  /fluent-bit/etc/parsers.conf                # the image's own built-in parsers (syslog-rfc3164 lives here)

[INPUT]
    Name          tcp                                         # `logger -n 127.0.0.1 -P 5514 -T "..."` lands here
    Listen        0.0.0.0
    Port          5514
    Tag           demo.tcp
    Format        none

[FILTER]
    Name          parser
    Match         demo.*
    Key_Name      log
    Parser        syslog-rfc3164
    Reserve_Data  On                                          # keep the raw field alongside the parsed ones

[OUTPUT]
    Name          es
    Match         demo.*
    Host          elasticsearch
    Port          9200
    Index         efk-lab-logs                                 # separate name from Logstash's elk-lab-logs-* indices
    Suppress_Type_Name On                                      # Elasticsearch 9.x has no mapping types
