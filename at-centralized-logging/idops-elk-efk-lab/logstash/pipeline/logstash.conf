# Demo pipeline for 02-run-elk.md. Every stanza is commented, same convention
# as the manifests in ../../ak-container-orchestration/idops-kubernetes-lab.
input {
  tcp {                                                      # `logger -n 127.0.0.1 -P 5514 -T "..."` lands here
    port => 5514
    type => "demo-tcp"
  }
  udp {                                                       # `logger -n 127.0.0.1 -P 5514 "..."` (no -T) lands here
    port => 5514
    type => "demo-udp"
  }
}

filter {
  grok {                                                      # pull a timestamp out of a syslog-shaped line
    match => { "message" => "%{SYSLOGTIMESTAMP:log_timestamp} %{GREEDYDATA:log_message}" }
    tag_on_failure => ["_grokparsefailure_demo"]              # line kept either way, just tagged when it doesn't match
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "elk-lab-logs-%{+YYYY.MM.dd}"                    # one index per day, easy to delete in 04-smoke-test.md
    user => "log_writer"                                      # least-privilege user, write-only on elk-lab-logs-*/efk-lab-logs — see compose.yaml's es-security-setup
    password => "${LOG_WRITER_PASSWORD}"
  }
  stdout { codec => rubydebug }                               # see the parsed event with `docker compose logs logstash`
}
