# ELK overlay: adds Logstash as the collector.
# Run with:  docker compose -f compose.yaml -f compose.elk.yaml up -d --wait
# Matches the domain decision: a project runs elk/ or efk/, not both — do not
# bring this overlay up at the same time as compose.efk.yaml.
services:
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}   # same pin line as Elasticsearch/Kibana
    container_name: idops-elk-efk-lab-logstash
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-security-setup:
        condition: service_completed_successfully            # log_writer must exist before Logstash's elasticsearch output can authenticate as it
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - LOG_WRITER_PASSWORD=${LOG_WRITER_PASSWORD}            # read by logstash.conf's ${LOG_WRITER_PASSWORD} substitution
    ports:
      - "5514:5514/tcp"                                     # demo log input: `logger -T` or `nc` writes here
      - "5514:5514/udp"
