# Pocket Cluster first app. Apply from this clone, not from /opt:
#   kubectl apply -f hello-nginx.yaml
# Objects are in create order. This app is stateless: no PersistentVolume
# and no PersistentVolumeClaim.

---
# Namespace: a name for every later object. Create this first.
apiVersion: v1
kind: Namespace
metadata:
  name: idops-nginx-demo

---
# ConfigMap: the nginx page. No disk; a ConfigMap is enough.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-nginx
  namespace: idops-nginx-demo
data:
  # Mounted into the container as /etc/nginx/conf.d/default.conf.
  default.conf: |
    server {
        listen 80 default_server;
        server_name _;
        access_log /dev/stdout;
        error_log /dev/stderr;
        location / {
            default_type text/plain;
            return 200 "Pocket Cluster\npod=$hostname\n";
        }
    }

---
# Deployment: six identical Pods. Any replica can serve any request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-nginx
  namespace: idops-nginx-demo
  labels:
    app: hello-nginx
spec:
  replicas: 6                          # spread across the three workers
  selector:
    matchLabels:
      app: hello-nginx                 # must match template.metadata.labels
  template:
    metadata:
      labels:
        app: hello-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          imagePullPolicy: IfNotPresent  # use the image k8s_lab_load_image put on workers
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf      # one file from the ConfigMap, not the whole dir
          readinessProbe:                # Service traffic only after GET / succeeds
            httpGet:
              path: /
              port: http
          livenessProbe:                 # kubelet restarts the container if GET / fails
            httpGet:
              path: /
              port: http
      volumes:
        - name: nginx-config
          configMap:
            name: hello-nginx

---
# Service: ClusterIP. Pods are reached by this name inside the cluster.
# The host uses Ingress, not a NodePort on this Service.
apiVersion: v1
kind: Service
metadata:
  name: hello-nginx
  namespace: idops-nginx-demo
  labels:
    app: hello-nginx
spec:
  type: ClusterIP
  selector:
    app: hello-nginx                   # same label as the Pods
  ports:
    - name: http
      port: 80                         # port the Ingress talks to
      targetPort: http                 # named port on the container

---
# Ingress: Cloud Provider KIND writes ADDRESS (a docker network IP).
# Read it with: kubectl get ingress -n idops-nginx-demo
# Curl that IP. Do not curl 127.0.0.1.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-nginx
  namespace: idops-nginx-demo
spec:
  rules:
    - http:                            # no host: every Host header matches
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-nginx
                port:
                  number: 80
