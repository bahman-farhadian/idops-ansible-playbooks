# ClusterIP only. The host reaches this Service through Traefik Ingress,
# not through a NodePort on the app.
apiVersion: v1
kind: Service
metadata:
  name: hello-nginx
  namespace: idops-nginx-demo
  labels:
    app: hello-nginx
spec:
  type: ClusterIP
  selector:
    app: hello-nginx
  ports:
    - name: http
      port: 80
      targetPort: http
