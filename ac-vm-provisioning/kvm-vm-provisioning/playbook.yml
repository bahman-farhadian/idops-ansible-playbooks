---
- name: Resolve KVM hypervisor fleet
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/kvm-provisioning.yml
  vars:
    kvm_action: "{{ kvm_action | default('provision') }}"

  tasks:
    - name: Validate requested action
      ansible.builtin.assert:
        that:
          - kvm_action in ['provision', 'cleanup', 'ping']
        fail_msg: "kvm_action must be 'provision', 'cleanup', or 'ping'."

    - name: Validate at least one hypervisor is declared
      ansible.builtin.assert:
        that:
          - kvm_hypervisors is defined
          - (kvm_hypervisors | length) > 0
        fail_msg: >-
          Declare at least one KVM host in kvm_hypervisors
          (section 1 of vars/kvm-provisioning.yml).

    - name: Build effective hypervisor fleet
      ansible.builtin.set_fact:
        kvm_resolved_hypervisors: "{{ kvm_hypervisors }}"

    - name: Validate hypervisor fleet entries
      ansible.builtin.assert:
        that:
          - item.name is defined
          - (item.name | string | length) > 0
          - item.name is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$')
          - (item.ssh_port | default(kvm_hypervisor_ssh_port, true) | int) > 0
          - (item.ssh_port | default(kvm_hypervisor_ssh_port, true) | int) <= 65535
          - >-
            (item.libvirt_connection_uri | default(kvm_libvirt_connection_uri, true))
            is match('^qemu')
          - >-
            (item.image_cache_path | default(kvm_image_cache_path, true))
            is match('^/')
          - >-
            (item.instance_disk_pool_path | default(kvm_instance_disk_pool_path, true))
            is match('^/')
          - >-
            (item.cloud_init_workspace_path | default(kvm_cloud_init_workspace_path, true))
            is match('^/')
        fail_msg: >-
          Invalid hypervisor entry '{{ item.name | default('unnamed') }}'.
          Each kvm_hypervisors entry needs a unique name matching
          ^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$, an ssh_port within 1-65535, a
          libvirt_connection_uri starting with 'qemu', and absolute storage
          paths where it overrides them.
      loop: "{{ kvm_resolved_hypervisors }}"
      loop_control:
        label: "{{ item.name | default('unnamed') }}"

    - name: Validate hypervisor names are unique
      ansible.builtin.assert:
        that:
          - kvm_resolved_hypervisors | map(attribute='name') | list | length
            ==
            kvm_resolved_hypervisors | map(attribute='name') | list | unique | length
        fail_msg: "Hypervisor names must be unique in kvm_hypervisors."

    - name: Fail when a hypervisor address is still the placeholder
      ansible.builtin.fail:
        msg: >-
          Hypervisor '{{ item.name }}' still points at the placeholder address
          'change-me-hypervisor'. Set its `address` in kvm_hypervisors to the
          real KVM host.
      loop: "{{ kvm_resolved_hypervisors }}"
      loop_control:
        label: "{{ item.name }}"
      when: (item.address | default(item.name, true)) == 'change-me-hypervisor'

    # An instance that does not name a hypervisor lands on the first declared
    # host, so the fallback needs no setting of its own.
    - name: Resolve the host for instances that name none
      ansible.builtin.set_fact:
        kvm_effective_default_hypervisor: "{{ kvm_resolved_hypervisors[0].name }}"

    - name: Validate every instance names a hypervisor when required
      ansible.builtin.assert:
        that:
          - item.hypervisor is defined
          - (item.hypervisor | default('') | string | length) > 0
        fail_msg: >-
          Instance {{ item.instance_name | default('unknown') }} does not set
          'hypervisor' and kvm_require_explicit_hypervisor is true.
      loop: "{{ kvm_instance_definitions | default([]) }}"
      loop_control:
        label: "{{ item.instance_name | default('unknown') }}"
      when: kvm_require_explicit_hypervisor | default(false) | bool

    - name: Validate instance hypervisor references
      ansible.builtin.assert:
        that:
          - >-
            (item.hypervisor | default(kvm_effective_default_hypervisor, true))
            in (kvm_resolved_hypervisors | map(attribute='name') | list)
        fail_msg: >-
          Instance {{ item.instance_name | default('unknown') }} references
          undefined hypervisor
          '{{ item.hypervisor | default(kvm_effective_default_hypervisor, true) }}'.
          Known hypervisors:
          {{ kvm_resolved_hypervisors | map(attribute='name') | join(', ') }}.
      loop: "{{ kvm_instance_definitions | default([]) }}"
      loop_control:
        label: "{{ item.instance_name | default('unknown') }}"

    # Empty user/key values collapse to omit so the SSH client keeps falling
    # back to the operator's own ssh config instead of receiving a blank value.
    - name: Add KVM hypervisors to inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: hypervisor
        ansible_host: "{{ item.address | default(item.name, true) }}"
        ansible_user: >-
          {{ (item.user | default(kvm_hypervisor_user, true) | default('', true)) or omit }}
        ansible_ssh_private_key_file: >-
          {{
            (
              item.ssh_private_key_file
              | default(kvm_hypervisor_ssh_private_key_file, true)
              | default('', true)
            ) or omit
          }}
        ansible_port: "{{ item.ssh_port | default(kvm_hypervisor_ssh_port, true) }}"
        ansible_python_interpreter: >-
          {{ item.python_interpreter | default(kvm_hypervisor_python_interpreter, true) }}
        kvm_hypervisor_name: "{{ item.name }}"
        kvm_host_libvirt_uri: >-
          {{ item.libvirt_connection_uri | default(kvm_libvirt_connection_uri, true) }}
        kvm_host_image_cache_path: >-
          {{ item.image_cache_path | default(kvm_image_cache_path, true) }}
        kvm_host_instance_disk_pool_path: >-
          {{ item.instance_disk_pool_path | default(kvm_instance_disk_pool_path, true) }}
        kvm_host_cloud_init_workspace_path: >-
          {{ item.cloud_init_workspace_path | default(kvm_cloud_init_workspace_path, true) }}
        kvm_host_auto_create_image_cache_path: >-
          {{
            item.auto_create_image_cache_path
            | default(kvm_auto_create_image_cache_path, true)
          }}
        kvm_host_cleanup_workspace_path_after_run: >-
          {{
            item.cleanup_workspace_path_after_run
            | default(kvm_cleanup_workspace_path_after_run, true)
          }}
        kvm_host_default_hypervisor: "{{ kvm_effective_default_hypervisor }}"
      loop: "{{ kvm_resolved_hypervisors }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: Display resolved hypervisor fleet
      ansible.builtin.debug:
        msg: >-
          hypervisors={{ kvm_resolved_hypervisors | map(attribute='name') | list }}
          default={{ kvm_effective_default_hypervisor }}
          instances={{ kvm_instance_definitions | default([]) | length }}

- name: Execute KVM VM action
  hosts: hypervisor
  gather_facts: false
  vars_files:
    - vars/kvm-provisioning.yml
  environment:
    LIBVIRT_DEFAULT_URI: "{{ kvm_host_libvirt_uri | default(kvm_libvirt_connection_uri) }}"
  vars:
    kvm_action: "{{ kvm_action | default('provision') }}"

  tasks:
    - name: Run KVM provisioning workflow
      ansible.builtin.include_tasks: tasks/provision.yml
      when: kvm_action == 'provision'

    - name: Run KVM cleanup workflow
      ansible.builtin.include_tasks: tasks/cleanup.yml
      when: kvm_action == 'cleanup'

    - name: Run KVM connectivity check workflow
      ansible.builtin.include_tasks: tasks/ping.yml
      when: kvm_action == 'ping'
