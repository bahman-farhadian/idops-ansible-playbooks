---
# KVM HYPERVISOR HOSTS
#
# Where VMs are deployed. Declares every KVM host and the defaults each host
# falls back to: its credentials, its storage layout, the guest network it
# offers, and how libvirt reaches the disks it owns.
#
# This is one of several settings files, read in this order:
#   01-hypervisors.yml   where VMs are deployed: hosts, storage and network
#   02-vm-defaults.yml   CPU, memory, disks and overcommit policy
#   03-cloud-init.yml    guest users, access and first-boot content
#   04-images.yml        cloud images, and how they are cached and trusted
#   05-runtime.yml       readiness waits, snapshots and cleanup guards
#   06-instances.yml     the VMs to create, and on which host
#   settings.local.yml   optional, gitignored, overrides any of the above
# -----------------------------------------------------------------------------
# 1. KVM HOST CONNECTION DEFAULTS
# Applied to any host below that omits the matching key or leaves it empty.
# Set a value here once instead of repeating it on every host.
# There is no separate "default host" setting: an instance that does not name a
# hypervisor is deployed on the first host declared below.
# -----------------------------------------------------------------------------
kvm_hypervisor_user: ""                               # Default SSH user. Values: "" (SSH config/current user) | username.
kvm_hypervisor_ssh_private_key_file: ""               # Default SSH key. Values: "" (SSH agent/config) | path to key file.
kvm_hypervisor_ssh_port: 22                           # Default SSH port. Values: integer 1-65535.
kvm_hypervisor_python_interpreter: "/usr/bin/python3" # Default Python path on hosts. Values: absolute path.
kvm_libvirt_connection_uri: "qemu:///system"          # Default libvirt URI. Values: qemu:///system | qemu:///session.
kvm_require_explicit_hypervisor: false                # Force every instance to name its host. Values: false | true.


# -----------------------------------------------------------------------------
# 2. KVM HOST STORAGE DEFAULTS
# Where each host keeps images, VM disks and scratch files. Hosts rarely share
# a storage layout, so every value here can be restated per host below;
# these are only the fill-ins for hosts that do not.
# Paths derived from these follow automatically: the trusted checksum store
# sits under the image cache, and snapshot overlays under the disk pool.
# -----------------------------------------------------------------------------
kvm_image_cache_path: "/var/lib/libvirt/images/base"             # Base-image cache directory on hypervisor.
kvm_auto_create_image_cache_path: true                           # Auto-create kvm_image_cache_path when missing.
kvm_instance_disk_pool_path: "/var/lib/libvirt/images/instances" # Per-instance VM disk directory.
kvm_cloud_init_workspace_path: "/tmp/idops-kvm-cloud-init"       # Temporary cloud-init file workspace.
kvm_cleanup_workspace_path_after_run: true                       # Remove cloud-init workspace at end of provision stage.


# -----------------------------------------------------------------------------
# 3. KVM HYPERVISOR HOSTS
# Every KVM host is declared here the same way a VM is declared in
# 06-instances.yml:
# one list entry per host, with its own connection settings. A VM is deployed
# onto the host whose `name` it references through its `hypervisor` key.
#
# Only `name` is required. Any key left out, or left empty, falls back to the
# matching default above, exactly as instance keys fall back to the
# kvm_default_* values. The first entry below is where an instance lands when it
# does not name a hypervisor of its own.
#
# Keys:
# - name (required)                 logical host name; instances target it and
#                                   it is the inventory name matched by LIMIT
# - address                         SSH target. Values: FQDN | IP | SSH alias
# - user                            SSH user for this host
# - ssh_private_key_file            SSH private key for this host
# - ssh_port                        SSH port. Values: integer 1-65535
# - python_interpreter              Python path on this host
# - libvirt_connection_uri          Values: qemu:///system | qemu:///session
# - image_cache_path                 base-image cache dir on this host
# - instance_disk_pool_path          per-instance VM disk dir on this host
# - cloud_init_workspace_path        cloud-init scratch dir on this host
# - auto_create_image_cache_path     Values: true | false
# - cleanup_workspace_path_after_run Values: true | false
# - libvirt_network_name             libvirt network guests attach to
# - guest_network_gateway            IPv4 gateway of that network
# - guest_network_prefix             IPv4 prefix length of that network
# - guest_dns_servers                resolvers reachable from that network
# - auto_start_required_libvirt_networks  Values: true | false
# -----------------------------------------------------------------------------
kvm_hypervisors:
  - name: "kvm-host-1"                       # Host name referenced by instances.
    address: "change-me-hypervisor"          # CHANGE THIS. Values: FQDN | IP | SSH alias.
    user: ""                                 # SSH user. Values: "" (host default) | "root".
    ssh_private_key_file: ""                 # SSH key. Values: "" (host default) | "~/.ssh/id_kvm_host_1".
    ssh_port: 22                             # SSH port. Values: integer 1-65535.
    python_interpreter: "/usr/bin/python3"   # Python path on this host.
    libvirt_connection_uri: "qemu:///system" # Libvirt URI for this host.
    image_cache_path: ""                     # Base-image cache dir. "" = section 2 default.
    instance_disk_pool_path: ""              # VM disk dir. "" = section 2 default.
    cloud_init_workspace_path: ""            # Cloud-init scratch dir. "" = section 2 default.
    libvirt_network_name: ""                 # Guest network. "" = section 4 default.
    guest_network_gateway: ""                # IPv4 gateway. "" = section 4 default.
    guest_network_prefix: ""                 # IPv4 prefix. "" = section 4 default.

  # Add further hosts to deploy across a fleet in a single run. Each host keeps
  # its own credentials, so hosts may use different SSH keys and users.
  # Uncomment and adjust to enable the second host:
  #
  # - name: "kvm-host-2"                       # Instances target it as: hypervisor: "kvm-host-2".
  #   address: "192.168.10.12"                 # SSH target for this host.
  #   user: "operator"                         # SSH user for this host only.
  #   ssh_private_key_file: "~/.ssh/id_kvm_host_2" # This host's own SSH key.
  #   ssh_port: 2222                           # Non-default SSH port.
  #   python_interpreter: "/usr/bin/python3"   # Python path on this host.
  #   libvirt_connection_uri: "qemu:///system" # Libvirt URI for this host.
  #   image_cache_path: "/srv/kvm/iso-pool"    # This host's own base-image cache.
  #   instance_disk_pool_path: "/srv/kvm/stg-pool" # This host's own VM disk pool.
  #   cloud_init_workspace_path: "/tmp/idops-kvm-cloud-init" # Scratch dir on this host.
  #   libvirt_network_name: "br0"              # This host's own guest network.
  #   guest_network_gateway: "10.20.30.1"      # Gateway on that network.
  #   guest_network_prefix: "24"               # Prefix on that network.


# -----------------------------------------------------------------------------
# 4. HOST NETWORK DEFAULTS (overridable per host and per instance)
# -----------------------------------------------------------------------------
kvm_default_libvirt_network_name: "default"     # Libvirt network name for guest NIC attach.
kvm_auto_start_required_libvirt_networks: false # Auto-start inactive required networks during preflight.
kvm_default_guest_network_interface: "ens3"     # Guest NIC name for cloud-init network config.
kvm_guest_network_interface_fallbacks:          # Additional interface candidates for cloud-init static config.
  - "enp1s0"
  - "eth0"
kvm_default_guest_network_prefix: "24"             # Default IPv4 prefix length.
kvm_default_guest_network_gateway: "192.168.122.1" # Default IPv4 gateway.
kvm_default_guest_dns_servers:                     # Default DNS resolvers for guest cloud-init config.
  - "1.1.1.1"
  - "8.8.8.8"

# -----------------------------------------------------------------------------
# 5. HYPERVISOR RUNTIME ACCESS (libvirt/qemu user)
# -----------------------------------------------------------------------------
kvm_validate_runtime_pool_access: true   # Validate runtime user path access before mutation.
kvm_auto_fix_runtime_pool_access: true   # Auto-apply ACL fixes when runtime access checks fail.
kvm_libvirt_runtime_user: "libvirt-qemu" # Runtime disk-access user for libvirt/qemu.
