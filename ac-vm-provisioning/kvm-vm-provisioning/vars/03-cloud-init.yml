---
# GUEST CLOUD-INIT DEFAULTS
#
# Who can log into a guest, and what first boot does inside it.
#
# This is one of several settings files, read in this order:
#   01-hypervisors.yml   where VMs are deployed: hosts, storage and network
#   02-vm-defaults.yml   CPU, memory, disks and overcommit policy
#   03-cloud-init.yml    guest users, access and first-boot content
#   04-images.yml        cloud images, and how they are cached and trusted
#   05-runtime.yml       readiness waits, snapshots and cleanup guards
#   06-instances.yml     the VMs to create, and on which host
#   *.local.yml          required, gitignored, selected with LOCAL_SETTINGS_FILE
# -----------------------------------------------------------------------------
# 1. CLOUD-INIT GUEST ACCESS DEFAULTS (overridable per instance)
# The two SSH key lists and both passwords stay blank on purpose: they are
# real credentials, and belong only in the selected *.local.yml. Everything
# else here is a generic, safe default.
# -----------------------------------------------------------------------------
kvm_default_cloud_init_user: "idops"                   # Initial guest username created by cloud-init. Values: a username, e.g. "idops".
kvm_default_cloud_init_ssh_public_keys: []             # Initial SSH authorized keys for cloud-init user. Values: [] | list of "ssh-ed25519 AAAA..." strings.
kvm_default_cloud_init_plain_password: ""              # CHANGE THIS PASSWORD BEFORE PRODUCTION. Example: "a strong passphrase".
kvm_default_cloud_init_root_plain_password: ""         # Optional root password. Values: "" (root password stays locked) | a plaintext password.
kvm_default_cloud_init_root_ssh_public_keys: []        # Optional SSH keys authorized for root. Values: [] (no key-based root SSH) | list of "ssh-ed25519 AAAA..." strings.
kvm_default_cloud_init_user_sudo_rule: "ALL=(ALL) ALL" # Sudo policy for cloud-init user. Values: "ALL=(ALL) ALL" | "ALL=(ALL) NOPASSWD:ALL".
kvm_default_cloud_init_ssh_password_auth: false        # Enable SSH password auth in guest. Values: true | false.
# disable_root is documented by cloud-init as governing a key it would place in
# root's authorized_keys on its own initiative (a cloud-provider-supplied
# default key), not an explicit key given to root directly, which is what
# kvm_default_cloud_init_root_ssh_public_keys above adds. Verify this on your
# own image if root key-based SSH does not come up with disable_root left true.
kvm_default_cloud_init_disable_root: true # Disable direct root login via cloud-init. Values: true | false.


# -----------------------------------------------------------------------------
# 2. CLOUD-INIT SEED CONTENT DEFAULTS (overridable per instance)
# -----------------------------------------------------------------------------
kvm_default_cloud_init_manage_etc_hosts: true           # Manage /etc/hosts entries. Values: true | false.
kvm_default_cloud_init_timezone: "UTC"                  # Guest timezone.
kvm_default_cloud_init_locale: "en_US.UTF-8"            # Guest locale.
kvm_default_cloud_init_package_update: true             # Run apt update during first boot. Values: true | false.
kvm_default_cloud_init_package_upgrade: true            # Run apt upgrade during first boot. Values: true | false.
kvm_default_cloud_init_package_reboot_if_required: true # Reboot automatically if upgrades require it. Values: true | false.
kvm_default_cloud_init_apt_config:                      # Default Debian APT mirrors (cloud-init apt map).
  preserve_sources_list: true
  primary:
    - arches: [default]
      uri: "http://deb.debian.org/debian"
  security:
    - arches: [default]
      uri: "http://deb.debian.org/debian-security"
kvm_default_cloud_init_packages: # Package list to install on first boot; SSH and guest agent services are mandatory.
  - "openssh-server"
  - "qemu-guest-agent"
kvm_default_cloud_init_bootcmd: []                                                # cloud-init bootcmd list. Values: [] | list of shell command strings.
kvm_default_cloud_init_extra_hosts: []                                            # Extra names appended to cloud-init hosts templates. Values: [] | list of {ip, names}.
# Example (was the live default; see local settings for real values):
# kvm_default_cloud_init_extra_hosts:
#   - ip: "192.0.2.20"
#     names: ["deb.example.local"]
kvm_default_cloud_init_disable_multicast_dns: false                               # Write a systemd-resolved drop-in that turns off mDNS/LLMNR so .local uses unicast DNS. Values: true | false.
kvm_default_cloud_init_runcmd: []                                                 # cloud-init runcmd list. Values: [] | list of shell command strings.
kvm_default_cloud_init_write_files: []                                            # cloud-init write_files list. Values: [] | list of cloud-init write_files entries.
kvm_default_cloud_init_tune_networkd_wait_online: true                            # Apply systemd-networkd-wait-online timeout tuning on Debian 12 guests. Values: true | false.
kvm_default_cloud_init_networkd_wait_online_timeout_seconds: 15                   # Debian 12 systemd-networkd-wait-online timeout in seconds.
kvm_default_cloud_init_final_message: "cloud-init finished after $UPTIME seconds" # Final cloud-init completion message.
