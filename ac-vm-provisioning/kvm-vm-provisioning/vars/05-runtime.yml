---
# RUNTIME, SNAPSHOT AND CLEANUP POLICY
#
# How the workflow waits for guests, the mandatory baseline snapshot, and the
# guards that stand between a run and deleted data.
#
# This is one of several settings files, read in this order:
#   01-hypervisors.yml   where VMs are deployed: hosts, storage and network
#   02-vm-defaults.yml   CPU, memory, disks and overcommit policy
#   03-cloud-init.yml    guest users, access and first-boot content
#   04-images.yml        cloud images, and how they are cached and trusted
#   05-runtime.yml       readiness waits, snapshots and cleanup guards
#   06-instances.yml     the VMs to create, and on which host
#   *.local.yml          required, gitignored, selected with LOCAL_SETTINGS_FILE
# -----------------------------------------------------------------------------
# 1. RUNTIME AND READINESS BEHAVIOR
# -----------------------------------------------------------------------------
kvm_ensure_requested_instances_running: true   # Ensure requested instances are running in runtime stage. Values: true | false.
kvm_wait_for_cloud_init_before_snapshot: true  # Mandatory readiness gate for domains missing the baseline snapshot. Values: true | false.
kvm_qemu_guest_agent_wait_timeout_seconds: 300 # Maximum wait per visible guest readiness checkpoint, in seconds.
kvm_qemu_guest_agent_poll_interval_seconds: 5  # Delay between QEMU Guest Agent readiness retries, in seconds.
kvm_shutdown_wait_retries: 30                  # Maximum clean-shutdown state checks before snapshot creation.
kvm_shutdown_wait_delay_seconds: 2             # Delay between clean-shutdown state checks, in seconds.


# -----------------------------------------------------------------------------
# 2. SNAPSHOT BEHAVIOR
# Overlay files are written next to the VM disks in kvm_instance_disk_pool_path
# (or that host's instance_disk_pool_path). There is no separate overlay
# directory setting. cleanup-force-disks removes those overlay files from the
# same directory.
# -----------------------------------------------------------------------------
kvm_snapshot_enabled: true                                     # Mandatory external baseline snapshot reconciliation for declared domains. Values: true | false.
kvm_snapshot_name: "baseline"                                  # Snapshot name label. Values: a libvirt snapshot name, e.g. "baseline".
kvm_snapshot_description: "Post-provision baseline snapshot"   # Snapshot description. Example: "Post-provision baseline snapshot".
kvm_start_instances_after_snapshot: true                       # Start reconciled instances after creating a missing snapshot. Values: true | false.


# -----------------------------------------------------------------------------
# 3. WORKFLOW AND CLEANUP SAFEGUARDS
# Cleanup only ever touches the instance_name values in 06-instances.yml.
# The two safety flags below default to false on purpose: cleanup is a
# destructive action and must be turned on deliberately, per run.
# -----------------------------------------------------------------------------
kvm_execute_mutation_phases_in_check_mode: false # Allow mutating stages in --check mode. Values: true | false.
kvm_parallel_instance_workers: 4                 # Max concurrent per-instance heavy operations during provision stage.
kvm_cleanup_confirmed: false                     # Safety flag for cleanup action. Values: true | false.
kvm_cleanup_remove_instance_disks: false         # Remove declared instance disks, snapshot overlays, and stale seed disks during cleanup. Values: true | false.
