---
# RUNTIME, SNAPSHOT AND CLEANUP POLICY
#
# How the workflow waits for guests, the mandatory baseline snapshot, and the
# guards that stand between a run and deleted data.
#
# This is one of several settings files, read in this order:
#   01-hypervisors.yml   where VMs are deployed: hosts, storage and network
#   02-vm-defaults.yml   CPU, memory, disks and overcommit policy
#   03-cloud-init.yml    guest users, access and first-boot content
#   04-images.yml        cloud images, and how they are cached and trusted
#   05-runtime.yml       readiness waits, snapshots and cleanup guards
#   06-instances.yml     the VMs to create, and on which host
#   settings.local.yml   optional, gitignored, overrides any of the above
# -----------------------------------------------------------------------------
# 1. RUNTIME AND READINESS BEHAVIOR
# -----------------------------------------------------------------------------
kvm_ensure_requested_instances_running: true        # Ensure requested instances are running in runtime stage.
kvm_wait_for_cloud_init_before_snapshot: true       # Mandatory readiness gate for domains missing the baseline snapshot.
kvm_qemu_guest_agent_wait_timeout_seconds: 600      # Maximum wait per visible guest readiness checkpoint.
kvm_qemu_guest_agent_poll_interval_seconds: 5       # Delay between QEMU Guest Agent readiness retries.
kvm_shutdown_wait_retries: 60                       # Maximum clean-shutdown state checks before snapshot creation.
kvm_shutdown_wait_delay_seconds: 3                  # Delay between clean-shutdown state checks.


# -----------------------------------------------------------------------------
# 2. SNAPSHOT BEHAVIOR
# -----------------------------------------------------------------------------
kvm_snapshot_enabled: true                                               # Mandatory external baseline snapshot reconciliation for declared domains.
kvm_snapshot_name: "snapshot-a"                                          # Snapshot name label.
kvm_snapshot_description: "initial configuration"                        # Snapshot description.
kvm_snapshot_overlay_path: "{{ kvm_instance_disk_pool_path }}/snapshots" # External snapshot qcow2 overlay directory.
kvm_start_instances_after_snapshot: true                                 # Start reconciled instances after creating a missing snapshot.


# -----------------------------------------------------------------------------
# 3. WORKFLOW AND CLEANUP SAFEGUARDS
# Cleanup only ever touches the instance_name values in 06-instances.yml.
# -----------------------------------------------------------------------------
kvm_execute_mutation_phases_in_check_mode: false # Allow mutating stages in --check mode. Values: true | false.
kvm_parallel_instance_workers: 4                 # Max concurrent per-instance heavy operations during provision stage.
kvm_cleanup_confirmed: false                     # Safety flag for cleanup action.
kvm_cleanup_remove_instance_disks: false         # Remove declared instance disks, snapshot overlays, and stale seed disks during cleanup.
