---
# CLOUD IMAGE CATALOG AND CACHE
#
# The Debian and Ubuntu images VMs are built from, pinned by version, and how
# they are downloaded, verified and trusted offline.
#
# This is one of several settings files, read in this order:
#   01-hypervisors.yml   where VMs are deployed: hosts, storage and network
#   02-vm-defaults.yml   CPU, memory, disks and overcommit policy
#   03-cloud-init.yml    guest users, access and first-boot content
#   04-images.yml        cloud images, and how they are cached and trusted
#   05-runtime.yml       readiness waits, snapshots and cleanup guards
#   06-instances.yml     the VMs to create, and on which host
#   settings.local.yml   required, gitignored, overrides any of the above
# -----------------------------------------------------------------------------
# 1. CLOUD IMAGE CATALOG
# Referenced by the image_profile_id of each VM in 06-instances.yml.
# Images are pinned by an explicit version token (image_version), NOT "latest".
# The image_url / image_filename / image_checksum_manifest_url are derived from
# image_distro + image_codename + image_major + image_variant + image_version.
# Debian example:
#   https://cloud.debian.org/images/cloud/trixie/20260706-2531/debian-13-generic-amd64-20260706-2531.qcow2
# Ubuntu example:
#   https://cloud-images.ubuntu.com/releases/noble/release-20260911/ubuntu-24.04-server-cloudimg-amd64.img
# image_version pins a build token (Debian) or release serial (Ubuntu) and
# needs bumping over time as new builds ship. Pick the token from the suite
# directory listing:
#   Debian 12 (bookworm): https://cloud.debian.org/images/cloud/bookworm/
#   Debian 13 (trixie):   https://cloud.debian.org/images/cloud/trixie/
#   Ubuntu 24.04 (noble): https://cloud-images.ubuntu.com/releases/noble/
#   Ubuntu 26.04 (resolute): https://cloud-images.ubuntu.com/releases/resolute/
# Ubuntu pins use the dated release-<serial>/ directory, not the moving
# release/ pointer. Canonical ships the KVM disk as .img (qcow2 internally);
# it is cached under that name. Guest disks in the instance pool stay qcow2.
# The trusted checksum is resolved once per version, stored locally as an
# immutable (chattr +i) file, and reused on every later run without web access.
# make image-cache processes all catalog profiles.
# To add/remove variants, edit this catalog and update profile references in
# kvm_instance_definitions.
# NOTE: Debian nocloud images were not reliable for this workflow.
# -----------------------------------------------------------------------------
kvm_cloud_image_catalog:
  debian-12:
    image_distro: "debian"              # Cloud image family. Values: "debian" | "ubuntu".
    image_codename: "bookworm"          # Debian codename for this major.
    image_major: "12"                   # Major version used in the image filename.
    image_variant: "generic"            # Cloud image variant (generic | genericcloud).
    # Pick this profile's image_version from https://cloud.debian.org/images/cloud/bookworm/
    image_version: "20260806-2562"      # REQUIRED: pin a Debian build token. Example: 20260706-2531.
    image_checksum_algorithm: "sha512"  # Checksum algorithm used by the manifest.
    # image_checksum: ""                # Optional operator-provided expected checksum (enables offline acquisition).
    virt_install_os_variant: "debian12" # OS variant for virt-install.
    virt_install_machine_type: "q35"    # Keep aligned with Debian 13 profile.
    seed_device_bus: "scsi"             # Keep aligned with Debian 13 profile.
    firmware_boot_mode: "uefi"          # Required for the tested Debian cloud-image workflow.

  debian-13:
    image_distro: "debian"              # Cloud image family. Values: "debian" | "ubuntu".
    image_codename: "trixie"            # Debian codename for this major.
    image_major: "13"                   # Major version used in the image filename.
    image_variant: "generic"            # Cloud image variant (generic | genericcloud).
    # Pick this profile's image_version from https://cloud.debian.org/images/cloud/trixie/
    image_version: "20260810-2566"      # REQUIRED: pin a Debian build token. Example: 20260706-2531.
    image_checksum_algorithm: "sha512"  # Checksum algorithm used by the manifest.
    # image_checksum: ""                # Optional operator-provided expected checksum (enables offline acquisition).
    virt_install_os_variant: "debian13" # OS variant for virt-install.
    virt_install_machine_type: "q35"    # Debian 13 profile uses q35 machine.
    seed_device_bus: "scsi"             # Keep aligned with Debian 12 profile.
    firmware_boot_mode: "uefi"          # Required for Debian 13 cloud-image boot on this hypervisor.

  ubuntu-24:
    image_distro: "ubuntu"              # Cloud image family. Values: "debian" | "ubuntu".
    image_codename: "noble"             # Ubuntu series name used in the releases URL.
    image_major: "24.04"                # Major version used in the image filename.
    # Pick this profile's image_version from https://cloud-images.ubuntu.com/releases/noble/
    # Pin is https://cloud-images.ubuntu.com/releases/noble/release-20260911/
    image_version: "20260911"           # REQUIRED: pin an Ubuntu release serial. Example: 20260911.
    image_checksum_algorithm: "sha256"  # Checksum algorithm used by the manifest.
    virt_install_os_variant: "ubuntu24.04" # OS variant for virt-install.
    virt_install_machine_type: "q35"    # Keep aligned with Debian profiles.
    seed_device_bus: "scsi"             # Keep aligned with Debian profiles.
    firmware_boot_mode: "uefi"          # Required for the tested cloud-image workflow.

  ubuntu-26:
    image_distro: "ubuntu"              # Cloud image family. Values: "debian" | "ubuntu".
    image_codename: "resolute"          # Ubuntu series name used in the releases URL.
    image_major: "26.04"                # Major version used in the image filename.
    # Pick this profile's image_version from https://cloud-images.ubuntu.com/releases/resolute/
    # Pin is https://cloud-images.ubuntu.com/releases/resolute/release-20260918/
    image_version: "20260918"           # REQUIRED: pin an Ubuntu release serial. Example: 20260918.
    image_checksum_algorithm: "sha256"  # Checksum algorithm used by the manifest.
    # libosinfo on this stack has no ubuntu26.04 id yet; ubuntu25.10 is the newest Ubuntu variant.
    virt_install_os_variant: "ubuntu25.10" # OS variant for virt-install.
    virt_install_machine_type: "q35"    # Keep aligned with Debian profiles.
    seed_device_bus: "scsi"             # Keep aligned with Debian profiles.
    firmware_boot_mode: "uefi"          # Required for the tested cloud-image workflow.


# -----------------------------------------------------------------------------
# 2. IMAGE CACHE POLICY AND TRUSTED CHECKSUMS
# The trusted checksum cache is offline-first and immutable.
# -----------------------------------------------------------------------------
kvm_image_cache_verify_on_run: true                                # Verify cached image checksums on image-cache stage. Values: true | false.
kvm_image_cache_repair_on_checksum_mismatch: true                  # Re-download corrupted cached image file when checksum fails. Values: true | false.
kvm_image_manifest_refresh_policy: "on-demand"                     # Manifest fetch policy in provision flow. Values: "on-demand" | "always".
kvm_force_manifest_refresh: false                                  # Force checksum re-resolution (removes local immutable checksum, re-fetches). Values: true | false.
kvm_allow_nocloud_images: false                                    # Allow nocloud images. Values: false (recommended) | true (override).
kvm_image_checksum_cache_path: "/var/lib/libvirt/images/checksums" # Store for the per-version trusted checksum files.
kvm_checksum_file_immutable: true                                  # Make the trusted checksum file immutable with chattr +i. Values: true | false.
