---
# KVM VM Provisioning configuration
# Single source of user-editable settings.
#
# Read top to bottom. Each topic states its defaults before the thing that
# uses them: the host defaults precede the hosts, and the VM specification
# defaults precede the VM list. The file therefore ends with the only
# question left once everything above is settled: which VMs to create.
#
#    1. KVM host connection defaults  SSH and libvirt fill-ins for section 3
#    2. KVM host storage defaults     path fill-ins for section 3
#    3. KVM hypervisor hosts          where VMs are deployed, and each host's paths
#    4. Instance compute defaults     CPU, memory, disk and topology fill-ins
#    5. Instance CPU share            controlled overcommit policy
#    6. Instance network defaults     libvirt network and guest addressing
#    7. Instance additional disks     optional additional data disks
#    8. Cloud-init guest access       users, passwords and SSH access
#    9. Cloud-init seed content       locale, packages and first-boot commands
#   10. Cloud image catalog           pinned Debian cloud images
#   11. Image cache policy            download, verification and checksum trust
#   12. Runtime and readiness         boot, guest agent and shutdown waits
#   13. Snapshots                     mandatory baseline snapshot policy
#   14. Hypervisor runtime access     libvirt/qemu user and ACL handling
#   15. Workflow and cleanup          check mode, concurrency and delete guards
#   16. VM instances                  the VMs to create, and on which host
# -----------------------------------------------------------------------------
# 1. KVM HOST CONNECTION DEFAULTS
# Applied to any section 3 entry that omits the matching key or leaves it empty.
# Set a value here once instead of repeating it on every host.
# There is no separate "default host" setting: an instance that does not name a
# hypervisor is deployed on the first entry of section 3.
# -----------------------------------------------------------------------------
kvm_hypervisor_user: ""                               # Default SSH user. Values: "" (SSH config/current user) | username.
kvm_hypervisor_ssh_private_key_file: ""               # Default SSH key. Values: "" (SSH agent/config) | path to key file.
kvm_hypervisor_ssh_port: 22                           # Default SSH port. Values: integer 1-65535.
kvm_hypervisor_python_interpreter: "/usr/bin/python3" # Default Python path on hosts. Values: absolute path.
kvm_libvirt_connection_uri: "qemu:///system"          # Default libvirt URI. Values: qemu:///system | qemu:///session.
kvm_require_explicit_hypervisor: false                # Force every instance to name its host. Values: false | true.

# -----------------------------------------------------------------------------
# 2. KVM HOST STORAGE DEFAULTS
# Where each host keeps images, VM disks and scratch files. Hosts rarely share
# a storage layout, so every value here can be restated per host in section 3;
# these are only the fill-ins for hosts that do not.
# Paths derived from these follow automatically: the trusted checksum store
# sits under the image cache, and snapshot overlays under the disk pool.
# -----------------------------------------------------------------------------
kvm_image_cache_path: "/var/lib/libvirt/images/base"             # Base-image cache directory on hypervisor.
kvm_auto_create_image_cache_path: true                           # Auto-create kvm_image_cache_path when missing.
kvm_instance_disk_pool_path: "/var/lib/libvirt/images/instances" # Per-instance VM disk directory.
kvm_cloud_init_workspace_path: "/tmp/idops-kvm-cloud-init"       # Temporary cloud-init file workspace.
kvm_cleanup_workspace_path_after_run: true                       # Remove cloud-init workspace at end of provision stage.

# -----------------------------------------------------------------------------
# 3. KVM HYPERVISOR HOSTS
# Every KVM host is declared here the same way a VM is declared in section 16:
# one list entry per host, with its own connection settings. A VM is deployed
# onto the host whose `name` it references through its `hypervisor` key.
#
# Only `name` is required. Any key left out, or left empty, falls back to the
# matching value in section 1 or 2, exactly as instance keys fall back to the
# kvm_default_* values. The first entry below is where an instance lands when it
# does not name a hypervisor of its own.
#
# Keys:
# - name (required)                 logical host name; instances target it and
#                                   it is the inventory name matched by LIMIT
# - address                         SSH target. Values: FQDN | IP | SSH alias
# - user                            SSH user for this host
# - ssh_private_key_file            SSH private key for this host
# - ssh_port                        SSH port. Values: integer 1-65535
# - python_interpreter              Python path on this host
# - libvirt_connection_uri          Values: qemu:///system | qemu:///session
# - image_cache_path                 base-image cache dir on this host
# - instance_disk_pool_path          per-instance VM disk dir on this host
# - cloud_init_workspace_path        cloud-init scratch dir on this host
# - auto_create_image_cache_path     Values: true | false
# - cleanup_workspace_path_after_run Values: true | false
# -----------------------------------------------------------------------------
kvm_hypervisors:
  - name: "kvm-host-1"                       # Host name referenced by instances.
    address: "change-me-hypervisor"          # CHANGE THIS. Values: FQDN | IP | SSH alias.
    user: ""                                 # SSH user. Values: "" (host default) | "root".
    ssh_private_key_file: ""                 # SSH key. Values: "" (host default) | "~/.ssh/id_kvm_host_1".
    ssh_port: 22                             # SSH port. Values: integer 1-65535.
    python_interpreter: "/usr/bin/python3"   # Python path on this host.
    libvirt_connection_uri: "qemu:///system" # Libvirt URI for this host.
    image_cache_path: ""                     # Base-image cache dir. "" = section 2 default.
    instance_disk_pool_path: ""              # VM disk dir. "" = section 2 default.
    cloud_init_workspace_path: ""            # Cloud-init scratch dir. "" = section 2 default.

  # Add further hosts to deploy across a fleet in a single run. Each host keeps
  # its own credentials, so hosts may use different SSH keys and users.
  # Uncomment and adjust to enable the second host:
  #
  # - name: "kvm-host-2"                       # Instances target it as: hypervisor: "kvm-host-2".
  #   address: "192.168.10.12"                 # SSH target for this host.
  #   user: "operator"                         # SSH user for this host only.
  #   ssh_private_key_file: "~/.ssh/id_kvm_host_2" # This host's own SSH key.
  #   ssh_port: 2222                           # Non-default SSH port.
  #   python_interpreter: "/usr/bin/python3"   # Python path on this host.
  #   libvirt_connection_uri: "qemu:///system" # Libvirt URI for this host.
  #   image_cache_path: "/srv/kvm/iso-pool"    # This host's own base-image cache.
  #   instance_disk_pool_path: "/srv/kvm/stg-pool" # This host's own VM disk pool.
  #   cloud_init_workspace_path: "/tmp/idops-kvm-cloud-init" # Scratch dir on this host.

# -----------------------------------------------------------------------------
# 4. INSTANCE COMPUTE DEFAULTS
# Applied to any section 16 entry that omits the matching key.
# -----------------------------------------------------------------------------
kvm_default_instance_disk_extension: "qcow2"   # Default disk file extension/format.
kvm_default_root_disk_size_gb: 20              # Default total instance disk size in GiB for new instances.
kvm_force_single_socket_vcpu_topology: true    # CPU topology policy. true=sockets=1,threads=1; false=plain vcpu_count.
kvm_allow_reuse_existing_instance_disks: false # Reuse pre-existing instance disk files when domain is missing.

# -----------------------------------------------------------------------------
# 5. INSTANCE CPU SHARE / CONTROLLED OVERCOMMIT (overridable per instance)
# When cpu_share_enabled is true, every vCPU of the instance is capped by the
# Linux CFS bandwidth controller so that kvm_cpu_share_vcpu_per_host_cpu vCPUs
# are worth at most one host CPU. With the default ratio of 2, a 4 vCPU guest
# can never consume more than 2 host CPUs, so guests can be overcommitted on a
# host with fewer CPUs without competing for the same physical time slices.
# This is a hard cap written to the domain as <cputune><period>/<quota>, not a
# relative weight: a capped guest cannot starve its neighbours even under load.
# The cap is reconciled on every provision run, so toggling the flag on an
# existing domain converges without recreating it.
#
# Enable it for one instance with:  cpu_share_enabled: true
# -----------------------------------------------------------------------------
kvm_default_cpu_share_enabled: false            # Cap vCPU bandwidth by default. Values: true | false.
kvm_cpu_share_vcpu_per_host_cpu: 2              # vCPUs worth one host CPU when capped. Values: integer >= 1.
kvm_cpu_share_period_microseconds: 100000       # CFS enforcement period. Values: 1000-1000000.
kvm_cpu_share_apply_to_running_domains: true    # Also apply the cap live to already-running domains.
kvm_cpu_share_validate_host_capacity: true      # Preflight guard on total host CPU demand. Values: true | false.
kvm_cpu_share_host_cpu_reserve: 1               # Host CPUs held back for the hypervisor itself. Values: integer >= 0.
kvm_cpu_share_allow_capacity_overcommit: false  # Allow demand above usable host CPUs. Values: false | true.

# -----------------------------------------------------------------------------
# 6. INSTANCE NETWORK DEFAULTS (overridable per instance)
# -----------------------------------------------------------------------------
kvm_default_libvirt_network_name: "default"     # Libvirt network name for guest NIC attach.
kvm_auto_start_required_libvirt_networks: false # Auto-start inactive required networks during preflight.
kvm_default_guest_network_interface: "ens3"     # Guest NIC name for cloud-init network config.
kvm_guest_network_interface_fallbacks:          # Additional interface candidates for cloud-init static config.
  - "enp1s0"
  - "eth0"
kvm_default_guest_network_prefix: "24"             # Default IPv4 prefix length.
kvm_default_guest_network_gateway: "192.168.122.1" # Default IPv4 gateway.
kvm_default_guest_dns_servers:                     # Default DNS resolvers for guest cloud-init config.
  - "1.1.1.1"
  - "8.8.8.8"

# -----------------------------------------------------------------------------
# 7. INSTANCE ADDITIONAL DISKS (overridable per instance)
# instance_extra_disks item keys:
# - guest_device (required, vd[b-z], example: vdb)
# - size_gb (required, integer > 0)
# - mount_point (required, absolute path, example: /data or /var/lib/app)
#   NOTE: /var is blocked by default because mounting a fresh disk on /var can break boot.
# - filesystem (optional, ext4 | xfs, default: ext4)
# - mount_options (optional, default: defaults,nofail)
# - disk_extension (optional, default: instance_disk_extension)
# - filesystem_label (optional, default: <instance>-<guest_device>, truncated)
# -----------------------------------------------------------------------------
kvm_default_instance_extra_disks_enabled: false # Enable additional disk provisioning. Values: true | false.
kvm_default_instance_extra_disks: []            # Extra disk list. Values: [] | list of disk maps (guest_device, size_gb, mount_point, ...).
kvm_allow_mount_var_on_extra_disk: false        # Allow /var mount on fresh extra disk (unsafe). Values: false | true.

# -----------------------------------------------------------------------------
# 8. CLOUD-INIT GUEST ACCESS DEFAULTS (overridable per instance)
# -----------------------------------------------------------------------------
kvm_default_cloud_init_user: "idops"                        # Initial guest username created by cloud-init.
kvm_default_cloud_init_ssh_public_keys: []                  # Initial SSH authorized keys for cloud-init user.
kvm_default_cloud_init_plain_password: "idopspassword"      # CHANGE THIS PASSWORD BEFORE PRODUCTION.
kvm_default_cloud_init_root_plain_password: "idopspassword" # Optional root password (leave empty to keep root password locked).
kvm_default_cloud_init_user_sudo_rule: "ALL=(ALL) ALL"      # Sudo policy for cloud-init user. Example: ALL=(ALL) ALL | ALL=(ALL) NOPASSWD:ALL.
kvm_default_cloud_init_ssh_password_auth: true              # Enable SSH password auth in guest.
kvm_default_cloud_init_disable_root: true                   # Disable direct root login via cloud-init.

# -----------------------------------------------------------------------------
# 9. CLOUD-INIT SEED CONTENT DEFAULTS (overridable per instance)
# -----------------------------------------------------------------------------
kvm_default_cloud_init_manage_etc_hosts: true            # Manage /etc/hosts entries. Values: true | false.
kvm_default_cloud_init_timezone: "UTC"                   # Guest timezone. Example: UTC | Europe/Berlin | Asia/Tehran.
kvm_default_cloud_init_locale: "en_US.UTF-8"             # Guest locale.
kvm_default_cloud_init_package_update: true              # Run apt update during first boot.
kvm_default_cloud_init_package_upgrade: false            # Run apt upgrade during first boot.
kvm_default_cloud_init_package_reboot_if_required: false # Reboot automatically if upgrades require it.
kvm_default_cloud_init_apt_config:                       # Default Debian APT mirrors (cloud-init apt map).
  preserve_sources_list: true
  primary:
    - arches: [default]
      uri: "http://deb.debian.org/debian"
  security:
    - arches: [default]
      uri: "http://deb.debian.org/debian-security"
kvm_default_cloud_init_packages: [openssh-server, qemu-guest-agent]             # Package list to install on first boot; SSH and guest agent services are mandatory.
kvm_default_cloud_init_bootcmd: []                                              # cloud-init bootcmd list.
kvm_default_cloud_init_runcmd: []                                               # cloud-init runcmd list.
kvm_default_cloud_init_write_files: []                                          # cloud-init write_files list.
kvm_default_cloud_init_tune_networkd_wait_online: true                          # Apply systemd-networkd-wait-online timeout tuning on Debian 12 guests.
kvm_default_cloud_init_networkd_wait_online_timeout_seconds: 30                 # Debian 12 systemd-networkd-wait-online timeout in seconds.
kvm_default_cloud_init_final_message: "IDOPS CLOUD-INIT FINISHED AT $TIMESTAMP" # Final cloud-init completion message.

# -----------------------------------------------------------------------------
# 10. CLOUD IMAGE CATALOG
# Referenced by the image_profile_id of each instance in section 16.
# Images are pinned by an explicit version token (image_version), NOT "latest".
# The image_url / image_filename / image_checksum_manifest_url are derived from
# image_codename + image_major + image_variant + image_version, e.g.:
#   https://cloud.debian.org/images/cloud/trixie/20260706-2531/debian-13-generic-amd64-20260706-2531.qcow2
# image_version is REQUIRED (no default): set it to a pinned Debian build token.
# The trusted checksum is resolved once per version, stored locally as an
# immutable (chattr +i) file, and reused on every later run without web access.
# This project is Debian-only: keep entries as Debian generic qcow2 images.
# make image-cache processes all profiles defined in this catalog.
# To add/remove Debian variants (for example debian-14), edit this catalog and
# update profile references in kvm_instance_definitions.
# NOTE: Debian nocloud images were not reliable for this workflow.
# -----------------------------------------------------------------------------
kvm_cloud_image_catalog:
  debian-12:
    image_codename: "bookworm"          # Debian codename for this major.
    image_major: "12"                   # Major version used in the image filename.
    image_variant: "generic"            # Cloud image variant (generic | genericcloud).
    image_version: "20260806-2562"      # REQUIRED: pin a Debian build token, e.g. 20260706-2531.
    image_checksum_algorithm: "sha512"  # Checksum algorithm used by the manifest.
    # image_checksum: ""                # Optional operator-provided expected checksum (enables offline acquisition).
    virt_install_os_variant: "debian12" # OS variant for virt-install.
    virt_install_machine_type: "q35"    # Keep aligned with Debian 13 profile.
    seed_device_bus: "scsi"             # Keep aligned with Debian 13 profile.
    firmware_boot_mode: "uefi"          # Required for the tested Debian cloud-image workflow.

  debian-13:
    image_codename: "trixie"            # Debian codename for this major.
    image_major: "13"                   # Major version used in the image filename.
    image_variant: "generic"            # Cloud image variant (generic | genericcloud).
    image_version: "20260810-2566"      # REQUIRED: pin a Debian build token, e.g. 20260706-2531.
    image_checksum_algorithm: "sha512"  # Checksum algorithm used by the manifest.
    # image_checksum: ""                # Optional operator-provided expected checksum (enables offline acquisition).
    virt_install_os_variant: "debian13" # OS variant for virt-install.
    virt_install_machine_type: "q35"    # Debian 13 profile uses q35 machine.
    seed_device_bus: "scsi"             # Keep aligned with Debian 12 profile.
    firmware_boot_mode: "uefi"          # Required for Debian 13 cloud-image boot on this hypervisor.

# -----------------------------------------------------------------------------
# 11. IMAGE CACHE POLICY AND TRUSTED CHECKSUMS
# The trusted checksum cache is offline-first and immutable.
# -----------------------------------------------------------------------------
kvm_image_cache_verify_on_run: true                                    # Verify cached image checksums on image-cache stage.
kvm_image_cache_repair_on_checksum_mismatch: false                     # Re-download corrupted cached image file when checksum fails.
kvm_image_manifest_refresh_policy: "on-demand"                         # Manifest fetch policy in provision flow. Values: on-demand | always.
kvm_force_manifest_refresh: false                                      # Force checksum re-resolution (removes local immutable checksum, re-fetches). Values: true | false.
kvm_allow_nocloud_images: false                                        # Allow nocloud images. Values: false (recommended) | true (override).
kvm_image_checksum_cache_path: "{{ kvm_image_cache_path }}/.checksums" # Store for the per-version trusted checksum files.
kvm_checksum_file_immutable: true                                      # Make the trusted checksum file immutable with chattr +i. Values: true | false.

# -----------------------------------------------------------------------------
# 12. RUNTIME AND READINESS BEHAVIOR
# -----------------------------------------------------------------------------
kvm_ensure_requested_instances_running: true        # Ensure requested instances are running in runtime stage.
kvm_wait_for_cloud_init_before_snapshot: true       # Mandatory readiness gate for domains missing the baseline snapshot.
kvm_qemu_guest_agent_wait_timeout_seconds: 600      # Maximum wait per visible guest readiness checkpoint.
kvm_qemu_guest_agent_poll_interval_seconds: 5       # Delay between QEMU Guest Agent readiness retries.
kvm_shutdown_wait_retries: 60                       # Maximum clean-shutdown state checks before snapshot creation.
kvm_shutdown_wait_delay_seconds: 3                  # Delay between clean-shutdown state checks.

# -----------------------------------------------------------------------------
# 13. SNAPSHOT BEHAVIOR
# -----------------------------------------------------------------------------
kvm_snapshot_enabled: true                                               # Mandatory external baseline snapshot reconciliation for declared domains.
kvm_snapshot_name: "snapshot-a"                                          # Snapshot name label.
kvm_snapshot_description: "initial configuration"                        # Snapshot description.
kvm_snapshot_overlay_path: "{{ kvm_instance_disk_pool_path }}/snapshots" # External snapshot qcow2 overlay directory.
kvm_start_instances_after_snapshot: true                                 # Start reconciled instances after creating a missing snapshot.

# -----------------------------------------------------------------------------
# 14. HYPERVISOR RUNTIME ACCESS (libvirt/qemu user)
# -----------------------------------------------------------------------------
kvm_validate_runtime_pool_access: true   # Validate runtime user path access before mutation.
kvm_auto_fix_runtime_pool_access: true   # Auto-apply ACL fixes when runtime access checks fail.
kvm_libvirt_runtime_user: "libvirt-qemu" # Runtime disk-access user for libvirt/qemu.

# -----------------------------------------------------------------------------
# 15. WORKFLOW AND CLEANUP SAFEGUARDS
# Cleanup only ever touches the instance_name values declared in section 16.
# -----------------------------------------------------------------------------
kvm_execute_mutation_phases_in_check_mode: false # Allow mutating stages in --check mode. Values: true | false.
kvm_parallel_instance_workers: 4                 # Max concurrent per-instance heavy operations during provision stage.
kvm_cleanup_confirmed: false                     # Safety flag for cleanup action.
kvm_cleanup_remove_instance_disks: false         # Remove declared instance disks, snapshot overlays, and stale seed disks during cleanup.

# -----------------------------------------------------------------------------
# 16. VM INSTANCES (managed scope for provision + cleanup)
# One list entry per VM, in the same shape as the hosts in section 3.
# Cleanup is exact-name scoped to these instance_name values only.
#
# Required keys:
# - instance_name          libvirt domain name
# - image_profile_id       profile from the section 10 catalog
# - hypervisor             destination host name from section 3
# - instance_ipv4_address  static IPv4 for the guest
# - vcpu_count             vCPU allocation
# - memory_mb              memory allocation in MB
#
# Optional keys, each overriding the matching default from sections 4-9:
# - root_disk_size_gb            Example: 40
# - libvirt_network_name         Example: "br0"
# - guest_network_interface      Example: "enp1s0"
# - guest_network_prefix         Example: "24"
# - guest_network_gateway        Example: "192.168.122.1"
# - guest_dns_servers            Example: ["1.1.1.1", "8.8.8.8"]
# - instance_mac_address         Example: "52:54:00:11:22:33"
# - cpu_share_enabled            Example: true   (see section 5)
# - instance_extra_disks_enabled Example: true   (see section 7)
# - instance_extra_disks         Example: see debian-12-a below
#
# The `hypervisor` key decides where the VM is created:
#   hypervisor: "kvm-host-1"   deploy on that host
#   hypervisor: ""             deploy on the first host in section 3
# -----------------------------------------------------------------------------
kvm_instance_definitions:
  - instance_name: "debian-12-a"             # Target libvirt domain name.
    image_profile_id: "debian-12"            # Cloud image profile reference.
    hypervisor: "kvm-host-1"                 # Destination host from section 3.
    instance_ipv4_address: "192.168.122.121" # Instance static IPv4 address.
    vcpu_count: 1                            # vCPU allocation.
    memory_mb: 2048                          # Memory allocation in MB.
    root_disk_size_gb: 20                    # Root disk target size in GiB.
    instance_extra_disks_enabled: true       # Enable additional disk for this instance.
    instance_extra_disks:                    # Attach a dedicated /data disk.
      - guest_device: "vdb"                  # Guest disk device.
        size_gb: 10                          # Disk size in GiB.
        mount_point: "/data"                 # Mount point inside guest.
        filesystem: "ext4"                   # Filesystem for this disk.
        mount_options: "defaults,nofail"     # Mount options written to fstab.

  - instance_name: "debian-12-b"             # Target libvirt domain name.
    image_profile_id: "debian-12"            # Cloud image profile reference.
    hypervisor: "kvm-host-1"                 # Destination host from section 3.
    instance_ipv4_address: "192.168.122.122" # Instance static IPv4 address.
    vcpu_count: 1                            # vCPU allocation.
    memory_mb: 2048                          # Memory allocation in MB.
    root_disk_size_gb: 20                    # Root disk target size in GiB.
    instance_extra_disks_enabled: true       # Enable additional disk for this instance.
    instance_extra_disks:                    # Attach a dedicated /data disk.
      - guest_device: "vdb"                  # Guest disk device.
        size_gb: 10                          # Disk size in GiB.
        mount_point: "/data"                 # Mount point inside guest.
        filesystem: "ext4"                   # Filesystem for this disk.
        mount_options: "defaults,nofail"     # Mount options written to fstab.

  - instance_name: "debian-13-a"             # Target libvirt domain name.
    image_profile_id: "debian-13"            # Cloud image profile reference.
    hypervisor: "kvm-host-1"                 # Destination host from section 3.
    instance_ipv4_address: "192.168.122.131" # Instance static IPv4 address.
    vcpu_count: 1                            # vCPU allocation.
    memory_mb: 2048                          # Memory allocation in MB.
    root_disk_size_gb: 20                    # Root disk target size in GiB.
    instance_extra_disks_enabled: true       # Enable additional disk for this instance.
    instance_extra_disks:                    # Attach a dedicated /data disk.
      - guest_device: "vdb"                  # Guest disk device.
        size_gb: 10                          # Disk size in GiB.
        mount_point: "/data"                 # Mount point inside guest.
        filesystem: "ext4"                   # Filesystem for this disk.
        mount_options: "defaults,nofail"     # Mount options written to fstab.

  - instance_name: "debian-13-b"             # Target libvirt domain name.
    image_profile_id: "debian-13"            # Cloud image profile reference.
    hypervisor: "kvm-host-1"                 # Destination host; set "kvm-host-2" to move it.
    instance_ipv4_address: "192.168.122.132" # Instance static IPv4 address.
    vcpu_count: 1                            # vCPU allocation.
    cpu_share_enabled: true                  # Cap vCPUs: 2 vCPU worth 1 host CPU.
    memory_mb: 2048                          # Memory allocation in MB.
    root_disk_size_gb: 20                    # Root disk target size in GiB.
    instance_extra_disks_enabled: true       # Enable additional disk for this instance.
    instance_extra_disks:                    # Attach a dedicated /data disk.
      - guest_device: "vdb"                  # Guest disk device.
        size_gb: 10                          # Disk size in GiB.
        mount_point: "/data"                 # Mount point inside guest.
        filesystem: "ext4"                   # Filesystem for this disk.
        mount_options: "defaults,nofail"     # Mount options written to fstab.
