---
# =========================================================================
# SHARED: resolve trusted checksums (offline-first, immutable local cache)
# =========================================================================
- name: Validate checksum algorithm and manifest URL per required image
  ansible.builtin.assert:
    that:
      - item.image_checksum_algorithm in ['sha256', 'sha512']
      - item.image_checksum_manifest_url is defined
      - item.image_checksum_manifest_url | length > 0
      - item.image_version is defined
      - (item.image_version | string) | length > 0
    fail_msg: >-
      Invalid checksum metadata for profile {{ item.profile_id }}.
      image_checksum_algorithm must be sha256 or sha512,
      image_checksum_manifest_url must be set, and image_version must be pinned.
  loop: "{{ required_cloud_images }}"
  loop_control:
    label: "{{ item.profile_id }}"

- name: Normalize image and checksum cache paths
  ansible.builtin.set_fact:
    normalized_image_cache_path: "{{ kvm_image_cache_path | regex_replace('/+$', '') }}"
    normalized_checksum_cache_path: "{{ kvm_image_checksum_cache_path | regex_replace('/+$', '') }}"

- name: Ensure checksum cache directory exists
  ansible.builtin.file:
    path: "{{ normalized_checksum_cache_path }}"
    state: directory
    mode: "0700"
  when: kvm_run_mutation_phases | bool

- name: Stat local trusted checksum cache files
  ansible.builtin.stat:
    path: "{{ normalized_checksum_cache_path }}/{{ item.profile_id }}-{{ item.image_version }}.{{ item.image_checksum_algorithm }}"
    get_checksum: false
  loop: "{{ required_cloud_images }}"
  loop_control:
    label: "{{ item.profile_id }}"
  register: checksum_cache_stats
  changed_when: false

- name: Force-refresh local checksum cache when requested
  when:
    - kvm_force_manifest_refresh | default(false) | bool
  block:
    - name: Clear immutable attribute before removal
      ansible.builtin.command: >-
        chattr -i "{{ normalized_checksum_cache_path }}/{{ item.item.profile_id }}-{{ item.item.image_version }}.{{ item.item.image_checksum_algorithm }}"
      loop: "{{ checksum_cache_stats.results }}"
      loop_control:
        label: "{{ item.item.profile_id }}"
      when: item.stat.exists | default(false)
      failed_when: false
      changed_when: false
      check_mode: false
    - name: Remove local trusted checksum cache files
      ansible.builtin.file:
        path: "{{ normalized_checksum_cache_path }}/{{ item.item.profile_id }}-{{ item.item.image_version }}.{{ item.item.image_checksum_algorithm }}"
        state: absent
      loop: "{{ checksum_cache_stats.results }}"
      loop_control:
        label: "{{ item.item.profile_id }}"
      when: item.stat.exists | default(false)

- name: Read local trusted checksum cache files
  ansible.builtin.command: >-
    cat "{{ normalized_checksum_cache_path }}/{{ item.item.profile_id }}-{{ item.item.image_version }}.{{ item.item.image_checksum_algorithm }}"
  loop: "{{ checksum_cache_stats.results }}"
  loop_control:
    label: "{{ item.item.profile_id }}"
  when:
    - item.stat.exists | default(false)
    - not (kvm_force_manifest_refresh | default(false) | bool)
  register: checksum_cache_read_results
  failed_when: false
  changed_when: false
  check_mode: false

- name: Build local trusted checksum map
  ansible.builtin.set_fact:
    local_checksum_by_profile: >-
      {{
        (local_checksum_by_profile | default({}))
        | combine({item.item.item.profile_id: (item.stdout | default('') | regex_replace('\s+$', '') | lower)})
      }}
  loop: "{{ checksum_cache_read_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.profile_id }}"

- name: Select profiles that require a web manifest fetch
  ansible.builtin.set_fact:
    web_fetch_required_profiles: >-
      {{
        (web_fetch_required_profiles | default([]))
        + [item.profile_id]
      }}
  loop: "{{ required_cloud_images }}"
  loop_control:
    label: "{{ item.profile_id }}"
  when:
    - (local_checksum_by_profile[item.profile_id] | default('') | length) == 0
    - (item.image_checksum | default('') | string) | length == 0

- name: Fetch official checksum manifests for required profiles
  ansible.builtin.uri:
    url: "{{ item.image_checksum_manifest_url }}"
    return_content: true
    method: GET
  loop: >-
    {{
      required_cloud_images
      | selectattr('profile_id', 'in', web_fetch_required_profiles | default([]))
      | list
    }}
  loop_control:
    label: "{{ item.profile_id }}"
  register: checksum_manifest_fetch_results
  failed_when: false
  changed_when: false
  when: (web_fetch_required_profiles | default([])) | length > 0

- name: Build web-fetched official checksum map
  ansible.builtin.set_fact:
    web_checksum_by_profile: >-
      {{
        (web_checksum_by_profile | default({}))
        | combine({
            item.item.profile_id: (
              item.content.splitlines()
              | select('search', '\*?' ~ (item.item.image_filename | regex_escape) ~ '$')
              | list
              | first | default('')
              | split | first | default('')
              | lower
            )
          })
      }}
  loop: "{{ checksum_manifest_fetch_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.profile_id }}"

- name: Resolve expected/trusted checksum and cache paths per profile
  ansible.builtin.set_fact:
    required_cloud_images_resolved: >-
      {{
        (required_cloud_images_resolved | default([]))
        + [
          item
          | combine(
              {
                'expected_checksum': expected_checksum,
                'trusted_checksum': trusted_checksum,
                'checksum_source': checksum_source,
                'cached_image_versioned_filename': item.image_filename,
                'cached_image_path': (normalized_image_cache_path ~ '/' ~ item.image_filename),
                'cached_image_alias_path': (normalized_image_cache_path ~ '/' ~ item.image_filename)
              },
              recursive=True
            )
        ]
      }}
  vars:
    local_checksum: "{{ local_checksum_by_profile[item.profile_id] | default('') }}"
    user_checksum: "{{ item.image_checksum | default('') | string }}"
    official_checksum: "{{ web_checksum_by_profile[item.profile_id] | default('') }}"
    expected_checksum: >-
      {{
        (local_checksum if (local_checksum | length > 0)
         else (user_checksum if (user_checksum | length > 0)
               else official_checksum))
      }}
    trusted_checksum: "{{ local_checksum }}"
    checksum_source: >-
      {{
        ('local-cache' if (local_checksum | length > 0)
         else ('user-provided' if (user_checksum | length > 0)
               else 'web-manifest'))
      }}
  loop: "{{ required_cloud_images }}"
  loop_control:
    label: "{{ item.profile_id }}"

- name: Explain checksum resolution source per profile
  ansible.builtin.debug:
    msg: >-
      Profile {{ item.profile_id }}: checksum source={{ item.checksum_source }}
      version={{ item.image_version }}
      (cached file {{ normalized_checksum_cache_path }}/{{ item.profile_id }}-{{ item.image_version }}.{{ item.image_checksum_algorithm }}).
  loop: "{{ required_cloud_images_resolved | default([]) }}"
  loop_control:
    label: "{{ item.profile_id }}"

- name: Fail when expected checksum cannot be resolved (offline and no local/user checksum)
  ansible.builtin.fail:
    msg: >-
      Could not resolve checksum for profile {{ item.profile_id }} ({{ item.image_filename }}).
      No local trusted cache, no operator-provided image_checksum, and the official
      manifest could not be fetched (offline?). Provide image_checksum for this profile,
      or run once with network access to seed the immutable local checksum cache.
  loop: "{{ required_cloud_images_resolved | default([]) }}"
  loop_control:
    label: "{{ item.profile_id }}"
  when:
    - (item.expected_checksum | default('') | length) == 0

- name: Fail when resolved checksum length does not match algorithm
  ansible.builtin.fail:
    msg: >-
      Resolved checksum length mismatch for profile {{ item.profile_id }}.
      Algorithm={{ item.image_checksum_algorithm }} actual_len={{ item.expected_checksum | length }}.
  loop: "{{ required_cloud_images_resolved | default([]) }}"
  loop_control:
    label: "{{ item.profile_id }}"
  when:
    - (item.expected_checksum | default('') | length) > 0
    - (item.expected_checksum | length) != (64 if item.image_checksum_algorithm == 'sha256' else 128)

- name: Build resolved cache path map by image profile
  ansible.builtin.set_fact:
    resolved_cloud_image_path_by_profile: >-
      {{
        (resolved_cloud_image_path_by_profile | default({}))
        | combine({item.profile_id: item.cached_image_path})
      }}
  loop: "{{ required_cloud_images_resolved | default([]) }}"
  loop_control:
    label: "{{ item.profile_id }}"
