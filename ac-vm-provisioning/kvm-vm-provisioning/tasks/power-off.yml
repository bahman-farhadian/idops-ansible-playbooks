---
# =========================================================================
# POWER OFF: clean shutdown for every declared instance in scope.
# Instances that do not exist yet, or are already shut off, are skipped
# and reported, not failed.
# =========================================================================
- name: Validate power instance definition list is provided
  ansible.builtin.assert:
    that:
      - kvm_instance_definitions is defined
      - kvm_instance_definitions | length > 0
    fail_msg: >-
      Add at least one VM in kvm_instance_definitions in your local
      settings file. The list in vars/06-instances.yml is empty on purpose.

- name: Resolve the instance scope for this hypervisor
  ansible.builtin.include_tasks: tasks/resolve-host-scope.yml

- name: Check which declared instances exist
  ansible.builtin.command:
    cmd: virsh dominfo "{{ item.instance_name }}"
  loop: "{{ kvm_host_instance_definitions }}"
  loop_control:
    label: "{{ item.instance_name }}"
  register: poweroff_domain_exists_check
  failed_when: false
  changed_when: false

- name: Report declared instances that do not exist yet
  ansible.builtin.debug:
    msg: "{{ item.item.instance_name }} does not exist yet. Skipped."
  loop: "{{ poweroff_domain_exists_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item.instance_name }}"
  when: (item.rc | int) != 0

- name: Build list of existing declared instances
  ansible.builtin.set_fact:
    poweroff_existing_instances: >-
      {{
        kvm_host_instance_definitions
        | zip(poweroff_domain_exists_check.results | default([]))
        | selectattr('1.rc', 'eq', 0)
        | map(attribute='0')
        | list
      }}

- name: Check current domain state
  ansible.builtin.command:
    cmd: virsh domstate "{{ item.instance_name }}"
  loop: "{{ poweroff_existing_instances }}"
  loop_control:
    label: "{{ item.instance_name }}"
  register: poweroff_domain_state_results
  changed_when: false
  when: (poweroff_existing_instances | length) > 0

- name: Build list of running instances to shut down
  ansible.builtin.set_fact:
    poweroff_targets: >-
      {{
        poweroff_existing_instances
        | zip(poweroff_domain_state_results.results | default([]))
        | selectattr('1.stdout', 'defined')
        | selectattr('1.stdout', 'equalto', 'running')
        | map(attribute='0')
        | list
      }}
  when: (poweroff_existing_instances | length) > 0

- name: Report instances already shut off
  ansible.builtin.debug:
    msg: >-
      {{
        poweroff_existing_instances | map(attribute='instance_name') | list
        | difference(poweroff_targets | default([]) | map(attribute='instance_name') | list)
      }} already shut off (or not running). Skipped.
  when: (poweroff_existing_instances | length) > 0

- name: Explain power-off skip in check mode
  ansible.builtin.debug:
    msg: Check mode is active. No domain will be shut down.
  when:
    - ansible_check_mode
    - (poweroff_targets | default([])) | length > 0

- name: Request clean shutdown
  ansible.builtin.command:
    argv:
      - virsh
      - shutdown
      - "{{ item.instance_name }}"
  loop: "{{ poweroff_targets | default([]) }}"
  loop_control:
    label: "{{ item.instance_name }}"
  changed_when: true
  when: not ansible_check_mode

- name: Wait for clean shutdown
  ansible.builtin.command:
    argv:
      - virsh
      - domstate
      - "{{ item.instance_name }}"
  loop: "{{ poweroff_targets | default([]) }}"
  loop_control:
    label: "{{ item.instance_name }}"
  register: poweroff_wait_state
  until: (poweroff_wait_state.stdout | trim) == 'shut off'
  retries: "{{ kvm_shutdown_wait_retries | default(30) | int }}"
  delay: "{{ kvm_shutdown_wait_delay_seconds | default(2) | int }}"
  changed_when: false
  when: not ansible_check_mode

- name: Power-off complete summary
  ansible.builtin.debug:
    msg: >-
      Shut down {{ poweroff_targets | default([]) | length }} instance(s):
      {{ poweroff_targets | default([]) | map(attribute='instance_name') | list }}
  when: not ansible_check_mode
