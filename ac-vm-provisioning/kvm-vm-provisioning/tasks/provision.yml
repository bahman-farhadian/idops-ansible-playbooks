---
# =========================================================================
# PROVISION ORCHESTRATOR: cloud-image workflow
# Stages: full | preflight | image-cache | provision | runtime
# =========================================================================
- name: Validate provision stage value
  ansible.builtin.assert:
    that:
      - (kvm_provision_stage | default('full')) in ['full', 'preflight', 'image-cache', 'provision', 'runtime']
    fail_msg: "kvm_provision_stage must be one of: full, preflight, image-cache, provision, runtime."

- name: Validate instance definition list is provided
  ansible.builtin.assert:
    that:
      - kvm_instance_definitions is defined
      - kvm_instance_definitions | length > 0
    fail_msg: "Define at least one instance in vars/06-instances.yml under kvm_instance_definitions."

- name: Resolve the instance scope for this hypervisor
  ansible.builtin.include_tasks: tasks/resolve-host-scope.yml

- name: Validate cloud image catalog is provided
  ansible.builtin.assert:
    that:
      - kvm_cloud_image_catalog is defined
      - kvm_cloud_image_catalog is mapping
      - kvm_cloud_image_catalog | length > 0
    fail_msg: "Define at least one image profile in vars/04-images.yml under kvm_cloud_image_catalog."

- name: Assert every image profile pins image_version
  ansible.builtin.assert:
    that:
      - kvm_cloud_image_catalog[item.key].image_version is defined
      - (kvm_cloud_image_catalog[item.key].image_version | default('') | string) | length > 0
    fail_msg: >-
      Profile {{ item.key }} must set image_version (pin a Debian build token,
      e.g. 20260706-2531). The workflow no longer follows 'latest'.
  loop: "{{ kvm_cloud_image_catalog | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Expand cloud image catalog URLs from version pin
  ansible.builtin.set_fact:
    expanded_cloud_image_catalog: >-
      {{
        (expanded_cloud_image_catalog | default({}))
        | combine({
            item.key: (item.value | combine({
              'image_filename': (
                'debian-' ~ item.value.image_major ~ '-' ~ item.value.image_variant
                ~ '-amd64-' ~ item.value.image_version ~ '.qcow2'
              ),
              'image_url': (
                'https://cloud.debian.org/images/cloud/' ~ item.value.image_codename
                ~ '/' ~ item.value.image_version ~ '/debian-' ~ item.value.image_major
                ~ '-' ~ item.value.image_variant ~ '-amd64-' ~ item.value.image_version
                ~ '.qcow2'
              ),
              'image_checksum_manifest_url': (
                'https://cloud.debian.org/images/cloud/' ~ item.value.image_codename
                ~ '/' ~ item.value.image_version ~ '/SHA512SUMS'
              )
            }, recursive=True))
          })
      }}
  loop: "{{ kvm_cloud_image_catalog | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Fail when deprecated clone template variables are still used
  ansible.builtin.fail:
    msg: >-
      Deprecated clone-template variables were detected. This project now uses cloud-image provisioning.
      Remove kvm_template_catalog/template_instance_* settings and use kvm_cloud_image_catalog + image_profile_id.
  when: kvm_template_catalog is defined

- name: Determine whether mutation phases are allowed
  ansible.builtin.set_fact:
    kvm_run_mutation_phases: >-
      {{
        (not ansible_check_mode)
        or (kvm_execute_mutation_phases_in_check_mode | default(false) | bool)
      }}

- name: Explain check-mode mutation behavior
  ansible.builtin.debug:
    msg: >-
      Check mode is active and mutation phases are disabled
      (kvm_execute_mutation_phases_in_check_mode=false).
      Mutating stages are evaluated but will not create/download/start resources.
  when:
    - ansible_check_mode
    - not (kvm_run_mutation_phases | bool)

- name: Build stage execution flags
  ansible.builtin.set_fact:
    kvm_selected_stage: "{{ kvm_provision_stage | default('full') }}"
    kvm_run_stage_preflight: "{{ (kvm_provision_stage | default('full')) in ['full', 'preflight'] }}"
    kvm_run_stage_image_cache: "{{ (kvm_provision_stage | default('full')) in ['full', 'image-cache'] }}"
    kvm_run_stage_provision: "{{ (kvm_provision_stage | default('full')) in ['full', 'provision'] }}"
    kvm_run_stage_runtime: "{{ (kvm_provision_stage | default('full')) in ['full', 'runtime'] }}"

- name: Validate performance and manifest policy settings
  ansible.builtin.assert:
    that:
      - (kvm_parallel_instance_workers | default(4) | int) > 0
      - (kvm_image_manifest_refresh_policy | default('on-demand')) in ['on-demand', 'always']
      - (kvm_default_cloud_init_networkd_wait_online_timeout_seconds | default(30) | int) > 0
      - (kvm_qemu_guest_agent_wait_timeout_seconds | int) > 0
      - (kvm_qemu_guest_agent_poll_interval_seconds | int) > 0
      - (kvm_shutdown_wait_retries | int) > 0
      - (kvm_shutdown_wait_delay_seconds | int) > 0
      - kvm_snapshot_enabled | bool
      - kvm_wait_for_cloud_init_before_snapshot | bool
    fail_msg: >-
      Invalid performance or manifest policy setting.
      Ensure kvm_parallel_instance_workers > 0,
      kvm_image_manifest_refresh_policy is on-demand|always,
      readiness and shutdown retry values are > 0, and mandatory snapshot and
      cloud-init readiness policies remain enabled.

- name: Validate CPU share policy settings
  ansible.builtin.assert:
    that:
      - (kvm_cpu_share_vcpu_per_host_cpu | int) >= 1
      - (kvm_cpu_share_period_microseconds | int) >= 1000
      - (kvm_cpu_share_period_microseconds | int) <= 1000000
      - (kvm_cpu_share_host_cpu_reserve | int) >= 0
      - kvm_default_cpu_share_enabled is boolean
      - kvm_cpu_share_validate_host_capacity is boolean
      - kvm_cpu_share_allow_capacity_overcommit is boolean
      - kvm_cpu_share_apply_to_running_domains is boolean
    fail_msg: >-
      Invalid CPU share policy. kvm_cpu_share_vcpu_per_host_cpu must be >= 1,
      kvm_cpu_share_period_microseconds must be within the libvirt range
      1000-1000000, kvm_cpu_share_host_cpu_reserve must be >= 0, and the
      CPU share boolean switches must be true or false.

# quota is per vCPU: each vCPU may burn quota out of every period, so a ratio of
# 2 gives every vCPU half a host CPU and makes 2 vCPUs worth exactly 1 host CPU.
- name: Build CPU share enforcement model
  ansible.builtin.set_fact:
    kvm_cpu_share_quota_microseconds: >-
      {{
        (
          (kvm_cpu_share_period_microseconds | int)
          // (kvm_cpu_share_vcpu_per_host_cpu | int)
        ) | int
      }}

- name: Validate derived CPU share quota is within libvirt bounds
  ansible.builtin.assert:
    that:
      - (kvm_cpu_share_quota_microseconds | int) >= 1000
      - (kvm_cpu_share_quota_microseconds | int) <= 17592186044415
    fail_msg: >-
      Derived CPU share quota {{ kvm_cpu_share_quota_microseconds }}us is outside
      the libvirt vcpu_quota range 1000-17592186044415.
      quota = kvm_cpu_share_period_microseconds / kvm_cpu_share_vcpu_per_host_cpu
      ({{ kvm_cpu_share_period_microseconds }} / {{ kvm_cpu_share_vcpu_per_host_cpu }}).
      Raise kvm_cpu_share_period_microseconds or lower
      kvm_cpu_share_vcpu_per_host_cpu.

- name: Validate instance image profile references
  ansible.builtin.assert:
    that:
      - item.image_profile_id is defined
      - item.image_profile_id in kvm_cloud_image_catalog
    fail_msg: >-
      Instance {{ item.instance_name | default('unknown') }} references undefined image_profile_id
      '{{ item.image_profile_id | default('missing') }}'. Valid profile ids:
      {{ kvm_cloud_image_catalog.keys() | list | join(', ') }}.
  loop: "{{ kvm_host_instance_definitions }}"
  loop_control:
    label: "{{ item.instance_name | default('unknown') }}"

- name: Set per-instance defaults
  ansible.builtin.set_fact:
    instance_defaults:
      instance_disk_extension: "{{ kvm_default_instance_disk_extension }}"
      root_disk_size_gb: "{{ kvm_default_root_disk_size_gb }}"
      firmware_boot_mode: "uefi"
      virt_install_machine_type: "q35"
      seed_device_bus: "scsi"
      guest_network_interface: "{{ kvm_default_guest_network_interface }}"
      guest_network_prefix: "{{ kvm_default_guest_network_prefix }}"
      guest_network_gateway: "{{ kvm_default_guest_network_gateway }}"
      guest_dns_servers: "{{ kvm_default_guest_dns_servers }}"
      libvirt_network_name: "{{ kvm_default_libvirt_network_name }}"
      ssh_port: 22
      cloud_init_user: "{{ kvm_default_cloud_init_user }}"
      cloud_init_ssh_public_keys: "{{ kvm_default_cloud_init_ssh_public_keys }}"
      cloud_init_plain_password: "{{ kvm_default_cloud_init_plain_password }}"
      cloud_init_root_plain_password: "{{ kvm_default_cloud_init_root_plain_password | default('') }}"
      cloud_init_root_ssh_public_keys: "{{ kvm_default_cloud_init_root_ssh_public_keys | default([]) }}"
      cloud_init_user_sudo_rule: "{{ kvm_default_cloud_init_user_sudo_rule | default('ALL=(ALL) ALL') }}"
      cloud_init_ssh_password_auth: "{{ kvm_default_cloud_init_ssh_password_auth }}"
      cloud_init_disable_root: "{{ kvm_default_cloud_init_disable_root }}"
      cloud_init_manage_etc_hosts: "{{ kvm_default_cloud_init_manage_etc_hosts }}"
      cloud_init_timezone: "{{ kvm_default_cloud_init_timezone }}"
      cloud_init_locale: "{{ kvm_default_cloud_init_locale }}"
      cloud_init_package_update: "{{ kvm_default_cloud_init_package_update }}"
      cloud_init_package_upgrade: "{{ kvm_default_cloud_init_package_upgrade }}"
      cloud_init_package_reboot_if_required: "{{ kvm_default_cloud_init_package_reboot_if_required }}"
      cloud_init_apt_config: "{{ kvm_default_cloud_init_apt_config }}"
      cloud_init_packages: "{{ kvm_default_cloud_init_packages }}"
      cloud_init_bootcmd: "{{ kvm_default_cloud_init_bootcmd }}"
      cloud_init_runcmd: "{{ kvm_default_cloud_init_runcmd }}"
      cloud_init_write_files: "{{ kvm_default_cloud_init_write_files }}"
      cloud_init_tune_networkd_wait_online: "{{ kvm_default_cloud_init_tune_networkd_wait_online | default(true) }}"
      cloud_init_networkd_wait_online_timeout_seconds: "{{ kvm_default_cloud_init_networkd_wait_online_timeout_seconds | default(30) }}"
      cloud_init_final_message: "{{ kvm_default_cloud_init_final_message }}"
      force_single_socket_vcpu_topology: "{{ kvm_force_single_socket_vcpu_topology | default(true) }}"
      cpu_share_enabled: "{{ kvm_default_cpu_share_enabled | default(false) }}"
      instance_extra_disks_enabled: "{{ kvm_default_instance_extra_disks_enabled | default(false) }}"
      instance_extra_disks: "{{ kvm_default_instance_extra_disks | default([]) }}"

- name: Build normalized instance definitions
  ansible.builtin.set_fact:
    normalized_instances: >-
      {{
        (normalized_instances | default([]))
        + [
          instance_defaults
          | combine(expanded_cloud_image_catalog[item.image_profile_id], recursive=True)
          | combine(item, recursive=True)
          | combine({
              'cloud_init_packages': (
                (
                  kvm_default_cloud_init_packages
                  + (item.cloud_init_packages | default([]))
                  + ['openssh-server', 'qemu-guest-agent']
                ) | unique
              )
            })
        ]
      }}
  loop: "{{ kvm_host_instance_definitions }}"
  loop_control:
    label: "{{ item.instance_name }}"

- name: Validate normalized instance fields
  ansible.builtin.assert:
    that:
      - item.instance_name is defined
      - item.instance_name | length > 0
      - item.instance_name is match('^[A-Za-z0-9][A-Za-z0-9-]{0,62}$')
      - item.image_profile_id is defined
      - item.image_url is defined
      - item.image_url | length > 0
      - item.image_filename is defined
      - item.image_filename | length > 0
      - item.image_filename is match('^debian-.+\\.qcow2$')
      - item.image_url is search('/debian-.+\\.qcow2$')
      - item.image_checksum_algorithm is defined
      - item.image_checksum_algorithm in ['sha256', 'sha512']
      - item.virt_install_os_variant is defined
      - item.virt_install_os_variant | length > 0
      - item.virt_install_os_variant is match('^debian')
      - item.instance_ipv4_address is defined
      - item.vcpu_count is defined
      - (item.vcpu_count | int) > 0
      - item.memory_mb is defined
      - (item.memory_mb | int) > 0
      - item.root_disk_size_gb is defined
      - (item.root_disk_size_gb | int) > 0
      - item.instance_disk_extension is match('^[A-Za-z0-9]+$')
      - (item.firmware_boot_mode | default('uefi') | lower) == 'uefi'
      - item.virt_install_machine_type is string
      - item.virt_install_machine_type | length > 0
      - item.seed_device_bus is defined
      - (item.seed_device_bus | lower) in ['sata', 'ide', 'scsi', 'virtio']
      - item.libvirt_network_name is defined
      - item.libvirt_network_name | length > 0
      - item.cloud_init_user is defined
      - item.cloud_init_user | length > 0
      - item.cloud_init_user_sudo_rule is string
      - item.cloud_init_user_sudo_rule | length > 0
      - item.cloud_init_root_plain_password is string
      - item.cloud_init_root_ssh_public_keys is sequence
      - item.cloud_init_root_ssh_public_keys is not string
      - item.cloud_init_manage_etc_hosts is boolean
      - item.cloud_init_timezone is string
      - item.cloud_init_timezone | length > 0
      - item.cloud_init_locale is string
      - item.cloud_init_locale | length > 0
      - item.cloud_init_ssh_public_keys is sequence
      - item.cloud_init_ssh_public_keys is not string
      - item.cloud_init_package_update is boolean
      - item.cloud_init_package_upgrade is boolean
      - item.cloud_init_package_reboot_if_required is boolean
      - item.cloud_init_apt_config is mapping
      - item.cloud_init_packages is sequence
      - item.cloud_init_packages is not string
      - item.cloud_init_bootcmd is sequence
      - item.cloud_init_bootcmd is not string
      - item.cloud_init_runcmd is sequence
      - item.cloud_init_runcmd is not string
      - item.cloud_init_write_files is sequence
      - item.cloud_init_write_files is not string
      - item.cloud_init_final_message is string
      - item.force_single_socket_vcpu_topology is boolean
      - item.cpu_share_enabled is boolean
      - item.instance_extra_disks_enabled is boolean
      - item.instance_extra_disks is sequence
      - item.instance_extra_disks is not string
      - (item.instance_extra_disks | length == 0) or (item.instance_extra_disks_enabled | bool)
      - (item.cloud_init_plain_password | length > 0) or not (item.cloud_init_ssh_password_auth | bool)
      - >-
        (
          item.instance_mac_address is not defined
        )
        or
        (
          item.instance_mac_address is match('^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$')
        )
    fail_msg: >-
      Instance {{ item.instance_name | default('unknown') }} has invalid or missing required fields.
      This project requires firmware_boot_mode=uefi.
  loop: "{{ normalized_instances }}"
  loop_control:
    label: "{{ item.instance_name }}"

- name: Validate instance names are unique
  ansible.builtin.assert:
    that:
      - normalized_instances | map(attribute='instance_name') | list | length
        ==
        normalized_instances | map(attribute='instance_name') | list | unique | length
    fail_msg: "Instance names must be unique in kvm_instance_definitions."

- name: Validate additional disk schema per instance
  ansible.builtin.assert:
    that:
      - disk_spec.guest_device is defined
      - disk_spec.guest_device is match('^vd[b-z]$')
      - disk_spec.mount_point is defined
      - disk_spec.mount_point is match('^/[A-Za-z0-9._/-]*$')
      - disk_spec.mount_point not in ['/', '/boot', '/boot/efi']
      - (disk_spec.mount_point != '/var') or (kvm_allow_mount_var_on_extra_disk | default(false) | bool)
      - disk_spec.size_gb is defined
      - (disk_spec.size_gb | int) > 0
      - (disk_spec.filesystem | default('ext4')) in ['ext4', 'xfs']
      - (disk_spec.mount_options | default('defaults,nofail')) is string
      - (disk_spec.disk_extension | default(item.0.instance_disk_extension)) is match('^[A-Za-z0-9]+$')
    fail_msg: >-
      Invalid additional disk definition for instance {{ item.0.instance_name }}:
      guest_device must be vd[b-z], mount_point must be an absolute path
      (not /, /boot, /boot/efi), and size_gb must be > 0.
      /var is blocked by default on fresh extra disks because it can break boot.
      Set kvm_allow_mount_var_on_extra_disk=true only if you intentionally
      handle /var data migration in your image pipeline.
  vars:
    disk_spec: "{{ item.1 }}"
  loop_control:
    label: "{{ item.0.instance_name }}:{{ item.1.guest_device | default('missing-device') }}"
  loop: "{{ normalized_instances | subelements('instance_extra_disks', skip_missing=True) }}"
  when:
    - item.0.instance_extra_disks_enabled | bool

- name: Validate additional disk uniqueness per instance
  ansible.builtin.assert:
    that:
      - item.instance_extra_disks | map(attribute='guest_device') | list | length
        ==
        item.instance_extra_disks | map(attribute='guest_device') | list | unique | length
      - item.instance_extra_disks | map(attribute='mount_point') | list | length
        ==
        item.instance_extra_disks | map(attribute='mount_point') | list | unique | length
    fail_msg: >-
      Instance {{ item.instance_name }} has duplicate additional disk guest_device or mount_point values.
  loop: "{{ normalized_instances }}"
  loop_control:
    label: "{{ item.instance_name }}"
  when:
    - item.instance_extra_disks_enabled | bool
    - (item.instance_extra_disks | length) > 0

- name: Build unique image profile list from requested instances
  ansible.builtin.set_fact:
    requested_instance_image_profiles: "{{ normalized_instances | map(attribute='image_profile_id') | unique | list }}"

- name: Build unique image profile list from cloud image catalog
  ansible.builtin.set_fact:
    catalog_image_profiles: "{{ kvm_cloud_image_catalog | dict2items | map(attribute='key') | unique | list }}"

- name: Build effective required image profile list
  ansible.builtin.set_fact:
    required_image_profiles: >-
      {{
        (
          requested_instance_image_profiles
          + ((kvm_run_stage_image_cache | bool) | ternary(catalog_image_profiles, []))
        )
        | unique
        | list
      }}

- name: Build required cloud image metadata list
  ansible.builtin.set_fact:
    required_cloud_images: >-
      {{
        (required_cloud_images | default([]))
        + [
          {
            'profile_id': item,
            'image_url': expanded_cloud_image_catalog[item].image_url,
            'image_filename': expanded_cloud_image_catalog[item].image_filename,
            'image_checksum_manifest_url': expanded_cloud_image_catalog[item].image_checksum_manifest_url,
            'image_checksum_algorithm': (
              expanded_cloud_image_catalog[item].image_checksum_algorithm
              | default('sha512')
            ),
            'image_version': expanded_cloud_image_catalog[item].image_version,
            'image_checksum': (
              expanded_cloud_image_catalog[item].image_checksum
              | default('')
            )
          }
        ]
      }}
  loop: "{{ required_image_profiles }}"
  loop_control:
    label: "{{ item }}"

- name: Build list of profiles using nocloud image artifacts
  ansible.builtin.set_fact:
    nocloud_image_profiles: >-
      {{
        required_cloud_images
        | selectattr('image_filename', 'search', 'nocloud')
        | map(attribute='profile_id')
        | list
      }}

- name: Fail fast when nocloud images are used for cloud-init workflow
  ansible.builtin.fail:
    msg: >-
      Profile(s) configured with nocloud images: {{
      nocloud_image_profiles | join(', ')
      }}.
      This project requires images that include cloud-init and are tested with
      Debian generic artifacts.
      Switch image_variant to 'generic' or 'genericcloud', then run:
      make image-cache && make cleanup-force-disks && make provision.
      Override only if intentional by setting kvm_allow_nocloud_images=true.
  when:
    - (nocloud_image_profiles | default([])) | length > 0
    - not (kvm_allow_nocloud_images | default(false) | bool)

- name: Resolve trusted image checksums (offline-first, immutable cache)
  ansible.builtin.include_tasks: tasks/provision-resolve-checksum-cache.yml
  when:
    - kvm_run_stage_image_cache | bool or kvm_run_stage_provision | bool

- name: Check which requested instances already exist
  ansible.builtin.command:
    cmd: virsh dominfo "{{ item.instance_name }}"
  loop: "{{ normalized_instances }}"
  loop_control:
    label: "{{ item.instance_name }}"
  register: instance_exists_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Build list of instances to create
  ansible.builtin.set_fact:
    instances_to_create: >-
      {{
        normalized_instances
        | zip(instance_exists_check.results)
        | selectattr('1.rc', 'ne', 0)
        | map(attribute='0')
        | list
      }}

- name: Initialize sanitized runtime target list
  ansible.builtin.set_fact:
    instance_runtime_targets: []

- name: Build sanitized runtime target list
  ansible.builtin.set_fact:
    instance_runtime_targets: >-
      {{
        instance_runtime_targets
        + [
            {
              'instance_name': item.instance_name,
              'instance_disk_extension': item.instance_disk_extension,
              'instance_extra_disks_enabled': item.instance_extra_disks_enabled,
              'instance_extra_disks': item.instance_extra_disks,
              'ssh_port': item.ssh_port
            }
          ]
      }}
  loop: "{{ normalized_instances }}"
  loop_control:
    label: "{{ item.instance_name }}"
  no_log: true
  when:
    - >-
      (kvm_ensure_requested_instances_running | default(true) | bool)
      or
      item.instance_name in (instances_to_create | map(attribute='instance_name') | list)

- name: Display stage and target summary
  ansible.builtin.debug:
    msg: >-
      Stage={{ kvm_selected_stage }} | requested={{ normalized_instances | length }} |
      create={{ instances_to_create | length }} |
      runtime_targets={{ instance_runtime_targets | length }} |
      mutation={{ kvm_run_mutation_phases | bool }}

- name: Run preflight stage
  ansible.builtin.include_tasks: tasks/provision-preflight.yml
  when: kvm_run_stage_preflight | bool

- name: Run image-cache stage
  ansible.builtin.include_tasks: tasks/provision-image-cache.yml
  when: kvm_run_stage_image_cache | bool

- name: Run instance provisioning stage
  ansible.builtin.include_tasks: tasks/provision-instances.yml
  when: kvm_run_stage_provision | bool

- name: Reconcile CPU share on declared domains
  ansible.builtin.include_tasks: tasks/provision-cpu-share.yml
  when: kvm_run_stage_provision | bool or kvm_run_stage_runtime | bool

- name: Run runtime stage
  ansible.builtin.include_tasks: tasks/provision-runtime.yml
  when: kvm_run_stage_runtime | bool
