---
# =========================================================================
# STAGE: runtime (observed-state reconciliation + mandatory baseline snapshot)
# =========================================================================
- name: Explain runtime stage skip in check mode
  ansible.builtin.debug:
    msg: >-
      Runtime stage is skipped because mutation phases are disabled in check mode.
      Run make provision for start, readiness, seed cleanup, and snapshot actions.
  when: not (kvm_run_mutation_phases | bool)

- name: Check declared domain states
  ansible.builtin.command:
    argv:
      - virsh
      - domstate
      - "{{ item.instance_name }}"
  loop: "{{ instance_runtime_targets }}"
  loop_control:
    label: "{{ item.instance_name }}"
  register: runtime_domain_state_results
  changed_when: false
  failed_when: false
  when:
    - kvm_run_mutation_phases | bool
    - instance_runtime_targets | length > 0

- name: Fail when a declared runtime domain is missing
  ansible.builtin.assert:
    that:
      - (item.rc | int) == 0
    fail_msg: >-
      Declared domain {{ item.item.instance_name }} does not exist in
      {{ kvm_effective_libvirt_uri }}. Run the full provision workflow first.
  loop: "{{ runtime_domain_state_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.instance_name }}"
  when:
    - kvm_run_mutation_phases | bool

- name: Build current running-domain name list
  ansible.builtin.set_fact:
    runtime_running_domain_names: >-
      {{
        runtime_domain_state_results.results
        | default([])
        | selectattr('stdout', 'equalto', 'running')
        | map(attribute='item.instance_name')
        | list
      }}
  when: kvm_run_mutation_phases | bool

- name: Inspect mandatory QEMU Guest Agent channels
  ansible.builtin.command:
    argv:
      - virsh
      - dumpxml
      - "{{ item.instance_name }}"
      - --inactive
  loop: "{{ instance_runtime_targets }}"
  loop_control:
    label: "{{ item.instance_name }}"
  register: runtime_guest_agent_channel_results
  changed_when: false
  when: kvm_run_mutation_phases | bool

- name: Fail before boot wait when a guest-agent channel is missing
  ansible.builtin.assert:
    that:
      - "'org.qemu.guest_agent.0' in item.stdout"
      - >-
        "target type='virtio'" in item.stdout
        or
        'target type="virtio"' in item.stdout
    fail_msg: >-
      Domain {{ item.item.instance_name }} does not contain the mandatory
      org.qemu.guest_agent.0 virtio channel. Refusing a guaranteed timeout.
      Rebuild this declared test domain with make cleanup-force-disks followed
      by make provision so the corrected domain XML and cloud-init run from first boot.
  loop: "{{ runtime_guest_agent_channel_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.instance_name }}"
  when: kvm_run_mutation_phases | bool

- name: Resolve persistent root-disk sources
  ansible.builtin.shell: |
    set -euo pipefail
    virsh domblklist "{{ item.instance_name }}" --inactive --details \
      | awk '$3 == "vda" {print $4}'
  args:
    executable: /bin/bash
  loop: "{{ instance_runtime_targets }}"
  loop_control:
    label: "{{ item.instance_name }}:vda"
  register: runtime_root_disk_source_results
  changed_when: false
  when: kvm_run_mutation_phases | bool

- name: Validate persistent root-disk sources
  ansible.builtin.assert:
    that:
      - (item.stdout_lines | default([]) | length) == 1
      - >-
        (item.stdout | trim) in [
          kvm_instance_disk_pool_path
          ~ '/'
          ~ item.item.instance_name
          ~ '-vda.'
          ~ item.item.instance_disk_extension,
          kvm_snapshot_overlay_path
          ~ '/'
          ~ item.item.instance_name
          ~ '-'
          ~ kvm_snapshot_name
          ~ '-vda.qcow2'
        ]
    fail_msg: >-
      Domain {{ item.item.instance_name }} has an unexpected persistent vda
      source: {{ item.stdout | default('missing') }}. Refusing to mutate a
      drifted or ambiguously named root-disk chain. Root disks must use
      <instance>-vda.<format>. Rebuild declared legacy domains with
      make cleanup-force-disks followed by make provision.
  loop: "{{ runtime_root_disk_source_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.instance_name }}:vda"
  when: kvm_run_mutation_phases | bool

- name: Resolve persistent declared additional-disk sources
  ansible.builtin.shell: |
    set -euo pipefail
    virsh domblklist "{{ item.0.instance_name }}" --inactive --details \
      | awk -v target="{{ item.1.guest_device }}" '$3 == target {print $4}'
  args:
    executable: /bin/bash
  loop: >-
    {{
      instance_runtime_targets
      | subelements('instance_extra_disks', skip_missing=True)
    }}
  loop_control:
    label: "{{ item.0.instance_name }}:{{ item.1.guest_device }}"
  register: runtime_extra_disk_source_results
  changed_when: false
  when:
    - kvm_run_mutation_phases | bool
    - item.0.instance_extra_disks_enabled | bool

- name: Fail when an attached additional disk uses an unexpected source
  ansible.builtin.assert:
    that:
      - >-
        (item.stdout | trim | length == 0)
        or
        (
          (item.stdout | trim)
          ==
          (
            kvm_instance_disk_pool_path
            ~ '/'
            ~ item.item.0.instance_name
            ~ '-'
            ~ item.item.1.guest_device
            ~ '.'
            ~ (item.item.1.disk_extension | default(item.item.0.instance_disk_extension))
          )
        )
        or
        (
          (item.stdout | trim)
          ==
          (
            kvm_snapshot_overlay_path
            ~ '/'
            ~ item.item.0.instance_name
            ~ '-'
            ~ kvm_snapshot_name
            ~ '-'
            ~ item.item.1.guest_device
            ~ '.qcow2'
          )
        )
    fail_msg: >-
      Domain {{ item.item.0.instance_name }} has an unexpected source for
      {{ item.item.1.guest_device }}: {{ item.stdout }}. Refusing disk drift.
  loop: "{{ runtime_extra_disk_source_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.0.instance_name }}:{{ item.item.1.guest_device }}"
  when: kvm_run_mutation_phases | bool

- name: Fail when a running domain is missing a declared additional disk
  ansible.builtin.assert:
    that:
      - item.item.0.instance_name not in (runtime_running_domain_names | default([]))
    fail_msg: >-
      Running domain {{ item.item.0.instance_name }} is missing declared disk
      {{ item.item.1.guest_device }}. Shut it down and rerun provisioning so the
      disk can be attached before cloud-init continues.
  loop: "{{ runtime_extra_disk_source_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.0.instance_name }}:{{ item.item.1.guest_device }}"
  when:
    - kvm_run_mutation_phases | bool
    - (item.stdout | trim | length) == 0

- name: Attach missing declared additional disks to shut-off domains
  ansible.builtin.command:
    argv:
      - virsh
      - attach-disk
      - "{{ item.item.0.instance_name }}"
      - >-
        {{
          kvm_instance_disk_pool_path
          ~ '/'
          ~ item.item.0.instance_name
          ~ '-'
          ~ item.item.1.guest_device
          ~ '.'
          ~ (item.item.1.disk_extension | default(item.item.0.instance_disk_extension))
        }}
      - "{{ item.item.1.guest_device }}"
      - --targetbus
      - virtio
      - --subdriver
      - "{{ item.item.1.disk_extension | default(item.item.0.instance_disk_extension) }}"
      - --type
      - disk
      - --config
  loop: "{{ runtime_extra_disk_source_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.0.instance_name }}:{{ item.item.1.guest_device }}"
  changed_when: true
  when:
    - kvm_run_mutation_phases | bool
    - (item.stdout | trim | length) == 0

- name: Build list of declared domains requiring start
  ansible.builtin.set_fact:
    runtime_domains_to_start: >-
      {{
        runtime_domain_state_results.results
        | default([])
        | rejectattr('stdout', 'equalto', 'running')
        | map(attribute='item')
        | list
      }}
  when: kvm_run_mutation_phases | bool

- name: Start declared domains that are not running
  ansible.builtin.command:
    argv:
      - virsh
      - start
      - "{{ item.instance_name }}"
  loop: "{{ runtime_domains_to_start | default([]) }}"
  loop_control:
    label: "{{ item.instance_name }}"
  changed_when: true
  when:
    - kvm_run_mutation_phases | bool
    - (runtime_domains_to_start | default([])) | length > 0

- name: Wait until started domains report running
  ansible.builtin.command:
    argv:
      - virsh
      - domstate
      - "{{ item.instance_name }}"
  loop: "{{ runtime_domains_to_start | default([]) }}"
  loop_control:
    label: "{{ item.instance_name }}"
  register: runtime_started_domain_state
  until: (runtime_started_domain_state.stdout | trim) == 'running'
  retries: 18
  delay: 5
  changed_when: false
  when:
    - kvm_run_mutation_phases | bool
    - (runtime_domains_to_start | default([])) | length > 0

- name: Inspect mandatory snapshot metadata on declared domains
  ansible.builtin.command:
    argv:
      - virsh
      - snapshot-list
      - "{{ item.instance_name }}"
      - --name
  loop: "{{ instance_runtime_targets }}"
  loop_control:
    label: "{{ item.instance_name }}"
  register: runtime_snapshot_list_results
  changed_when: false
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool

- name: Initialize snapshot reconciliation target lists
  ansible.builtin.set_fact:
    runtime_domains_with_snapshot: []
    runtime_domains_requiring_snapshot: []
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool

- name: Classify declared domains by snapshot state
  ansible.builtin.set_fact:
    runtime_domains_with_snapshot: >-
      {{
        runtime_domains_with_snapshot
        + ([item.item] if kvm_snapshot_name in (item.stdout_lines | default([])) else [])
      }}
    runtime_domains_requiring_snapshot: >-
      {{
        runtime_domains_requiring_snapshot
        + ([item.item] if kvm_snapshot_name not in (item.stdout_lines | default([])) else [])
      }}
  loop: "{{ runtime_snapshot_list_results.results | default([]) }}"
  loop_control:
    label: >-
      {{
        item.item.instance_name
        ~ ': '
        ~ ('complete' if kvm_snapshot_name in (item.stdout_lines | default([])) else 'resume required')
      }}
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool

- name: Report observed snapshot reconciliation state
  ansible.builtin.debug:
    msg: >-
      snapshot_complete={{ runtime_domains_with_snapshot | map(attribute='instance_name') | list }}
      snapshot_resume={{ runtime_domains_requiring_snapshot | map(attribute='instance_name') | list }}
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool

- name: Inspect active disk chains for domains with snapshot metadata
  ansible.builtin.command:
    argv:
      - virsh
      - domblklist
      - "{{ item.instance_name }}"
      - --details
  loop: "{{ runtime_domains_with_snapshot | default([]) }}"
  loop_control:
    label: "{{ item.instance_name }}"
  register: runtime_snapshotted_disk_chain_results
  changed_when: false
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool
    - (runtime_domains_with_snapshot | default([])) | length > 0

- name: Fail when snapshot metadata and active root overlay disagree
  ansible.builtin.assert:
    that:
      - >-
        (
          kvm_snapshot_overlay_path
          ~ '/'
          ~ item.item.instance_name
          ~ '-'
          ~ kvm_snapshot_name
          ~ '-vda.qcow2'
        ) in item.stdout
    fail_msg: >-
      Domain {{ item.item.instance_name }} has {{ kvm_snapshot_name }} metadata,
      but its active vda is not the expected external overlay. Refusing to
      modify an inconsistent disk chain. Inspect with virsh snapshot-dumpxml
      and virsh domblklist before recovery.
  loop: "{{ runtime_snapshotted_disk_chain_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.instance_name }}"
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool

- name: Check for stale root overlays without snapshot metadata
  ansible.builtin.stat:
    path: >-
      {{
        kvm_snapshot_overlay_path
        ~ '/'
        ~ item.instance_name
        ~ '-'
        ~ kvm_snapshot_name
        ~ '-vda.qcow2'
      }}
  loop: "{{ runtime_domains_requiring_snapshot | default([]) }}"
  loop_control:
    label: "{{ item.instance_name }}:vda"
  register: runtime_stale_root_overlay_stats
  changed_when: false
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool

- name: Fail when a stale root overlay blocks safe snapshot recovery
  ansible.builtin.fail:
    msg: >-
      Stale snapshot overlay exists without matching libvirt metadata:
      {{
        kvm_snapshot_overlay_path
        ~ '/'
        ~ item.item.instance_name
        ~ '-'
        ~ kvm_snapshot_name
        ~ '-vda.qcow2'
      }}. Refusing to overwrite it. Inspect the domain disk
      chain, then use make cleanup-force-disks for a full declared-instance rebuild.
  loop: "{{ runtime_stale_root_overlay_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.instance_name }}:vda"
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool
    - item.stat.exists | default(false)

- name: Check for stale additional-disk overlays without snapshot metadata
  ansible.builtin.stat:
    path: >-
      {{
        kvm_snapshot_overlay_path
        ~ '/'
        ~ item.0.instance_name
        ~ '-'
        ~ kvm_snapshot_name
        ~ '-'
        ~ item.1.guest_device
        ~ '.qcow2'
      }}
  loop: >-
    {{
      runtime_domains_requiring_snapshot
      | default([])
      | subelements('instance_extra_disks', skip_missing=True)
    }}
  loop_control:
    label: "{{ item.0.instance_name }}:{{ item.1.guest_device }}"
  register: runtime_stale_extra_overlay_stats
  changed_when: false
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool
    - item.0.instance_extra_disks_enabled | bool

- name: Fail when a stale additional-disk overlay blocks safe snapshot recovery
  ansible.builtin.fail:
    msg: >-
      Stale snapshot overlay exists without matching libvirt metadata:
      {{
        kvm_snapshot_overlay_path
        ~ '/'
        ~ item.item.0.instance_name
        ~ '-'
        ~ kvm_snapshot_name
        ~ '-'
        ~ item.item.1.guest_device
        ~ '.qcow2'
      }}. Refusing to overwrite it. Inspect the domain disk
      chain, then use make cleanup-force-disks for a full declared-instance rebuild.
  loop: "{{ runtime_stale_extra_overlay_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.0.instance_name }}:{{ item.item.1.guest_device }}"
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool
    - item.stat.exists | default(false)

- name: Run visible guest readiness checkpoints before baseline snapshot
  ansible.builtin.include_tasks: tasks/provision-runtime-readiness.yml
  loop: "{{ runtime_domains_requiring_snapshot | default([]) }}"
  loop_control:
    loop_var: runtime_readiness_instance
    label: "{{ runtime_readiness_instance.instance_name }}"
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool
    - kvm_wait_for_cloud_init_before_snapshot | bool
    - (runtime_domains_requiring_snapshot | default([])) | length > 0

- name: Request clean shutdown for snapshot reconciliation targets
  ansible.builtin.command:
    argv:
      - virsh
      - shutdown
      - "{{ item.instance_name }}"
  loop: "{{ runtime_domains_requiring_snapshot | default([]) }}"
  loop_control:
    label: "{{ item.instance_name }}"
  changed_when: true
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool
    - (runtime_domains_requiring_snapshot | default([])) | length > 0

- name: Wait for clean shutdown before snapshot creation
  ansible.builtin.command:
    argv:
      - virsh
      - domstate
      - "{{ item.instance_name }}"
  loop: "{{ runtime_domains_requiring_snapshot | default([]) }}"
  loop_control:
    label: "{{ item.instance_name }}"
  register: runtime_snapshot_shutdown_state
  until: (runtime_snapshot_shutdown_state.stdout | trim) == 'shut off'
  retries: "{{ kvm_shutdown_wait_retries | default(60) | int }}"
  delay: "{{ kvm_shutdown_wait_delay_seconds | default(3) | int }}"
  changed_when: false
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool
    - (runtime_domains_requiring_snapshot | default([])) | length > 0

- name: Resolve attached cloud-init seed devices
  ansible.builtin.shell: |
    set -euo pipefail
    virsh domblklist "{{ item.instance_name }}" --details \
      | awk -v seed="{{ kvm_instance_disk_pool_path }}/{{ item.instance_name }}-seed.img" '$4 == seed {print $3}'
  args:
    executable: /bin/bash
  loop: "{{ runtime_domains_requiring_snapshot | default([]) }}"
  loop_control:
    label: "{{ item.instance_name }}-seed.img"
  register: runtime_seed_device_results
  changed_when: false
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool

- name: Fail when multiple cloud-init seed devices resolve for one domain
  ansible.builtin.assert:
    that:
      - (item.stdout_lines | default([]) | length) <= 1
    fail_msg: >-
      Multiple attached devices resolve to the declared seed path for
      {{ item.item.instance_name }}. Refusing ambiguous detach operation.
  loop: "{{ runtime_seed_device_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.instance_name }}"
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool

- name: Detach attached cloud-init seed media from persistent domain XML
  ansible.builtin.command:
    argv:
      - virsh
      - detach-disk
      - "{{ item.item.instance_name }}"
      - "{{ item.stdout | trim }}"
      - --config
  loop: "{{ runtime_seed_device_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.instance_name }}:{{ item.stdout | trim }}"
  changed_when: true
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool
    - (item.stdout_lines | default([]) | length) == 1

- name: Verify cloud-init seed media is absent from persistent domain XML
  ansible.builtin.command:
    argv:
      - virsh
      - domblklist
      - "{{ item.instance_name }}"
      - --inactive
      - --details
  loop: "{{ runtime_domains_requiring_snapshot | default([]) }}"
  loop_control:
    label: "{{ item.instance_name }}"
  register: runtime_seed_detach_verification
  changed_when: false
  failed_when: >-
    (kvm_instance_disk_pool_path ~ '/' ~ item.instance_name ~ '-seed.img')
    in runtime_seed_detach_verification.stdout
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool

- name: Delete cloud-init seed files after verified detach
  ansible.builtin.file:
    path: "{{ kvm_instance_disk_pool_path }}/{{ item.instance_name }}-seed.img"
    state: absent
  loop: "{{ runtime_domains_requiring_snapshot | default([]) }}"
  loop_control:
    label: "{{ item.instance_name }}-seed.img"
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool

- name: Ensure external snapshot overlay directory exists
  ansible.builtin.file:
    path: "{{ kvm_snapshot_overlay_path }}"
    state: directory
    owner: "{{ kvm_libvirt_runtime_user }}"
    group: "{{ kvm_libvirt_runtime_user }}"
    mode: "0750"
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool
    - (runtime_domains_requiring_snapshot | default([])) | length > 0

- name: Render external snapshot definitions
  ansible.builtin.copy:
    dest: "{{ kvm_snapshot_overlay_path }}/{{ item.instance_name }}-{{ kvm_snapshot_name }}.xml"
    mode: "0600"
    content: |
      <domainsnapshot>
        <name>{{ kvm_snapshot_name }}</name>
        <description>{{ kvm_snapshot_description }}</description>
        <disks>
          <disk name='vda' snapshot='external'>
            <source file='{{ kvm_snapshot_overlay_path }}/{{ item.instance_name }}-{{ kvm_snapshot_name }}-vda.qcow2'/>
          </disk>
      {% if item.instance_extra_disks_enabled | bool %}
      {% for extra_disk in item.instance_extra_disks | default([]) %}
          <disk name='{{ extra_disk.guest_device }}' snapshot='external'>
            <source file='{{ kvm_snapshot_overlay_path }}/{{ item.instance_name }}-{{ kvm_snapshot_name }}-{{ extra_disk.guest_device }}.qcow2'/>
          </disk>
      {% endfor %}
      {% endif %}
        </disks>
      </domainsnapshot>
  loop: "{{ runtime_domains_requiring_snapshot | default([]) }}"
  loop_control:
    label: "{{ item.instance_name }}"
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool

- name: Create missing mandatory external snapshots atomically
  ansible.builtin.command:
    argv:
      - virsh
      - snapshot-create
      - "{{ item.instance_name }}"
      - "{{ kvm_snapshot_overlay_path }}/{{ item.instance_name }}-{{ kvm_snapshot_name }}.xml"
      - --disk-only
      - --atomic
  loop: "{{ runtime_domains_requiring_snapshot | default([]) }}"
  loop_control:
    label: "{{ item.instance_name }}"
  changed_when: true
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool

- name: Verify mandatory snapshot metadata after reconciliation
  ansible.builtin.command:
    argv:
      - virsh
      - snapshot-list
      - "{{ item.instance_name }}"
      - --name
  loop: "{{ instance_runtime_targets }}"
  loop_control:
    label: "{{ item.instance_name }}"
  register: runtime_snapshot_verification_results
  changed_when: false
  failed_when: kvm_snapshot_name not in runtime_snapshot_verification_results.stdout_lines
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool

- name: Remove completed partial-provision ownership markers
  ansible.builtin.file:
    path: "{{ kvm_instance_disk_pool_path }}/.{{ item.instance_name }}.provisioning"
    state: absent
  loop: "{{ instance_runtime_targets }}"
  loop_control:
    label: "{{ item.instance_name }}"
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool

- name: Remove stale cloud-init seed files after snapshot verification
  ansible.builtin.file:
    path: "{{ kvm_instance_disk_pool_path }}/{{ item.instance_name }}-seed.img"
    state: absent
  loop: "{{ instance_runtime_targets }}"
  loop_control:
    label: "{{ item.instance_name }}-seed.img"
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool

- name: Start reconciled domains after snapshot creation
  ansible.builtin.command:
    argv:
      - virsh
      - start
      - "{{ item.instance_name }}"
  loop: "{{ runtime_domains_requiring_snapshot | default([]) }}"
  loop_control:
    label: "{{ item.instance_name }}"
  changed_when: true
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool
    - kvm_start_instances_after_snapshot | bool
    - (runtime_domains_requiring_snapshot | default([])) | length > 0

- name: Wait for reconciled domains to report running
  ansible.builtin.command:
    argv:
      - virsh
      - domstate
      - "{{ item.instance_name }}"
  loop: "{{ runtime_domains_requiring_snapshot | default([]) }}"
  loop_control:
    label: "{{ item.instance_name }}"
  register: runtime_reconciled_domain_state
  until: (runtime_reconciled_domain_state.stdout | trim) == 'running'
  retries: 18
  delay: 5
  changed_when: false
  when:
    - kvm_run_mutation_phases | bool
    - kvm_snapshot_enabled | bool
    - kvm_start_instances_after_snapshot | bool
    - (runtime_domains_requiring_snapshot | default([])) | length > 0

- name: Collect final declared domain states
  ansible.builtin.command:
    argv:
      - virsh
      - domstate
      - "{{ item.instance_name }}"
  loop: "{{ instance_runtime_targets }}"
  loop_control:
    label: "{{ item.instance_name }}"
  register: runtime_final_domain_states
  changed_when: false
  when: kvm_run_mutation_phases | bool

- name: Runtime reconciliation summary
  ansible.builtin.debug:
    msg: >-
      snapshot_created={{ runtime_domains_requiring_snapshot | default([]) | map(attribute='instance_name') | list }}
      snapshot_already_present={{ runtime_domains_with_snapshot | default([]) | map(attribute='instance_name') | list }}
      final_states={{ runtime_final_domain_states.results | default([]) | map(attribute='stdout') | map('trim') | list }}
  when: kvm_run_mutation_phases | bool
