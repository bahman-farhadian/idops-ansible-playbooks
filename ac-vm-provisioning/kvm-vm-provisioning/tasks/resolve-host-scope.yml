---
# =========================================================================
# HOST SCOPE: narrow the declared instances down to this hypervisor
# Every play target runs the same workflow, so each host must first work out
# which declared instances belong to it. Instances without an explicit
# `hypervisor` key fall to the default host, which keeps single-host
# configurations behaving exactly as before.
# =========================================================================
# Trailing slashes are stripped here, once, for every consumer downstream:
# several tasks compare a computed "<dir>/<file>" string against the real
# disk path byte-for-byte (see provision-runtime.yml's root-disk drift
# check), and a trailing slash on the configured directory turns that into
# "<dir>//<file>", which never matches even though it is the same file.
- name: Resolve storage layout for this hypervisor
  ansible.builtin.set_fact:
    kvm_image_cache_path: >-
      {{
        (kvm_host_image_cache_path | default(kvm_image_cache_path))
        | regex_replace('/+$', '')
      }}
    kvm_instance_disk_pool_path: >-
      {{
        (kvm_host_instance_disk_pool_path | default(kvm_instance_disk_pool_path))
        | regex_replace('/+$', '')
      }}
    kvm_cloud_init_workspace_path: >-
      {{
        (kvm_host_cloud_init_workspace_path | default(kvm_cloud_init_workspace_path))
        | regex_replace('/+$', '')
      }}
    kvm_auto_create_image_cache_path: >-
      {{
        kvm_host_auto_create_image_cache_path
        | default(kvm_auto_create_image_cache_path) | bool
      }}
    kvm_cleanup_workspace_path_after_run: >-
      {{
        kvm_host_cleanup_workspace_path_after_run
        | default(kvm_cleanup_workspace_path_after_run) | bool
      }}

- name: Resolve network layout for this hypervisor
  ansible.builtin.set_fact:
    kvm_default_libvirt_network_name: >-
      {{ kvm_host_libvirt_network_name | default(kvm_default_libvirt_network_name) }}
    kvm_default_guest_network_gateway: >-
      {{ kvm_host_guest_network_gateway | default(kvm_default_guest_network_gateway) }}
    kvm_default_guest_network_prefix: >-
      {{ kvm_host_guest_network_prefix | default(kvm_default_guest_network_prefix) }}
    kvm_default_guest_dns_servers: >-
      {{ kvm_host_guest_dns_servers | default(kvm_default_guest_dns_servers) }}
    kvm_auto_start_required_libvirt_networks: >-
      {{
        kvm_host_auto_start_required_libvirt_networks
        | default(kvm_auto_start_required_libvirt_networks) | bool
      }}

- name: Resolve connection facts for this hypervisor
  ansible.builtin.set_fact:
    kvm_assigned_instances: []
    kvm_effective_libvirt_uri: >-
      {{ kvm_host_libvirt_uri | default(kvm_libvirt_connection_uri) }}
    kvm_effective_hypervisor_name: >-
      {{ kvm_hypervisor_name | default(inventory_hostname) }}
    kvm_effective_default_hypervisor: >-
      {{
        kvm_host_default_hypervisor
        | default(kvm_hypervisor_name | default(inventory_hostname))
      }}

- name: Assign declared instances to their hypervisor
  ansible.builtin.set_fact:
    kvm_assigned_instances: >-
      {{
        kvm_assigned_instances
        + [
            item
            | combine({
                'hypervisor': (
                  item.hypervisor
                  | default(kvm_effective_default_hypervisor, true)
                )
              })
          ]
      }}
  loop: "{{ kvm_instance_definitions }}"
  loop_control:
    label: "{{ item.instance_name | default('unknown') }}"

- name: Build hypervisor-scoped instance list
  ansible.builtin.set_fact:
    kvm_host_instance_definitions: >-
      {{
        kvm_assigned_instances
        | selectattr('hypervisor', 'equalto', kvm_effective_hypervisor_name)
        | list
      }}

- name: Report hypervisor instance scope
  ansible.builtin.debug:
    msg: >-
      hypervisor={{ kvm_effective_hypervisor_name }}
      uri={{ kvm_effective_libvirt_uri }}
      image_cache={{ kvm_image_cache_path }}
      disk_pool={{ kvm_instance_disk_pool_path }}
      network={{ kvm_default_libvirt_network_name }}
      gateway={{ kvm_default_guest_network_gateway }}
      instances={{ kvm_host_instance_definitions | map(attribute='instance_name') | list }}

- name: End workflow for a hypervisor with no declared instances
  ansible.builtin.meta: end_host
  when: (kvm_host_instance_definitions | length) == 0
