---
- name: Fail when the OS is not a supported Debian or Ubuntu release
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - >-
        (ansible_facts['distribution'] == 'Debian'
         and ansible_facts['distribution_major_version'] in ['12', '13'])
        or
        (ansible_facts['distribution'] == 'Ubuntu'
         and ansible_facts['distribution_version'] in ['24.04', '26.04'])
    fail_msg: >-
      This playbook installs Nexus on Debian 12, Debian 13, Ubuntu 24.04,
      or Ubuntu 26.04. Host {{ inventory_hostname }} is
      {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] | default('') }}.

- name: Fail when the extra disk mount is missing
  ansible.builtin.assert:
    that:
      - ansible_facts['mounts'] | selectattr('mount', 'equalto', nexus_data_mount) | list | length > 0
    fail_msg: >-
      {{ nexus_data_mount }} is not a mounted disk on {{ inventory_hostname }}.
      Provision this guest with an extra disk mounted at {{ nexus_data_mount }}.

- name: Fail when the admin password is empty
  ansible.builtin.assert:
    that:
      - nexus_admin_password | default('') | length > 0
    fail_msg: >-
      nexus_admin_password is empty. Set it in
      {{ nexus_selected_local_settings_file | default('your local settings file') }}.
      Do not put the password in vars/nexus.yml.

- name: Fail when the encryption key is empty
  ansible.builtin.assert:
    that:
      - nexus_secrets_key | default('') | length > 0
      - nexus_secrets_key_id | default('') | length > 0
    fail_msg: >-
      nexus_secrets_key is empty. Generate one with:
      openssl rand -base64 32
      Put the value in
      {{ nexus_selected_local_settings_file | default('your local settings file') }}
      as nexus_secrets_key. Do not put it in vars/nexus.yml.

- name: Fail when the HTTP port is not valid
  ansible.builtin.assert:
    that:
      - nexus_http_port | int > 0
      - nexus_http_port | int <= 65535
      - nexus_docker_http_port | int > 0
      - nexus_docker_http_port | int <= 65535
      - (nexus_http_port | int) != (nexus_docker_http_port | int)
    fail_msg: >-
      nexus_http_port and nexus_docker_http_port must be different ports
      between 1 and 65535.
