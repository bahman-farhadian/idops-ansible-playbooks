---
- name: Flush handlers so Nexus is listening before API calls
  ansible.builtin.meta: flush_handlers

- name: Wait until Nexus answers on localhost
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nexus_http_port }}/service/rest/v1/status"
    method: GET
    status_code: [200]
  register: nexus_status
  until: nexus_status.status == 200
  retries: 60
  delay: 10

- name: Check for the first-boot admin password file
  ansible.builtin.stat:
    path: "{{ nexus_data_dir }}/admin.password"
  register: nexus_admin_password_file

- name: Read the first-boot admin password
  ansible.builtin.slurp:
    src: "{{ nexus_data_dir }}/admin.password"
  register: nexus_admin_password_slurp
  when: nexus_admin_password_file.stat.exists | default(false)

- name: Set the admin password from the first-boot file
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nexus_http_port }}/service/rest/v1/security/users/{{ nexus_admin_user }}/change-password"
    method: PUT
    url_username: "{{ nexus_admin_user }}"
    url_password: "{{ nexus_admin_password_slurp.content | b64decode | trim }}"
    force_basic_auth: true
    headers:
      Content-Type: text/plain
    body: "{{ nexus_admin_password }}"
    status_code: [204, 200]
  no_log: true
  when: nexus_admin_password_file.stat.exists | default(false)

- name: Check that the admin password in local settings works for the API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nexus_http_port }}/service/rest/v1/security/users"
    method: GET
    url_username: "{{ nexus_admin_user }}"
    url_password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    status_code: [200]
  no_log: true
  register: nexus_admin_users

- name: Fail when the admin user is missing or not an administrator
  ansible.builtin.assert:
    that:
      - nexus_admin_users.json | selectattr('userId', 'equalto', nexus_admin_user) | list | length > 0
      - >-
        'nx-admin' in (
          (nexus_admin_users.json | selectattr('userId', 'equalto', nexus_admin_user) | list | first).roles | default([])
        )
    fail_msg: >-
      User {{ nexus_admin_user }} must exist with the nx-admin role.
      Set nexus_admin_password in your local settings file.

- name: Set security realms (keep local login, add Docker token)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nexus_http_port }}/service/rest/v1/security/realms/active"
    method: PUT
    url_username: "{{ nexus_admin_user }}"
    url_password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ nexus_security_realms }}"
    status_code: [204, 200]
  no_log: true

- name: Read the Community Edition EULA
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nexus_http_port }}/service/rest/v1/system/eula"
    method: GET
    url_username: "{{ nexus_admin_user }}"
    url_password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    status_code: [200]
  no_log: true
  register: nexus_eula

- name: Accept the Community Edition EULA
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nexus_http_port }}/service/rest/v1/system/eula"
    method: POST
    url_username: "{{ nexus_admin_user }}"
    url_password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      accepted: true
      disclaimer: "{{ nexus_eula.json.disclaimer }}"
    status_code: [200, 204]
  no_log: true
  when: not (nexus_eula.json.accepted | default(false) | bool)

- name: Enable anonymous pull for APT and Docker
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nexus_http_port }}/service/rest/v1/security/anonymous"
    method: PUT
    url_username: "{{ nexus_admin_user }}"
    url_password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      enabled: "{{ nexus_anonymous_access | bool }}"
      userId: anonymous
      realmName: NexusAuthenticatingRealm
    status_code: [200, 204]
  no_log: true

# Run on the Ansible host. The 1 GiB guest has ~50 MiB free and
# tmpfs /tmp; python on the guest can fail even when REST already works.
- name: Check that the web UI can sign in as admin
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ playbook_dir }}/files/check_admin_login.py"
      - "--url"
      - "http://{{ ansible_host }}:{{ nexus_http_port }}"
      - "--user"
      - "{{ nexus_admin_user }}"
      - "--password"
      - "{{ nexus_admin_password }}"
  delegate_to: localhost
  become: false
  register: nexus_ui_login
  until: nexus_ui_login.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  no_log: true

- name: Re-encrypt stored secrets with the custom key
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nexus_http_port }}/service/rest/v1/secrets/encryption/re-encrypt"
    method: PUT
    url_username: "{{ nexus_admin_user }}"
    url_password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      secretKeyId: "{{ nexus_secrets_key_id }}"
    status_code: [200, 202, 204, 400]
  no_log: true
  register: nexus_reencrypt

- name: Wait until the default encryption-key check is healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nexus_http_port }}/service/rest/v1/status/check"
    method: GET
    url_username: "{{ nexus_admin_user }}"
    url_password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    status_code: [200]
  register: nexus_status_check
  until: >-
    (nexus_status_check.json['Default Secret Encryption Key'].healthy | default(false)) | bool
  retries: 30
  delay: 5
  no_log: true

- name: Show how to sign in to the web UI
  ansible.builtin.debug:
    msg: >-
      Web UI: http://{{ ansible_host | default(inventory_hostname) }}:{{ nexus_http_port }}/
      Sign in as user {{ nexus_admin_user }}. The password is in your
      local settings file (nexus_admin_password). Click the user icon
      at the top right, then Sign In.
