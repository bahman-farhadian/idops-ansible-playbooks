---
- name: Initialize Swarm on the first manager
  ansible.builtin.command:
    argv:
      - docker
      - swarm
      - init
      - --advertise-addr
      - "{{ docker_swarm_advertise_addr }}"
  when:
    - inventory_hostname == groups['docker_swarm_managers'][0]
    - docker_swarm_node_state == 'inactive'
  changed_when: true
  no_log: true

- name: Read join tokens on the first manager
  when: inventory_hostname == groups['docker_swarm_managers'][0]
  block:
    - name: Read the manager join token
      ansible.builtin.command:
        argv:
          - docker
          - swarm
          - join-token
          - -q
          - manager
      register: docker_swarm_manager_token_cmd
      changed_when: false
      no_log: true

    - name: Read the worker join token
      ansible.builtin.command:
        argv:
          - docker
          - swarm
          - join-token
          - -q
          - worker
      register: docker_swarm_worker_token_cmd
      changed_when: false
      no_log: true

    - name: Store the join tokens for this run
      ansible.builtin.set_fact:
        docker_swarm_manager_token: "{{ docker_swarm_manager_token_cmd.stdout | trim }}"
        docker_swarm_worker_token: "{{ docker_swarm_worker_token_cmd.stdout | trim }}"
        docker_swarm_leader_addr: "{{ docker_swarm_advertise_addr }}"
      no_log: true

- name: Join a manager or worker that is not yet a member
  ansible.builtin.command:
    argv:
      - docker
      - swarm
      - join
      - --advertise-addr
      - "{{ docker_swarm_advertise_addr }}"
      - --token
      - "{{ docker_swarm_join_token }}"
      - "{{ hostvars[groups['docker_swarm_managers'][0]]['docker_swarm_leader_addr'] }}:2377"
  vars:
    docker_swarm_join_token: >-
      {{
        hostvars[groups['docker_swarm_managers'][0]]['docker_swarm_manager_token']
        if docker_swarm_node_role == 'manager'
        else hostvars[groups['docker_swarm_managers'][0]]['docker_swarm_worker_token']
      }}
  when:
    - inventory_hostname != groups['docker_swarm_managers'][0]
    - docker_swarm_node_state == 'inactive'
  changed_when: true
  no_log: true
