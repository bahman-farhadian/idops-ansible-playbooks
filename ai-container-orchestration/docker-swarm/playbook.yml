---
- name: Prepare Swarm inventory
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/docker-swarm.yml
    # Tracked files have generic defaults. Real hosts live in a
    # gitignored *.local.yml selected with docker_swarm_local_settings_file.
    # There is no default. The dummy path exists only so ansible-lint
    # --syntax-check can parse this entry.
    - "{{ docker_swarm_local_settings_file | default('vars/.syntax-check.local.yml') }}"
  vars:
    docker_swarm_action_effective: "{{ docker_swarm_action | default('deploy') }}"
    docker_swarm_selected_local_settings_file: "{{ docker_swarm_local_settings_file | default('') }}"
    docker_swarm_local_settings_path: >-
      {{
        docker_swarm_selected_local_settings_file
        if docker_swarm_selected_local_settings_file is match('^/')
        else (playbook_dir ~ '/' ~ docker_swarm_selected_local_settings_file)
      }}

  tasks:
    - name: Fail when no local settings file was selected
      ansible.builtin.fail:
        msg: >-
          No local settings file was selected. There is no default.
          Run: make <target> LOCAL_SETTINGS_FILE=vars/settings.docker-swarm.local.yml
      when: docker_swarm_selected_local_settings_file | length == 0

    - name: Validate selected local settings file name
      ansible.builtin.assert:
        that:
          - docker_swarm_selected_local_settings_file is search('\\.local\\.yml$')
        fail_msg: >-
          docker_swarm_local_settings_file must end with .local.yml
          (got '{{ docker_swarm_selected_local_settings_file }}').
          Example: LOCAL_SETTINGS_FILE=vars/settings.docker-swarm.local.yml

    - name: Check for a local settings file
      ansible.builtin.stat:
        path: "{{ docker_swarm_local_settings_path }}"
      register: docker_swarm_local_override_file
      changed_when: false

    - name: Fail when the selected local settings file is missing
      ansible.builtin.fail:
        msg: >-
          {{ docker_swarm_selected_local_settings_file }} was not found.
          Put the real managers and workers in this file.
          Create it with:
          make settings LOCAL_SETTINGS_FILE={{ docker_swarm_selected_local_settings_file }}
      when: not docker_swarm_local_override_file.stat.exists

    - name: Load the local settings file for reporting
      ansible.builtin.include_vars:
        file: "{{ docker_swarm_local_settings_path }}"
        name: docker_swarm_local_overrides
      when: docker_swarm_local_override_file.stat.exists

    - name: Show which keys come from the local settings file
      ansible.builtin.debug:
        msg: >-
          Using {{ docker_swarm_selected_local_settings_file }}.
          It sets {{ docker_swarm_local_overrides | length }} key(s):
          {{ docker_swarm_local_overrides.keys() | list | join(', ') }}.
          Edit those keys in that file. The same keys in
          vars/docker-swarm.yml are ignored.
      when: docker_swarm_local_override_file.stat.exists

    - name: Validate requested action
      ansible.builtin.assert:
        that:
          - docker_swarm_action_effective in ['ping', 'deploy']
        fail_msg: "docker_swarm_action must be ping or deploy."

    - name: Fail when the manager count is even or zero
      ansible.builtin.assert:
        that:
          - docker_swarm_managers is defined
          - (docker_swarm_managers | length) > 0
          - ((docker_swarm_managers | length) % 2) == 1
        fail_msg: >-
          Swarm needs an odd number of managers (1, 3, 5, ...).
          {{ docker_swarm_selected_local_settings_file }} has
          {{ docker_swarm_managers | default([]) | length }}.

    - name: Fail when a manager entry is incomplete
      ansible.builtin.assert:
        that:
          - item.name is defined
          - (item.name | string | length) > 0
          - item.advertise_addr is defined
          - item.advertise_addr is match('^[0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}$')
          - docker_swarm_managers | selectattr('name', 'equalto', item.name) | list | length == 1
        fail_msg: >-
          Each docker_swarm_managers entry needs a unique name and an
          IPv4 advertise_addr. Got '{{ item.name | default('unnamed') }}'.
      loop: "{{ docker_swarm_managers }}"
      loop_control:
        label: "{{ item.name | default('unnamed') }}"

    - name: Fail when a worker entry is incomplete
      ansible.builtin.assert:
        that:
          - item.name is defined
          - (item.name | string | length) > 0
          - item.advertise_addr is defined
          - item.advertise_addr is match('^[0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}$')
          - docker_swarm_workers | selectattr('name', 'equalto', item.name) | list | length == 1
          - item.name not in (docker_swarm_managers | map(attribute='name') | list)
        fail_msg: >-
          Each docker_swarm_workers entry needs a unique name and an
          IPv4 advertise_addr, and it cannot also be a manager.
          Got '{{ item.name | default('unnamed') }}'.
      loop: "{{ docker_swarm_workers }}"
      loop_control:
        label: "{{ item.name | default('unnamed') }}"
      when: (docker_swarm_workers | default([]) | length) > 0

    - name: Fail when a label or network token is unsafe to pass to docker
      ansible.builtin.assert:
        that:
          - item.node is defined
          - item.key is defined
          - item.value is defined
          - item.node is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
          - item.key is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
          - item.value is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
        fail_msg: >-
          Each docker_swarm_labels entry needs node, key, and value as
          a single token (letters, digits, dot, underscore, hyphen).
      loop: "{{ docker_swarm_labels }}"
      loop_control:
        label: "{{ item.node | default('unlabeled') }}"
      when: (docker_swarm_labels | default([]) | length) > 0

    - name: Fail when a network entry is incomplete
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.name is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
          - item.attachable is defined
        fail_msg: "Each docker_swarm_networks entry needs a name and attachable true or false."
      loop: "{{ docker_swarm_networks }}"
      loop_control:
        label: "{{ item.name | default('unnamed') }}"
      when: (docker_swarm_networks | default([]) | length) > 0

    - name: Add Swarm managers to inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups:
          - docker_swarm_members
          - docker_swarm_managers
        ansible_host: "{{ item.address | default(item.name) }}"
        ansible_user: "{{ (item.user | default('', true)) or omit }}"
        ansible_port: "{{ item.port | default(22) }}"
        ansible_become_password: "{{ (item.become_password | default('', true)) or omit }}"
        ansible_python_interpreter: "{{ item.python_interpreter | default('/usr/bin/python3') }}"
        docker_swarm_advertise_addr: "{{ item.advertise_addr }}"
        docker_swarm_node_role: manager
      loop: "{{ docker_swarm_managers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Add Swarm workers to inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups:
          - docker_swarm_members
          - docker_swarm_workers
        ansible_host: "{{ item.address | default(item.name) }}"
        ansible_user: "{{ (item.user | default('', true)) or omit }}"
        ansible_port: "{{ item.port | default(22) }}"
        ansible_become_password: "{{ (item.become_password | default('', true)) or omit }}"
        ansible_python_interpreter: "{{ item.python_interpreter | default('/usr/bin/python3') }}"
        docker_swarm_advertise_addr: "{{ item.advertise_addr }}"
        docker_swarm_node_role: worker
      loop: "{{ docker_swarm_workers }}"
      loop_control:
        label: "{{ item.name }}"
      when: (docker_swarm_workers | default([]) | length) > 0

- name: Run Swarm action on members
  hosts: docker_swarm_members
  become: "{{ docker_swarm_become_enabled | default(true) | bool }}"
  become_method: "{{ docker_swarm_become_method | default('sudo') }}"
  become_user: "{{ docker_swarm_become_user | default('root') }}"
  gather_facts: "{{ docker_swarm_action_effective == 'deploy' }}"
  serial: 1
  any_errors_fatal: true
  vars_files:
    - vars/docker-swarm.yml
    - "{{ docker_swarm_local_settings_file | default('vars/.syntax-check.local.yml') }}"
  vars:
    docker_swarm_action_effective: "{{ docker_swarm_action | default('deploy') }}"
    docker_swarm_selected_local_settings_file: "{{ docker_swarm_local_settings_file | default('') }}"

  tasks:
    - name: Run connectivity check
      ansible.builtin.include_tasks: tasks/ping.yml
      when: docker_swarm_action_effective == 'ping'

    - name: Join this host to the Swarm
      ansible.builtin.include_tasks: tasks/deploy.yml
      when: docker_swarm_action_effective == 'deploy'

- name: Publish labels and check the cluster
  hosts: docker_swarm_managers
  become: "{{ docker_swarm_become_enabled | default(true) | bool }}"
  become_method: "{{ docker_swarm_become_method | default('sudo') }}"
  become_user: "{{ docker_swarm_become_user | default('root') }}"
  gather_facts: false
  vars_files:
    - vars/docker-swarm.yml
    - "{{ docker_swarm_local_settings_file | default('vars/.syntax-check.local.yml') }}"
  vars:
    docker_swarm_action_effective: "{{ docker_swarm_action | default('deploy') }}"
    docker_swarm_selected_local_settings_file: "{{ docker_swarm_local_settings_file | default('') }}"

  tasks:
    - name: Apply labels, create networks, and prove the cluster
      ansible.builtin.include_tasks: tasks/finish.yml
      when:
        - docker_swarm_action_effective == 'deploy'
        - inventory_hostname == groups['docker_swarm_managers'][0]
