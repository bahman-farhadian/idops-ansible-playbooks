---
# Empty on purpose. Real hosts go in docker_engine_targets in a named
# *.local.yml file. playbook.yml adds them to the docker_engine_targets
# group at runtime. Do not put a real address, user, or password here.
all:
  children:
    local:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
    docker_engine_targets:
      hosts: {}
