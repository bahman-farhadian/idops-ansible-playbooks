---
- name: Fail when this host is not one of the two firewall nodes
  ansible.builtin.assert:
    that:
      - firewall_ha_nodes | length == 2
      - inventory_hostname in (firewall_ha_nodes | map(attribute='name') | list)
      - firewall_ha_vip_wan | length > 0
      - firewall_ha_vip_lan | length > 0
      - (firewall_ha_vrid | int) >= 1
      - (firewall_ha_vrid | int) <= 255
    fail_msg: >-
      {{ inventory_hostname }} is not in firewall_ha_nodes.
      The list needs exactly two nodes, and this host's name must match one of them.

- name: Record this node, its peer, and the OpenVPN profiles
  ansible.builtin.set_fact:
    firewall_ha_self: "{{ firewall_ha_nodes | selectattr('name', 'equalto', inventory_hostname) | first }}"
    firewall_ha_peer: "{{ firewall_ha_nodes | rejectattr('name', 'equalto', inventory_hostname) | first }}"
    openvpn_profiles:
      - name: admin
        port: "{{ openvpn_admin_port | int }}"
        device: tun-admin
        network: "{{ openvpn_admin_network }}"
        netmask: "{{ openvpn_admin_netmask }}"
        routes: "{{ openvpn_admin_routes }}"
      - name: user
        port: "{{ openvpn_user_port | int }}"
        device: tun-user
        network: "{{ openvpn_user_network }}"
        netmask: "{{ openvpn_user_netmask }}"
        routes: "{{ openvpn_user_routes }}"
    openvpn_pki_dir: "{{ playbook_dir }}/artifacts/openvpn"

- name: Install keepalived and OpenVPN
  ansible.builtin.apt:
    name:
      - keepalived
      - openvpn
    state: present
    update_cache: true
  register: firewall_ha_packages
  retries: 6
  delay: 10
  until: firewall_ha_packages is succeeded

- name: Create the shared OpenVPN CA on the control node
  ansible.builtin.command:
    argv: >-
      {{
        [
          'bash',
          playbook_dir ~ '/files/openvpn-init-pki.sh',
          openvpn_pki_dir
        ]
      }}
  delegate_to: localhost
  become: false
  run_once: true
  register: openvpn_pki_init
  changed_when: "'created' in (openvpn_pki_init.stdout | default(''))"

- name: Install keepalived notify script
  ansible.builtin.copy:
    src: notify-openvpn.sh
    dest: /etc/keepalived/notify-openvpn.sh
    owner: root
    group: root
    mode: "0750"

- name: Write keepalived config
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart keepalived

- name: Install the OpenVPN client allow check
  ansible.builtin.copy:
    src: tls-verify.sh
    dest: /etc/openvpn/server/tls-verify.sh
    owner: root
    group: root
    mode: "0755"

- name: Create an empty OpenVPN allow list when missing
  ansible.builtin.copy:
    dest: "/etc/openvpn/server/allowed-{{ item }}"
    owner: root
    group: root
    mode: "0644"
    content: ""
    force: false
  loop:
    - admin
    - user
  loop_control:
    label: "{{ item }}"

- name: Install OpenVPN CA and server certificate
  ansible.builtin.copy:
    src: "{{ openvpn_pki_dir }}/{{ item.name }}"
    dest: "/etc/openvpn/server/{{ item.name }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {name: ca.crt, mode: "0644"}
    - {name: ca.key, mode: "0600"}
    - {name: server.crt, mode: "0644"}
    - {name: server.key, mode: "0600"}
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Write OpenVPN server configs
  ansible.builtin.template:
    src: openvpn-server.conf.j2
    dest: "/etc/openvpn/server/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0640"
  loop: "{{ openvpn_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    openvpn_profile: "{{ item }}"
  register: openvpn_server_config

- name: Read the OpenVPN server configs
  ansible.builtin.slurp:
    src: "/etc/openvpn/server/{{ item.name }}.conf"
  loop: "{{ openvpn_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  register: openvpn_server_config_text

- name: Fail if OpenVPN would redirect traffic or set DNS
  ansible.builtin.assert:
    that:
      - "'redirect-gateway' not in (item.content | b64decode)"
      - "'dhcp-option' not in (item.content | b64decode)"
      - "'block-outside-dns' not in (item.content | b64decode)"
    fail_msg: >-
      {{ item.source }} contains a full-tunnel or DNS option.
      Remove redirect-gateway, dhcp-option, and block-outside-dns.
  loop: "{{ openvpn_server_config_text.results }}"
  loop_control:
    label: "{{ item.source | default('openvpn-server') }}"

- name: Install the VPN client command
  ansible.builtin.copy:
    src: vpn-client
    dest: /usr/local/sbin/vpn-client
    owner: root
    group: root
    mode: "0755"

- name: Create the firewall documentation directory
  ansible.builtin.file:
    path: /usr/local/share/doc/linux-firewall
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the VPN client guide
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/vpn-client-guide.md"
    dest: /usr/local/share/doc/linux-firewall/vpn-client-guide.md
    owner: root
    group: root
    mode: "0644"

- name: Write the VPN client command settings
  ansible.builtin.template:
    src: vpn-client.conf.j2
    dest: /etc/openvpn/server/vpn-client.conf
    owner: root
    group: root
    mode: "0600"

- name: Create the client profile directory
  ansible.builtin.file:
    path: /root/openvpn-clients
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create the root SSH directory
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create this node's VPN sync key
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -t
      - ed25519
      - -N
      - ""
      - -f
      - /root/.ssh/id_ed25519_vpn
  args:
    creates: /root/.ssh/id_ed25519_vpn

- name: Read this node's VPN sync public key
  ansible.builtin.slurp:
    src: /root/.ssh/id_ed25519_vpn.pub
  register: vpn_sync_pub

- name: Record this node's VPN sync public key
  ansible.builtin.set_fact:
    vpn_sync_public_key: "{{ vpn_sync_pub.content | b64decode | trim }}"

- name: Authorize the peer VPN sync key
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    create: true
    owner: root
    group: root
    mode: "0600"
    line: "{{ hostvars[firewall_ha_peer.name]['vpn_sync_public_key'] }}"

# OpenSSH keeps the first value it finds. Hardening writes `Host *` / `Port 22`
# into this file. The peer include has to stay above that block or `vpn-peer`
# is reached on port 22, where sshd is not listening after harden.
- name: Include the VPN peer SSH settings above the default Host block
  ansible.builtin.blockinfile:
    path: /root/.ssh/config
    create: true
    owner: root
    group: root
    mode: "0600"
    insertbefore: BOF
    marker: "# {mark} IDOPS VPN PEER"
    block: "Include /root/.ssh/vpn-peer.conf"

- name: Remove a VPN peer include that was appended below Host *
  ansible.builtin.replace:
    path: /root/.ssh/config
    regexp: '(?m)(^# END ANSIBLE SSH CLIENT DEFAULTS\n)Include /root/\.ssh/vpn-peer\.conf\n?'
    replace: '\1'

- name: Write the VPN peer SSH settings
  ansible.builtin.template:
    src: vpn-peer.conf.j2
    dest: /root/.ssh/vpn-peer.conf
    owner: root
    group: root
    mode: "0600"

- name: Keep OpenVPN from starting at boot
  ansible.builtin.systemd:
    name: "openvpn-server@{{ item.name }}"
    enabled: false
    daemon_reload: true
  loop: "{{ openvpn_profiles }}"
  loop_control:
    label: "{{ item.name }}"

- name: Enable keepalived
  ansible.builtin.systemd:
    name: keepalived
    enabled: true
    state: started

- name: Flush keepalived restart before the VIP check
  ansible.builtin.meta: flush_handlers

- name: Name the node expected to hold the WAN VIP
  ansible.builtin.set_fact:
    firewall_ha_vip_node: "{{ (firewall_ha_nodes | sort(attribute='priority', reverse=true) | first).name }}"

# Only the higher-priority node is waited on. The standby never owns the
# VIP, and looking that fact up in hostvars raises before it exists.
- name: Wait until the preferred node holds the WAN VIP
  ansible.builtin.command:
    argv:
      - ip
      - -4
      - -o
      - addr
      - show
      - dev
      - "{{ firewall_wan_interface }}"
  register: firewall_ha_wan_addr
  changed_when: false
  retries: 8
  delay: 2
  until: firewall_ha_vip_wan in (firewall_ha_wan_addr.stdout | default(''))
  when: inventory_hostname == firewall_ha_vip_node

- name: Read the WAN address
  ansible.builtin.command:
    argv:
      - ip
      - -4
      - -o
      - addr
      - show
      - dev
      - "{{ firewall_wan_interface }}"
  register: firewall_ha_wan_addr
  changed_when: false

- name: Start OpenVPN on the node that holds the WAN VIP
  ansible.builtin.systemd:
    name: "openvpn-server@{{ item.name }}"
    state: >-
      {{
        'restarted'
        if (openvpn_server_config is changed)
        else 'started'
      }}
  loop: "{{ openvpn_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  when: firewall_ha_vip_wan in (firewall_ha_wan_addr.stdout | default(''))

- name: Stop OpenVPN on the node that does not hold the WAN VIP
  ansible.builtin.systemd:
    name: "openvpn-server@{{ item.name }}"
    state: stopped
  loop: "{{ openvpn_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  when: firewall_ha_vip_wan not in (firewall_ha_wan_addr.stdout | default(''))
