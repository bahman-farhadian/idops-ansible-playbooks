---
# Same package names on Debian 12/13 and Ubuntu 24.04/26.04.
# The release check in preflight.yml is what rejects other guests.
- name: Install BIND 9
  ansible.builtin.apt:
    name:
      - bind9
      - bind9-utils
      - bind9-dnsutils
    state: present
    update_cache: true
  notify: Restart named
