---
- name: Collect service facts
  ansible.builtin.service_facts:

- name: Pick the BIND systemd unit
  ansible.builtin.set_fact:
    bind_systemd_unit: "{{ 'named' if 'named.service' in ansible_facts.services else 'bind9' }}"

- name: Write named.conf.options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
  notify: Restart named

- name: Write named.conf.local
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0644"
  notify: Restart named

- name: Write the forward zone file
  ansible.builtin.template:
    src: db.zone.j2
    dest: "/etc/bind/db.{{ bind_zone }}"
    owner: bind
    group: bind
    mode: "0644"
  notify: Restart named

- name: Write the reverse zone file
  ansible.builtin.template:
    src: db.reverse.j2
    dest: "/etc/bind/db.{{ bind_reverse_zone }}"
    owner: bind
    group: bind
    mode: "0644"
  notify: Restart named
  when: bind_reverse_zone | default('') | length > 0

- name: Check named.conf
  ansible.builtin.command:
    argv:
      - named-checkconf
      - /etc/bind/named.conf
  changed_when: false

- name: Check the forward zone
  ansible.builtin.command:
    argv:
      - named-checkzone
      - "{{ bind_zone }}"
      - "/etc/bind/db.{{ bind_zone }}"
  changed_when: false

- name: Check the reverse zone
  ansible.builtin.command:
    argv:
      - named-checkzone
      - "{{ bind_reverse_zone }}"
      - "/etc/bind/db.{{ bind_reverse_zone }}"
  changed_when: false
  when: bind_reverse_zone | default('') | length > 0

- name: Enable and start named
  ansible.builtin.systemd:
    name: "{{ bind_systemd_unit | default('named') }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Flush handlers so named is running with this config
  ansible.builtin.meta: flush_handlers

- name: Wait until named answers on localhost
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - +time=2
      - +tries=3
      - "@127.0.0.1"
      - "{{ bind_ns_name }}.{{ bind_zone }}"
      - A
  register: bind_local_lookup
  until: bind_local_lookup.rc == 0 and (bind_local_lookup.stdout | trim | length) > 0
  retries: 12
  delay: 2
  changed_when: false

- name: Show the local lookup
  ansible.builtin.debug:
    msg: >-
      {{ bind_ns_name }}.{{ bind_zone }} is
      {{ bind_local_lookup.stdout | trim }}
      from 127.0.0.1.

- name: Wait until named answers on the guest IPv4
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - +time=2
      - +tries=3
      - "@{{ ansible_host }}"
      - "{{ bind_ns_name }}.{{ bind_zone }}"
      - A
  register: bind_lan_lookup
  until: bind_lan_lookup.rc == 0 and (bind_lan_lookup.stdout | trim | length) > 0
  retries: 12
  delay: 2
  changed_when: false

- name: Show the guest IPv4 lookup
  ansible.builtin.debug:
    msg: >-
      {{ bind_ns_name }}.{{ bind_zone }} is
      {{ bind_lan_lookup.stdout | trim }}
      from {{ ansible_host }}.
