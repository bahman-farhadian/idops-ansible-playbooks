# Two Docker containers: one control plane, one worker.
# extraPortMappings publish node :80 and :443 on the laptop at 8080 and 8443,
# which are unprivileged host ports.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ckad
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
