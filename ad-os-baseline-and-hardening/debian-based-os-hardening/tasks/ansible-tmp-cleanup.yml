---
# /tmp on these guests is tmpfs. Failed Ansible modules leave payload
# dirs there. Remove them so the next task does not share a full tmpfs
# with zram. Do not touch /var/tmp/.ansible — that is remote_tmp.
- name: Find leftover Ansible payload dirs on tmpfs /tmp
  ansible.builtin.find:
    paths:
      - /tmp
    patterns:
      - "ansible_*"
    file_type: any
    hidden: true
  register: debian_hardening_tmpfs_ansible_leftovers
  changed_when: false

- name: Remove leftover Ansible payload dirs from tmpfs /tmp
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ debian_hardening_tmpfs_ansible_leftovers.files }}"
  loop_control:
    label: "{{ item.path }}"
